# LIBERO 표준 nonproprio 9+9 VSA + detach된 termination 전용 bottleneck
# VLM 각 층 → 전용 reader 18층 → 종료 확률. Action Expert 연결 없음.
# 데이터셋·transition randomization은 ../stage1_common_config.yaml을 따름.
stage1_common: true
stage1_component: VSA

run:
  suffix: base


# Termination 실험 설정
# 기존 스킬 랜덤화·이전 스킬 UV·종료 후 10스텝 정답 규칙 유지.
# 전용 분기만 학습하며, 본류와 gradient clipping도 분리.
vlm_termination:
  enabled: true
  loss_weight: 1.0         # VLM에는 역전파하지 않음. 가중치는 폴더명에 자동 반영.
  target_sigma: 1.0
  positive_weight: 2.0
  post_end_steps: 10       # 스킬 종료 후 추가 양성 구간


# termbn_detach: 토큰 8개·폭 256·VLM과 같은 층 수의 독립 bottleneck.
architecture:
  name: UV_Bspline_denoising_dualbottleneck_pi05vlm_9_9_noproprio_termbn_detach
  end_pose_mode: xyz
  expert_variant: gemma_300m
  attention_backend: eager
  max_state_dim: 32
  max_action_dim: 32
  chunk_size: 10
  visual_bottleneck_tokens: 100
  visual_bridge_last_n_layers: 9
  spatial_loss_weight: 0.1

vision:
  dino_model: models/dinov3-vits16
  image_size: 224
  freeze: false

execution:
  action_steps: 5


# Action·full-skill 학습 (기존 통합 모델과 동일)
action_conditioning:
  training_skill_source: gt

mask_actions_after_skill_end: true

bspline:
  tokens: 30
  weight: 1.0

skill_flow:
  weight: 1.0
  chunk_multiplier: 3
  latent_best_of_n:
    enabled: false
    candidates: 5
    top_k: 1
    timesteps: 2
    ranking: main
    fp32: true

# 학습·저장
training:
  keep_checkpoints: 1
  protect_checkpoints: [50000, 100000]

  dataloader:
    batch_size: 16
    workers: 8
    prefetch_factor: 4
    gpus: 1

  optimizer:
    base_lr: 2.5e-05
    dino_lr_scale: 1.0

  gradient_checkpointing:
    action_expert: false
    skill_planner: false
    vlm: false
    vision: false

  schedule:
    steps: 100000
    lr_mode: warmup_constant
    warmup_steps: 1000
    log_every: 100
    save_every: 10000

  vsa_debug:
    every: 0
    initial: []


# 로깅·실행 자원
logging:
  wandb:
    enable: true
    project: VLA_stage1

slurm:
  gres: gpu:1
  cpus: 64
  memory: 256G
  time: '48:00:00'
