# LIBERO VSA PT — 아래 두 옵션으로 세 모델을 선택.
# 모델                               top_crop.enabled   bspline.gripper_action
# termbn_detach                       false              false
# termbn_detach_topcrop1p1_gripaction   true               true
# termbn_detach_gripaction             false              true   (현재)
# 이름의 topcrop1p1 / gripaction은 자동 추가됨.
# 데이터셋·transition randomization·기본 모델은 ../stage1_common_config.yaml에서 설정.
stage1_common: true
stage1_component: VSA

run:
  suffix: base


# Termination 전용 18층 bottleneck (토큰 8개, 폭 256)
# 기존 스킬 랜덤화·이전 스킬 UV·종료 후 10스텝 정답 규칙 유지.
# 전용 분기만 학습하며, 본류와 gradient clipping도 분리.
vlm_termination:
  enabled: true
  loss_weight: 1.0         # VLM에는 역전파하지 않음. 가중치는 폴더명에 자동 반영.
  target_sigma: 1.0
  positive_weight: 2.0
  post_end_steps: 10       # 스킬 종료 후 추가 양성 구간


architecture:
  name: UV_Bspline_denoising_dualbottleneck_pi05vlm_9_9_noproprio_termbn_detach
  attention_backend: eager
  chunk_size: 10
  visual_bottleneck_tokens: 100
  visual_bridge_last_n_layers: 9
  spatial_loss_weight: 0.1

vision:
  top_crop:
    enabled: false
    zoom: 1.1              # 학습: 샘플별 random crop / 평가: center crop
                           # Top UV 조건·visual aux UV·이전 스킬 termination UV를 함께 변환. XYZ/wrist 유지.

execution:
  action_steps: 5


# Action·full-skill 학습 (GT skill/UV 사용)
mask_actions_after_skill_end: true

bspline:
  tokens: 30
  weight: 1.0
  gripper_action: true  # true: pose 6D + gripper action 1D / false: 기존 proprio 8D

# 학습·저장
training:
  keep_checkpoints: 1
  protect_checkpoints: [50000, 100000]

  dataloader:
    batch_size: 16
    workers: 8
    prefetch_factor: 4
    gpus: 1

  optimizer:
    base_lr: 2.5e-05
    dino_lr_scale: 1.0

  gradient_checkpointing:
    action_expert: false
    skill_planner: false
    vlm: false
    vision: false

  schedule:
    steps: 100000
    lr_mode: warmup_constant
    warmup_steps: 1000
    log_every: 100
    save_every: 10000


# 로깅·실행 자원
logging:
  wandb:
    enable: true
    project: VLA_stage1

slurm:
  gres: gpu:1
  cpus: 16
  memory: 256G
  time: '48:00:00'
