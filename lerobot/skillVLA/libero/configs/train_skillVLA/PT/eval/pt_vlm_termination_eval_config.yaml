  max_skill_length: 200
video:
  raw: true
  record_skill_transitions: true
  fullskill_overlay: true
  max_per_task: 5
  frame_stride: 4
  fps: 10
  skill_videos: true
  grid_columns: 1
skill_html: true
skill_html_train_samples: 5
logging:
  wandb:
    enable: true
    project: VLA_stage1_eval
slurm:
  gres: gpu:1
  cpus: 8
  memory: 128G
  time: 08:00:00
