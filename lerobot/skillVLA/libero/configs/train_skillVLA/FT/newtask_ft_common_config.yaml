skillvla_backbone: pi05  # pi05 | groot_integrate | groot_seperate
# GR00T FT auto-selects the matching PT component/run (100k) from the PT YAML.
# Optional warm_start.backend_sources.<backend> can override its vsa_checkpoint/predictor_checkpoint.
run:
  # Optional suffix shared by FT VSA/Predictor.
  common_suffix: pcapt

dataset:
  skillvla_root: skillvla
  source: libero_10_full_full
  # build의 skillvla_data_mode에 맞춰 ft / ft_own을 선택. PCA: pt -> _pcapt.
  run: FSQ333_contrastive_2000_ft_grounded_pcapt
  # run: FSQ333_contrastive_2000_ft_own_grounded_pcapt
  relabeled: ""

  # 전체 데이터로 빌드한 뒤 FT에 사용할 에피소드만 선택. VSA·Predictor 공통.
  episode_selection: per_task
  n_episodes: 1  # task별 첫 1개씩, 총 10개. all=전체. episode_ids 지정 시 무시.
  episode_ids: []
  # 명시적으로 고를 때: 각 task 안에서 episode ID 순으로 세는 0-based 순번.
  # 바깥 목록은 task_index 오름차순(현재 0~9), 안쪽 []는 해당 task 제외.
  # 예: task마다 3개씩 선택. 지정하려면 위 episode_ids: []를 아래로 교체.
  # episode_ids: [[5, 1, 6], [3, 4, 6], [0, 1, 2], [0, 1, 2], [0, 1, 2],
  #               [0, 1, 2], [0, 1, 2], [0, 1, 2], [0, 1, 2], [1, 2, 4]]

# visualize_sbd.sh 전용. 학습 데이터 선택은 위 dataset 설정을 그대로 따름.
sbd_preview:
  builds:
    - {label: "기존 full_1 · ft", source: libero_10_full_1, run: FSQ333_contrastive_2000_ft_grounded}
    - {label: "full_full · ft · PT PCA", source: libero_10_full_full, run: FSQ333_contrastive_2000_ft_grounded_pcapt}
    - {label: "full_full · ft_own · PT PCA", source: libero_10_full_full, run: FSQ333_contrastive_2000_ft_own_grounded_pcapt}

# Transition randomization은 각 모델의 warm-start PT 체크포인트에서 상속.

warm_start:
  vsa_checkpoint: {run: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_UV_Bspline_denoising_dualbottleneck_pi05vlm_9_9_noproprio_termbn_detach_vlmtermGT_k10_s1_pw2_w1_vlast9_gripaction_base, checkpoint: "100000"}
  # Scalar = one Predictor FT; list = independent simultaneous FT on ONE GPU.
  # VSA ignores this Predictor selection.
  predictor_checkpoint: {run: bs16_FSQ333_contrastive_2000_pt_grounded_libero_90_full_full_predictor_uv_fullvlm_mode2_uvclip, checkpoint: "100000"}
fsq: {verify_source: true}
