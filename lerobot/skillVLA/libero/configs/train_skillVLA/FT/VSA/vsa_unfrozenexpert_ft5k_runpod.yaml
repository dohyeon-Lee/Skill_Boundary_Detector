newtask_ft: true
stage1_component: VSA
run:
  suffix: fullloss_unfrozenexpert5k
adaptation:
  train_dino: true
  dino_lr_scale: 1.0
  freeze_expert: false
  train_bridge_layers_and_head: false
  skill_flow_loss: true
  visual_aux_loss: true
  full_unfreeze: true
training:
  dataloader:
    batch_size: 16
    workers: 8
    gpus: 1
  optimizer:
    base_lr: 2.5e-05
  gradient_checkpointing: false
  checkpoint_archive: ''
  keep_checkpoints: 1
  protect_checkpoints:
  - 1000
  - 3000
  - 5000
  schedule:
    steps: 5000
    lr_mode: warmup_constant
    warmup_steps: 500
    log_every: 100
    save_every: 1000
  vsa_debug:
    every: 2000
    initial:
    - 1
    - 100
logging:
  wandb:
    enable: true
    project: VLA_NewTask_FT
slurm:
  gres: gpu:1
  cpus: 16
  memory: 128G
  time: '48:00:00'
dataset:
  skillvla_root: skillvla
  source: libero_10_full_1
  run: FSQ333_contrastive_2000_ft_grounded
  relabeled: ''
transition_randomization:
  enabled: true
  percent: 25
  distribution: half_normal
  preserve_gripper: true
warm_start:
  vsa_checkpoint:
    run: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_UV_Bspline_denoising_dualbottleneck_pi05vlm_9_9_noproprio_vlast9_base
    checkpoint: '100000'
fsq:
  verify_source: true
transition_oversampling:
  enabled: false
  percent: 25
  distribution: uniform
  weight: 2.0
runpod_watchdog:
  enabled: true
  keep: 1
  protect:
  - 1000
  - 3000
  - 5000
