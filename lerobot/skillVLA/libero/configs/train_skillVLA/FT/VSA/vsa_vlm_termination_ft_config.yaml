# Official VSA FT settings, integrated termination 100k warm start, no oversampling.
# data2 stores this run because data1 cannot hold all protected checkpoints.
newtask_ft_common: true
newtask_ft: true
stage1_component: VSA
run:
  suffix: fullloss
adaptation:
  train_dino: true
  dino_lr_scale: 1.0
  freeze_expert: true
  train_bridge_layers_and_head: false
  skill_flow_loss: false
  visual_aux_loss: true
training:
  dataloader:
    batch_size: 16
    workers: 8
    gpus: 1
  optimizer:
    base_lr: 2.5e-05
  gradient_checkpointing: true
  checkpoint_archive: ''
  keep_checkpoints: 1
  protect_checkpoints:
  - 1000
  - 3000
  - 5000
  - 7000
  - 10000
  - 20000
  schedule:
    steps: 20000
    lr_mode: warmup_constant
    warmup_steps: 500
    log_every: 100
    save_every: 10000
  vsa_debug:
    every: 2000
    initial:
    - 1
    - 100
logging:
  wandb:
    enable: true
    project: VLA_NewTask_FT
slurm:
  gres: gpu:B200:1
  cpus: 16
  memory: 128G
  time: '48:00:00'
transition_oversampling:
  enabled: false
warm_start:
  vsa_checkpoint: /data1/dohyeon/Skill_Boundary_Detector/outputs_filtered/skillVLA_PT/VSA/bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_UV_Bspline_denoising_dualbottleneck_pi05vlm_9_9_noproprio_vlmtermGT_k10_s1_pw2_w1_vlast9_base/checkpoints/100000/pretrained_model
outputs_root: /data2/dohyeon/Skill_Boundary_Detector_outputs
