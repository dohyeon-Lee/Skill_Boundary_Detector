# Match the saved standard non-proprio frozen-Expert FT training settings.
# Warm start comes from newtask_ft_common_config.yaml; output storage follows global config.
# The corrected loss adds _skillbspline to the output name.
newtask_ft_common: true
stage1_component: VSA

run:
  suffix: ""

adaptation:
  freeze_expert: true
  skill_flow_loss: true
  visual_aux_loss: true
  termination_loss: true   # 통합 detach termination bottleneck도 함께 FT (가중치 1)

training:
  dataloader:
    batch_size: 16
    workers: 8
    persistent_workers: true
    multiprocessing_context: spawn
    gpus: 1
  optimizer:
    base_lr: 2.5e-05  
  gradient_checkpointing:
    vlm: true            # LLM
    vision: false         # Vision encoder
    action_expert: false  # Action expert
  checkpoint_archive: ''
  keep_checkpoints: 1
  protect_checkpoints: [3000, 5000, 10000, 20000]
  schedule:
    steps: 20000
    lr_mode: warmup_constant
    warmup_steps: 500
    log_every: 100
    save_every: 10000
  vsa_debug:
    every: 2000
    initial: [1, 100]

logging:
  wandb:
    enable: true
    project: VLA_NewTask_FT

slurm:
  gres: gpu:B200:1
  cpus: 16
  memory: 128G
  time: '48:00:00'

transition_oversampling:
  enabled: false
