# LIBERO VSA FT — 세 모델 모두 같은 설정 사용.
# 구조·top crop·full-skill gripper 표현·정규화 통계는 PT 체크포인트에서 상속.
# ../newtask_ft_common_config.yaml에서 warm_start.vsa_checkpoint와 학습 데이터를 선택.
# 저장 위치·서버 설정은 global config를 따름.
newtask_ft_common: true
stage1_component: VSA

adaptation:
  freeze_expert: true
  skill_flow_loss: true
  visual_aux_loss: true
  termination_loss: true  # detach된 termination 분기도 함께 학습

training:
  dataloader:
    batch_size: 16
    workers: 8
    gpus: 1
  optimizer:
    base_lr: 2.5e-05
  gradient_checkpointing:
    vlm: true             # LLM
    vision: false         # Vision encoder
    action_expert: false  # Action Expert
  keep_checkpoints: 1
  protect_checkpoints: [3000, 5000, 10000, 20000]
  schedule:
    steps: 20000
    lr_mode: warmup_constant
    warmup_steps: 500
    log_every: 100
    save_every: 10000
  vsa_debug:
    every: 2000
    initial: [1, 100]

logging:
  wandb:
    enable: true
    project: VLA_NewTask_FT

slurm:
  gres: gpu:1
  cpus: 16
  memory: 128G
  time: '48:00:00'
