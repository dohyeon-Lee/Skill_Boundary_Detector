# LIBERO DP eval의 SBD 설정으로 전체 데이터셋 빌드. Terminal mask는 24프레임 사용.
# eval의 task_ids / n_episodes 제한은 적용하지 않음.
target_dataset: libero_90_full_full


# DP 모델: history 20 / prediction 24 / Transformer small.
# checkpoint에서 길이·proprio grounding을 읽고, 예측 24스텝 전체 사용(all).
dp_run_name: libero_90_full_full_grounded_future_only_obs20_future24_transformer_constLR_small_fresh
dp_checkpoint: "100000"


# SBD: current_gt Gaussian → x0hat(step 7) → GMM → global mean 경계.
# gaussian_x0hat 전체 빌드의 Gaussian 중심 기본값은 current_gt.
# PCA는 DP 학습 데이터와 같은 libero_90_full_full 전체로 fit(dataset).
skillset_mode: gaussian_x0hat
skillset_dn_step: 7
skillset_replan_interval: 5
skillset_n_gmm: 5
skillset_nms_dist: 15
skillset_smooth_window: 7
skillset_savgol_polyorder: 4
skillset_score_power: 1

# Initial mask는 checkpoint history인 20프레임을 자동 적용.
# Curvature 필터는 eval의 peak_curvature_scale: 0과 동일하게 사용하지 않음.
skillset_terminal_mask_frames: 24
skillset_min_skill_len: 10
skillset_min_skills: 1
skillset_boundary_threshold_mode: global_mean
skillset_boundary_threshold_scale: 1.0


# Probe·PCA·GMM 세부 설정: 현재 eval의 숨긴 기본값과 동일.
skillset_probe_count: 96
skillset_probe_generation: scheduler_gaussian
skillset_gaussian_sampling: iid
skillset_gaussian_include_mean: false
skillset_gaussian_seed: 42
skillset_denoise_steps: 1
skillset_denoise_output: pred_original_sample
skillset_pca_variance: 0.95
skillset_pca_stride: 3
skillset_score_metric: covariance_gated_cosine
skillset_gmm_covariance: diag
skillset_gmm_n_init: 10
skillset_gmm_max_iter: 300
skillset_gmm_weighted: true
skillset_action_mode: dataset
skillset_gripper_mode: discrete
skillset_gripper_indices: [-1]


# 저장: global dataset_root / FSQ_dataset / <dataset> / FSQ_inputs / seg_* / skillset
fsq_dataset_root: FSQ_dataset
fsq_inputs_name: FSQ_inputs
skillset_name: skillset
skillset_output_suffix: ""


# GPU 1개 안에서 에피소드 길이에 따라 워커에 분배. 0이면 기존 GPU array 방식.
# 각 워커의 CPU 스레드 수는 전체 CPU 예산 / 동시 워커 수로 제한.
# partition / QoS / node는 global에서 읽음.
slurm_gres: gpu:1
skillset_wandb_project: ""
skillset_single_gpu_workers: 16
skillset_cpus_per_task: 16
skillset_mem: 64G
skillset_time: "8:00:00"

# GPU array 방식을 선택했을 때만 사용하는 task 분할 단위.
skillset_tasks_per_job: 5
