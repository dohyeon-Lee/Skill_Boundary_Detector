# Dataset and transition randomization: ../stage1_common_config.yaml
stage1_common: true
stage1_component: Terminator
mode: pt
run:
  suffix: ''
warm_start:
  fsq_terminator: false
  predictor_checkpoint: ''
  terminator_checkpoint: ''
fsq_terminator:
  architecture: Term_Token_1_dinoS_freeze
termination_loss:
  target_sigma: 1.5
  positive_weight: 2.0
  post_end_steps: 15
skill_predictor:
  train: false
training:
  dataloader:
    batch_size: 32
    workers: 8
    gpus: 1
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: true
  optimizer:
    base_lr: 2.5e-05
    terminator_lr_scale: 1.0
    predictor_lr_scale: 1.0
    predictor_lora_lr_scale: 10.0
    predictor_vlm_lr_scale: 1.0
    grad_clip_norm: 1.0
  gradient_checkpointing: false
  schedule:
    steps: 100000
    lr_mode: warmup_constant
    warmup_steps: 2500
    lr_decay_steps: 50000
    log_every: 100
    save_every: 10000
  keep_checkpoints: 1
  protect_checkpoints:
  - 50000
  - 100000
logging:
  wandb:
    enable: true
    project: VLA_auxiliary_ABC
slurm:
  gres: gpu:1
  cpus: 16
  memory: 96G
  time: '24:00:00'
