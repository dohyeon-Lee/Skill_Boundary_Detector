# Dataset and FSQ come from ../stage1_common_config.yaml:
# put_relative / absolute_joint / original / epoch 2000 / FSQ3332.
stage1_common: true
stage1_component: VSA

# LIBERO와 같은 독립 termination bottleneck. VLM/Expert로 역전파하지 않으며
# 본류와 gradient clipping도 분리. 종료 시점·이전 스킬 조건은 GT 기준.
vlm_termination:
  enabled: true
  loss_weight: 1.0
  target_sigma: 1.0
  positive_weight: 2.0
  post_end_steps: 10

run: {suffix: ""}

vision:
  dino_model: models/dinov3-vits16
  image_size: 224
  freeze: false

architecture:
  # Same current LIBERO main model; only the explicit ABC interfaces below differ.
  name: UV_Bspline_denoising_dualbottleneck_pi05vlm_9_9_noproprio_termbn_detach
  expert_variant: gemma_300m
  attention_backend: eager
  max_state_dim: 32
  max_action_dim: 32
  chunk_size: 30
  visual_bottleneck_tokens: 100
  visual_bridge_last_n_layers: 9
  spatial_loss_weight: 0.1
  image_keys:
    - observation.images.top
    - observation.images.left_wrist
    - observation.images.right_wrist
  plan_state_dim: 14
  bimanual_spatial_auxiliary: true

mask_actions_after_skill_end: true
cumulative_xyz_loss: {enabled: false, weight: 0.5}
skill_flow:
  weight: 1.0
  chunk_multiplier: 3
  latent_best_of_n: {enabled: false, candidates: 5, top_k: 1, timesteps: 2, ranking: main, fp32: true}
action_conditioning: {training_skill_source: gt}
bspline: {tokens: 30, weight: 1.0}
execution: {action_steps: 15}

training:
  keep_checkpoints: 1
  protect_checkpoints: [50000, 100000]
  dataloader: {batch_size: 16, workers: 8, prefetch_factor: 4, gpus: 1}
  optimizer: {base_lr: 2.5e-05, dino_lr_scale: 1.0, muon: false}
  gradient_checkpointing:
    action_expert: false
    skill_planner: false
    vlm: false
    vision: false
  schedule: {steps: 100000, lr_mode: warmup_constant, warmup_steps: 1000, log_every: 100, save_every: 10000}
  vsa_debug: {every: 0, initial: []}

logging:
  wandb: {enable: true, project: VLA_stage1_ABC}

slurm: {gres: "gpu:1", cpus: 16, memory: 256G, time: "72:00:00"}

