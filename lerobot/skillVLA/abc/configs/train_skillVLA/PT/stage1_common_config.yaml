dataset:
  skillvla_root: skillvla
  source: abc_sim_all
  # put_relative; absolute_joint / original FSQ, epoch 2000, levels [3, 3, 3, 2].
  run: FSQ3332_contrastive_2000_pt_put_relative_absolute_joint_jit30

# The build stores the maximum +/-30 state window. Training selects the
# LIBERO-equivalent ABC runtime range without rebuilding the dataset.
transition_randomization:
  enabled: true
  pmax_step: 23
  distribution: half_normal
  preserve_gripper: false

run:
  common_suffix: ""

warm_start:
  pi_base: models/pi05_base
  tokenizer: models/paligemma-3b-pt-224-tokenizer

