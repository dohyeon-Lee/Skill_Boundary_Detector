# ABC whole-skill FSQ. SBD boundaries come from the selected 100k delta-joint
# DP artifact. Saved skills retain raw actions; the option below chooses the
# FSQ encoder/reconstructor representation without rebuilding the skillset.

# ── Data artifact ─────────────────────────────────────────────────────────────
target_dataset: abc_sim_all
abc_source_tasks: [grab_clutter]
fsq_dataset_root: FSQ_dataset
fsq_inputs_name: FSQ_inputs
skillset_seg_name: seg_abc_sim_all_task-grab_clutter_delta-joint_future_only_obs60_future36_transformer_constLR_small_ck100000_gaussian_x0hat_globalmean_100p_abc-standard
# skillset_seg_name: seg_abc_sim_all_task-grab_clutter_delta-joint_future_only_obs60_future36_gru_iid_constLR_ck100000_gaussian_x0hat_globalmean_100p_abc-standard
skillset_name: skillset

# DP/SBD provenance is read from the selected folder's skillset_manifest.json.

# ── Architecture / codebook ──────────────────────────────────────────────────
fsq_exp: abc_grab_clutter_delta_joint_jit30
fsq_action_space: delta_joint  # absolute_joint | delta_joint (DP와 동일한 joint delta, gripper는 absolute)
# delta_joint: 첫 action - 시작 state, 이후 action 간 차분. 기존 skillset 재사용.
# delta를 선택하면 fsq_exp의 _absolute는 _delta_joint로 바뀌어 별도 폴더에 저장.
fsq_quantizer: {type: fsq, levels: [3, 3, 3, 2]}
fsq_hidden_dim: 256
fsq_num_layers: 2

# Absolute uses grab_clutter q01/q99; delta uses transformed skill q01/q99.
# Both gripper axes [6,13] receive this MSE weight; the indices are taken from
# the immutable skillset manifest rather than repeated here.
fsq_autoencoder: {mode: norm_action, gripper_weight: 0.1}
fsq_start_state_conditioning: none
fsq_decoder_reconstructor: true
fsq_terminator: {architecture: default, termination: false}

# ── Code assignment / losses ─────────────────────────────────────────────────
fsq_init_calibration: {enabled: true, gain: 1.0, samples: 0}
fsq_pair_loss: {type: contrastive, weight: 0.1, inv_temperature: 5.0}
fsq_route_loss: {enabled: true}
fsq_action_loss: {weight: 1.0}
fsq_end_loss: {weight: 1.0, target_sigma: 0.0, positive_weight: 1.0}
fsq_pair_warmup: {enabled: true, epochs: 50, ramp_epochs: 50}

# Boundary augmentation: the historical SkillVLA FSQ recipe with one shared
# ABC limit. Every start/end and early/late direction inherits 15 frames
# (0.5 seconds at 30 Hz); offset magnitude uses a half-normal distribution.
# fsq_boundary_aug_pmax: 15
fsq_boundary_aug_pmax: 30
# ── Optimization ─────────────────────────────────────────────────────────────
fsq_lr: 3.0e-6
fsq_lr_schedule: constant
fsq_batch_size: 64
fsq_num_epochs: 2000
fsq_samples_per_skill: 1
fsq_termination_stratified_sampling: false
fsq_num_workers: 24
fsq_val_num_workers: 0
fsq_val_every: 25
fsq_checkpoint_every: 500
fsq_save_best_model: false
fsq_gradient_checkpointing: false

# Reconstructor-only FSQ never reads RGB or DINO features.
fsq_frame_cache_enabled: false
fsq_frame_cache_stage_local: false
fsq_dino_features: {enabled: false, batch_size: 256}
fsq_route_batching: {enabled: false, chunk_size: 27}

# ── Slurm / logging ──────────────────────────────────────────────────────────
fsq_train_gres: gpu:1
fsq_train_cpus_per_task: 32
fsq_train_mem: 96G
fsq_train_time: "48:00:00"
fsq_wandb_project: VAE_train_ABC
