# FSQ codebook evaluation for the selected ABC grab_clutter checkpoint.
# Model architecture, quantizer levels, and training skillset come from the checkpoint.

fsq_eval_workspace: lerobot/skillVLA/abc/configs/train_skills/FSQ/eval
# HTML label follows run_name; output is outputs/<run_name>/epochNNNN/index.html.
fsq_eval_models:
  - run_name: FSQ3332_contrastiveON_routeON_loss_abc_grab_clutter_absolute_joint_jit30
fsq_eval_checkpoint: 2000

# ABC episodes are read directly from abc_sim_all metadata and official stacked
# camera videos. task_ids are the 24 language prompts inside grab_clutter.
episode_source: dataset
target_task: grab_clutter
task_ids: [59, 60, 61, 62, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 75, 76, 77, 78, 79, 80, 81, 82]
episodes_per_task: 5
episode_selection: first
episode_ids: []
seed: 42

# One GPU prepass encodes all missing checkpoints. The HTML replay itself is
# CPU-only and displays inline top-view skill videos by FSQ code.
boundary_jitter_sweep: true
terminator_visualization: false
checkpoints_per_job: all
workers_per_checkpoint: 1
eval_max_concurrent: 1
resume: true

slurm:
  gres: gpu:1
  latents_time: "04:00:00"
  replay_profile: cpu
  replay_gres: ""
  replay_cpus: 4
  replay_memory: 16G
  cpus: 8
  memory: 64G
  time: "02:00:00"
