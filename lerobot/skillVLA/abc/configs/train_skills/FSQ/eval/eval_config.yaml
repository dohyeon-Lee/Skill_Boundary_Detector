# ABC put_relative: compare the three completed 2000-epoch FSQ models.
# Model architecture, quantizer levels, and training skillset come from the checkpoint.

fsq_eval_workspace: lerobot/skillVLA/abc/configs/train_skills/FSQ/eval
# Each run keeps its own report; the comparison page is under output_name/compare.
fsq_eval_models:
  - run_name: FSQ3332_contrastiveON_routeON_loss_abc_put_relative_absolute_joint_jit30
  - run_name: FSQ3332_contrastiveON_routeON_loss_abc_put_relative_delta_joint_jit30_delta_joint_separate_full
  - run_name: FSQ3332_contrastiveON_routeON_loss_abc_put_relative_absolute_joint_jit30_separate_full
fsq_eval_checkpoint: 2000
output_name: abc_put_relative_fsq3332_epoch2000

# ABC episodes are read directly from abc_sim_all metadata and official stacked
# camera videos. Use every training prompt with at least five skill episodes.
episode_source: dataset
target_task: put_relative
task_ids: all
episodes_per_task: 5
episode_selection: first
episode_ids: []
seed: 42

# One GPU prepass encodes all missing checkpoints. The HTML replay itself is
# CPU-only and displays inline top-view skill videos by FSQ code.
boundary_jitter_sweep: true
terminator_visualization: false
checkpoints_per_job: all
workers_per_checkpoint: 1
eval_max_concurrent: 1
resume: true

slurm:
  gres: gpu:1
  latents_time: "04:00:00"
  replay_profile: cpu
  replay_gres: ""
  replay_cpus: 4
  replay_memory: 16G
  cpus: 8
  memory: 64G
  time: "02:00:00"
