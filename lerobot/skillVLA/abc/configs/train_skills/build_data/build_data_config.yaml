# Build ABC-standard SBD with grab_clutter DP100k in EEF delta-pose space.
target_dataset: abc_sim_all
abc_source_tasks: [grab_clutter]

# Must match the ABC DP run produced by train_skills/DP/dp_config.yaml.
dp_run_name: abc_sim_all_task-grab_clutter_delta-pose-eef_future_only_obs30_future36_transformer_constLR_small
dp_checkpoint: "100000"
dp_n_obs_steps: 30
dp_future_action_horizon: 36
dp_action_sequence_mode: future_only
dp_history_encoder: transformer
dp_history_encoder_dim: 128
dp_unet_size: small
dp_lr_scheduler: constant
dp_vision: state

fsq_dataset_root: FSQ_dataset
fsq_inputs_name: FSQ_inputs
skillset_name: skillset

# SBD post-processing profile:
#   libero_standard: power2, SG 7/4, ABC release/home-return terminal mask
#   abc_standard:    power1, SG 8/4, detected terminal release minus 8 frames
skillset_sbd_profile: abc_standard

# Final SBD detector, adapted from 20 Hz LIBERO to 30 Hz ABC time intervals.
skillset_mode: gaussian_x0hat
# Must match the DP checkpoint: dataset | anchor_relative | delta_joint | delta_pose
skillset_action_mode: delta_pose
skillset_relative_exclude_joints: [gripper]
skillset_gripper_mode: continuous
skillset_gripper_indices: [6, 13]
skillset_replan_interval: 8
skillset_nms_dist: 23
skillset_min_skill_len: 15

skillset_wandb_project: ""

# One GPU; episodes are automatically balanced across this many workers.
skillset_single_gpu_workers: 48
skillset_cpus_per_task: 48
skillset_mem: 96G
skillset_time: "24:00:00"
slurm_gres: gpu:1
