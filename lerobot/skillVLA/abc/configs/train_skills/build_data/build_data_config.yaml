# Full grab_clutter build matching current DP/eval/eval_config.yaml:
# Transformer small, obs60/future36, current_gt, 36/15/5/45/7/4/1, curvature off.
# All grab_clutter episodes; no evaluation-only 5-episode limit.
target_dataset: abc_sim_all
abc_source_tasks: [grab_clutter]

# Same checkpoint selected in DP/eval/eval_config.yaml.
dp_run_name: abc_sim_all_task-grab_clutter_delta-joint_future_only_obs60_future36_transformer_constLR_small
dp_checkpoint: "100000"
dp_n_obs_steps: 60
dp_future_action_horizon: 36
dp_action_sequence_mode: future_only
dp_history_encoder: transformer
dp_history_encoder_dim: 128
dp_unet_size: small
dp_lr_scheduler: constant
dp_vision: state

fsq_dataset_root: FSQ_dataset
fsq_inputs_name: FSQ_inputs
skillset_name: skillset

# SBD post-processing profile:
#   libero_standard: power2, SG 7/4, ABC release/home-return terminal mask
#   abc_standard:    power1, SG 7/4, detected terminal release minus 8 frames
skillset_sbd_profile: abc_standard

# Final SBD detector, adapted from 20 Hz LIBERO to 30 Hz ABC time intervals.
skillset_mode: gaussian_x0hat
# Must match the DP checkpoint: dataset | anchor_relative | delta_joint | delta_pose
skillset_action_mode: delta_joint
skillset_relative_exclude_joints: [gripper]
skillset_gripper_mode: continuous
skillset_gripper_indices: [6, 13]
skillset_replan_interval: 15
skillset_nms_dist: 45
skillset_min_skill_len: 15

# Exact probe/GMM recipe from the saved eval: full future36, 14D std PCA
# including grippers, current GT action sequence, no centering of
# fitted GMM modes, and ordinary weighted cosine (without covariance gating).
# The selected DP was trained on all grab_clutter episodes, so the full-build
# task PCA covers the same episodes as eval's pca_scope: dataset.
skillset_gaussian_center: current_gt
skillset_probe_count: 96
skillset_gaussian_include_mean: false
skillset_gaussian_seed: 42
skillset_pca_variance: 0.95
skillset_pca_stride: 3
skillset_dn_step: 7
skillset_denoise_steps: 1
skillset_denoise_output: pred_original_sample
skillset_n_gmm: 5
skillset_gmm_covariance: diag
skillset_gmm_n_init: 10
skillset_gmm_max_iter: 300
skillset_min_effective_samples: 0
skillset_gmm_weighted: true
skillset_score_metric: cosine
# abc_standard fixes smooth_window=7, polyorder=4, score_power=1.
skillset_boundary_threshold_mode: global_mean
skillset_boundary_threshold_scale: 1.0

skillset_wandb_project: ""

# One GPU; episodes are automatically balanced across this many workers.
skillset_single_gpu_workers: 24
skillset_cpus_per_task: 24
skillset_mem: 96G
skillset_time: "24:00:00"
slurm_gres: gpu:1
