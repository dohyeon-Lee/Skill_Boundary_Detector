# Fair descriptor-horizon comparison. Each horizon gets a PCA fitted from the
# same grab_clutter source episodes at that horizon. The DP checkpoint and
# generated 36-step trajectories are unchanged. Mean and q75 thresholds reuse
# the same inferred score caches, so their difference is post-processing only.
ablations: [horizon_pca_threshold]
output_name: abc_grab_clutter_descriptor_horizon_1_4_8_ownpca_mean_vs_q75_replan8_100k

target_dataset: abc_sim_all
fsq_dataset_root: FSQ_dataset
fsq_inputs_name: FSQ_inputs
skillset_seg_name: seg_abc_sim_all_task-grab_clutter_delta-joint_future_only_obs30_future36_transformer_constLR_small_ck100000_gaussian_x0hat_globalmean_100p_abc-standard
skillset_name: skillset

task_id_space: dataset
target_task: grab_clutter
task_ids: [59]
n_episodes: 5
resume: true
seed: 42
threshold_calibration: {source: selected, expected_episodes: 5}

report_image_key: observation.images.top
split_report_by_group: true
split_report_by_task: true
overlay_experiment_curves: true
report_compare_limit: 3
report_compare_columns: 3
report_consistency_metrics: true
report_consistency_tolerance_frames: 8

pca_variance: 0.95
pca_stride: 3

probe_variants:
  - {name: iid96_r8_h1_ownpca, mode: manifest, probe_generation: scheduler_gaussian, gaussian_sampling: iid, gaussian_include_mean: false, gaussian_seed: 42, count: 96, eval_at_step: 7, denoise_steps: 1, denoise_output: pred_original_sample, replan_interval: 8, descriptor_mode: manifest, descriptor_pca_representation: mean, descriptor_pca_variance: 0.95, descriptor_pca_stride: 3, descriptor_pca_temporal_length: 1, descriptor_temporal_length: 1, descriptor_temporal_bins: 1, descriptor_include_endpoint: false}
  - {name: iid96_r8_h4_ownpca, mode: manifest, probe_generation: scheduler_gaussian, gaussian_sampling: iid, gaussian_include_mean: false, gaussian_seed: 42, count: 96, eval_at_step: 7, denoise_steps: 1, denoise_output: pred_original_sample, replan_interval: 8, descriptor_mode: manifest, descriptor_pca_representation: mean, descriptor_pca_variance: 0.95, descriptor_pca_stride: 3, descriptor_pca_temporal_length: 4, descriptor_temporal_length: 4, descriptor_temporal_bins: 1, descriptor_include_endpoint: false}
  - {name: iid96_r8_h8_ownpca, mode: manifest, probe_generation: scheduler_gaussian, gaussian_sampling: iid, gaussian_include_mean: false, gaussian_seed: 42, count: 96, eval_at_step: 7, denoise_steps: 1, denoise_output: pred_original_sample, replan_interval: 8, descriptor_mode: manifest, descriptor_pca_representation: mean, descriptor_pca_variance: 0.95, descriptor_pca_stride: 3, descriptor_pca_temporal_length: 8, descriptor_temporal_length: 8, descriptor_temporal_bins: 1, descriptor_include_endpoint: false}

cluster_variants:
  - {name: k5_diag_s0, selection: fixed, k: 5, covariance: diag, n_init: 10, max_iter: 300, min_effective_samples: 0, weighted: true}

# Both variants retain the selected ABC release/home-return terminal handling.
# q75 means the 75th percentile of each horizon's pooled eligible score values.
boundary_variants:
  - {name: abc_mean_r8, method: peak, score_power: 1.0, threshold: mean, threshold_scope: dataset, threshold_scale: 1.0, smooth_window: 8, polyorder: 4, nms_frames: 23, prominence: 0.0, terminal_mask_frames: 0, terminal_mask_mode: abc_terminal_release, min_skill_len: 15}
  - {name: abc_q75_r8, method: peak, score_power: 1.0, threshold: quantile, threshold_quantile: 0.75, threshold_scope: dataset, threshold_scale: 1.0, smooth_window: 8, polyorder: 4, nms_frames: 23, prominence: 0.0, terminal_mask_frames: 0, terminal_mask_mode: abc_terminal_release, min_skill_len: 15}

experiments:
  - {name: mean_h01, ablation: horizon_pca_threshold, report_group: own_pca_mean, probe: iid96_r8_h1_ownpca, cluster: k5_diag_s0, metric: cosine, boundary: abc_mean_r8}
  - {name: mean_h04, ablation: horizon_pca_threshold, report_group: own_pca_mean, probe: iid96_r8_h4_ownpca, cluster: k5_diag_s0, metric: cosine, boundary: abc_mean_r8}
  - {name: mean_h08, ablation: horizon_pca_threshold, report_group: own_pca_mean, probe: iid96_r8_h8_ownpca, cluster: k5_diag_s0, metric: cosine, boundary: abc_mean_r8}
  - {name: q75_h01, ablation: horizon_pca_threshold, report_group: own_pca_q75, probe: iid96_r8_h1_ownpca, cluster: k5_diag_s0, metric: cosine, boundary: abc_q75_r8}
  - {name: q75_h04, ablation: horizon_pca_threshold, report_group: own_pca_q75, probe: iid96_r8_h4_ownpca, cluster: k5_diag_s0, metric: cosine, boundary: abc_q75_r8}
  - {name: q75_h08, ablation: horizon_pca_threshold, report_group: own_pca_q75, probe: iid96_r8_h8_ownpca, cluster: k5_diag_s0, metric: cosine, boundary: abc_q75_r8}

rollout: {enabled: false}
prediction_loss: {enabled: false}

eval_gres: gpu:1
eval_cpus_per_task: 8
eval_mem: 64G
eval_time: "04:00:00"
