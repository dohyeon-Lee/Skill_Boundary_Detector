# RLLAB server (Slurm). Selected automatically when the checkout lives under a detect: prefix
# (see ../libero/configs/src/global_config_loader.py); override with SBD_SERVER=rllab. project_root = the checkout.
# Keep this file flat (key: value / - item); pyyaml may be absent.

detect:
  - /data1/dohyeon
  - /data2/dohyeon

scheduler: slurm
slurm_submit_mode: srun
srun_gpu_memory_guard: true
# Free VRAM reserve in GiB. Other guard thresholds follow this value automatically.
srun_gpu_reserve_gib: 0.3
# 기존 GPU에 추가 학습/eval: 아래 두 줄을 켜고 위 slurm_submit_mode는 주석 처리.
# srun_job_id는 squeue에서 RUNNING인 본인 잡 ID로 변경. 별도 tmux + 공유 GPU step으로 실행.
# slurm_submit_mode: srun_existing
# srun_job_id: "68847"
# 일회성: ./submit_train.sh --68847 <model>
# 평가: eval 폴더에서 ./submit_eval.sh --68847 실행. 추가 GPU는 요청하지 않음.
# ABC/LIBERO의 submit*.sh에 공통 적용되며, 기존 옵션과 함께 쓸 수 있음.
# 배열/의존성 빌드는 기존 할당 재사용을 지원하지 않으면 새 잡 없이 오류로 중단.

# --- Slurm common defaults (canonical; every module reads these) ---
train_partition: debug
train_qos: base_qos
train_nodelist: node200
train_exclude_nodes: []
