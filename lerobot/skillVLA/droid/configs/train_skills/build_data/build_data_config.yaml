# 데이터셋·그룹: global_config.yaml의 droid_dataset 선택을 따름.
# Joint DP100k. Obs30 / future18, 15Hz.
dp_run_name: '{source_dataset}_delta_joint_future_only_obs30_future18_transformer_constLR_small{droid_group_suffix}'
dp_checkpoint: '100000'

# 경계 검출 — 현재 Joint 13/10 평가와 동일.
skillset_smooth_window: 13
skillset_savgol_polyorder: 10
skillset_score_power: 1
initial_mask: false
skillset_terminal_mask_frames: 0
skillset_replan_interval: 8
skillset_n_gmm: 5
skillset_nms_dist: 23  # ceil(VLA chunk 15 * 1.5)
skillset_min_skill_len: 10

# GPU 1개에서 에피소드를 자동 분할. CPU는 전체 워커가 공유하는 예산.
skillset_single_gpu_workers: 8
skillset_cpus_per_task: 16

# Probe·PCA·GMM 세부값과 저장 경로는 내부 기본값 사용.
# 선택 그룹 전체의 global mean을 계산하며, 출력 이름은 위 설정에서 자동 생성.
