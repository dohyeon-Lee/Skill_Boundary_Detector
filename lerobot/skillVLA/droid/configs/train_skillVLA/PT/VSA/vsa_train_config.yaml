stage1_common: true
stage1_component: VSA
run: {suffix: base}

# Same 9+9 nonproprio / detached-termination model as the running LIBERO gripaction PT.
architecture:
  name: UV_Bspline_denoising_dualbottleneck_pi05vlm_9_9_noproprio_termbn_detach
  end_pose_mode: xyz
  expert_variant: gemma_300m
  attention_backend: eager
  max_state_dim: 32
  max_action_dim: 32
  visual_bottleneck_tokens: 100
  visual_bridge_last_n_layers: 9
  spatial_loss_weight: 0.1

vision: {image_size: 224, freeze: false}
action_conditioning: {training_skill_source: gt}
mask_actions_after_skill_end: true
bspline: {tokens: 30, weight: 1.0, gripper_action: true}
skill_flow: {weight: 1.0, chunk_multiplier: 3}
vlm_termination: {enabled: true, loss_weight: 1.0, target_sigma: 1.0, positive_weight: 2.0, post_end_steps: 10}

# Chunk15 / execution8 are inherited from DROID global_config.yaml.
training:
  keep_checkpoints: 1
  protect_checkpoints: [50000, 100000]
  dataloader: {batch_size: 16, workers: 8, prefetch_factor: 4, pin_memory: true, persistent_workers: true, gpus: 1}
  optimizer: {base_lr: 2.5e-5}
  gradient_checkpointing: {action_expert: false, skill_planner: false, vlm: false, vision: false}
  schedule: {steps: 100000, lr_mode: warmup_constant, warmup_steps: 1000, log_every: 100, save_every: 10000}
logging:
  wandb: {enable: true, project: DROID_SkillVLA_PT}
slurm: {gres: 'gpu:1', cpus: 16, memory: 192G, time: '48:00:00'}
