# 학습 데이터
target_dataset: coffee_d0_full_full

# 입력 / 좌표계
dp_vision: state
dp_proprio_grounding: episode_start_xyz
dp_relative: false

# History / prediction 길이
dp_n_obs_steps: 20
dp_future_action_horizon: 24
dp_action_sequence_mode: future_only

# 모델 크기 / history encoder — transformer, GRU_iid, GRU_epi
dp_history_encoder: transformer
dp_history_encoder_dim: 128
dp_unet_size: small
dp_amp: false

# 학습 / 저장 주기
train_DP: true
dp_steps: 100000
dp_batch_size: 64
dp_num_workers: 8
dp_lr_scheduler: constant
dp_save_freq: 10000
dp_log_freq: 200

# 모델 이름 — global outputs_root 아래 DP에 자동 저장
dp_policy_name: '{target_dataset}{dp_proprio_grounding_suffix}_{dp_action_sequence_mode}_obs{dp_n_obs_steps}_future{dp_future_action_horizon}{dp_history_encoder_suffix}{dp_lr_scheduler_suffix}{dp_unet_suffix}'
dp_checkpoint: '100000'

# 실행 자원
dp_gres: gpu:1
dp_cpus_per_task: 8
dp_mem: 64G
dp_time: '24:00:00'
