# 학습 YAML에서 FT run 이름을 자동으로 결정. checkpoint만 선택하면 된다.
checkpoint: 5000

# SkillVLA Coffee 평가와 같은 검증된 episode 0 초기 배치를 반복한다.
n_episodes: 5
episode_exact: true
repeat_episodes: true
n_action_steps: 5             # 모델 chunk=10 중 앞 5스텝 실행 후 replanning
max_episode_steps: 600
seed: 1000

video:
  max_per_task: 5
  # 시뮬레이터 원본 20 FPS 영상으로 저장.
  show_wrist: true

logging:
  wandb: {enable: true, project: MimicGen_eval}

slurm: {gres: 'gpu:1', cpus: 8, memory: 64G, time: '3:00:00'}
