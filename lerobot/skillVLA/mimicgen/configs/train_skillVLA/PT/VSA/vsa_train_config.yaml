# 공통 설정 / 학습 종류
stage1_common: true
stage1_component: VSA

# 실험 이름
run:
  suffix: base

# Termination
vlm_termination:
  enabled: false
  loss_weight: 1.0
  target_sigma: 1.0
  positive_weight: 2.0
  post_end_steps: 10

# 모델 / 입력 / 학습 목표
architecture:
  name: UV_Bspline_denoising_dualbottleneck_pi05vlm_9_9_noproprio
  end_pose_mode: xyz
  expert_variant: gemma_300m
  attention_backend: eager
  max_state_dim: 32
  max_action_dim: 32
  chunk_size: 10
  visual_bottleneck_tokens: 100
  visual_bridge_last_n_layers: 9
  spatial_loss_weight: 0.1
vision:
  dino_model: models/dinov3-vits16
  image_size: 224
  freeze: false
execution:
  action_steps: 5
action_conditioning:
  training_skill_source: gt
mask_actions_after_skill_end: true
bspline:
  tokens: 30
  weight: 1.0
skill_flow:
  weight: 1.0
  chunk_multiplier: 3

  latent_best_of_n:
    enabled: false
    candidates: 5
    top_k: 1
    timesteps: 2
    ranking: main
    fp32: true

# 학습 / 체크포인트 저장
training:
  keep_checkpoints: 1
  protect_checkpoints: [50000, 100000]

  dataloader:
    batch_size: 16
    workers: 8
    prefetch_factor: 4
    gpus: 1

  optimizer:
    base_lr: 2.5e-05
    dino_lr_scale: 1.0

  gradient_checkpointing:
    vlm: true
    vision: true
    action_expert: true
    skill_planner: true

  schedule:
    steps: 100000
    lr_mode: warmup_constant
    warmup_steps: 1000
    log_every: 100
    save_every: 10000

  vsa_debug:
    every: 0
    initial: []
  checkpoint_archive: ''

# 로깅 / 저장 관리
logging:
  wandb:
    enable: true
    project: VLA_stage1

# 실행 자원
slurm:
  gres: gpu:1
  cpus: 16
  memory: 128G
  time: '24:00:00'
