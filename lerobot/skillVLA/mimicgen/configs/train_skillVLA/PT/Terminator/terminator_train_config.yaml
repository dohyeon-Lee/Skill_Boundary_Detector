# 공통 설정 / 학습 종류
stage1_common: true
stage1_component: Terminator
mode: pt

# 데이터 / 초기 체크포인트
warm_start:
  fsq_terminator: false
  predictor_checkpoint: ''
  terminator_checkpoint: ''

# 실험 이름
run:
  suffix: ''

# Termination
termination_loss:
  target_sigma: 1.0
  positive_weight: 2.0
  post_end_steps: 10

# 모델 / 입력 / 학습 목표
skill_predictor:
  train: false
fsq_terminator: {architecture: Term_Token_1_dinoS_freeze}

# 학습 / 체크포인트 저장
training:
  dataloader:
    batch_size: 32
    workers: 4
    gpus: 1
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: true

  optimizer:
    base_lr: 2.5e-05
    terminator_lr_scale: 1.0
    predictor_lr_scale: 1.0
    predictor_lora_lr_scale: 10.0
    predictor_vlm_lr_scale: 1.0
    grad_clip_norm: 1.0
  gradient_checkpointing: false

  schedule:
    steps: 100000
    lr_mode: warmup_constant
    warmup_steps: 2500
    lr_decay_steps: 50000
    log_every: 100
    save_every: 10000
  checkpoint_archive: ''

# 로깅 / 저장 관리
logging:
  wandb:
    enable: true
    project: VLA_auxiliary

# 실행 자원
slurm:
  gres: gpu:1
  cpus: 32
  memory: 96G
  time: '24:00:00'
