# 모델 선택 — top-view randomization + action-gripper Coffee FT 10k / Predictor FT 10k
vsa_training_config: null
model_defaults:
  skill_source: external    # 아래 Predictor 10k가 skill 선택
  focus_source: predictor   # Predictor가 현재 장면의 top-view UV 예측
  pose_source: auto
  advance_mode: own         # VSA 내장 detached termination bottleneck 신호 사용
  expert_xyz_source: auto
models:
  - label: Coffee_topcrop1p1_gripaction_FT10k_Pred10k_ids5182ddda_ownTerm_random
    vsa_dir: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_UV_Bspline_denoising_dualbottleneck_pi05vlm_9_9_noproprio_termbn_detach_vlmtermGT_k10_s1_pw2_w1_runa286c9258d_ert_skillbspline_ep5_ids5182ddda_topcrop1p1_gripaction_own_pcapt
    vsa_checkpoint: '010000'
    predictor_dir: bs16_FSQ333_libero2000_ft_own_coffee_d0_pcapt_libero_90_full_full_coffee_d0_full_full_predictor_uv_fullvlm_mode2_ep5_ids5182ddda_uvclip_lab
    predictor_checkpoint: '010000'

# 평가 데이터 / 결과 이름
output_name: coffee_d0_topcrop1p1_gripaction_FT10k_Pred10k_ids5182ddda_ownTerm_th03_random_10eps_r10
resume: true
target_task: Coffee_D0
gt_dataset:                  # 학습 skillset 메타데이터. skill/UV 입력은 Predictor 사용
  skillvla_root: skillvla
  source: coffee_d0_full_full
  run: FSQ333_libero2000_ft_own_coffee_d0_pcapt
task_ids: [0]
n_episodes: 10

# Rollout / 스킬 전환
n_action_steps: 10           # 앞 10스텝 실행 후 재계획
oracle:
  episode_exact: false
  repeat_episodes: false
  broadcast_single_episode: false
terminator:
  end_mode: termination
  end_threshold: 0.3
  immediate_replan_on_skill_end: true
  min_skill_steps: 0
  max_skill_length: 200

# 영상 / HTML
video:
  gripper_signal: true       # 실행 신호 + replanning별 전체 chunk. Coffee: 0 초과=닫기, 0 미만=열기.
  raw: true
  record_skill_transitions: true
  fullskill_overlay: true
  max_per_task: 10
  frame_stride: 4
  fps: 10
  skill_videos: true
skill_html: true

# GPU / CPU 실행 자원
eval_num_gpus: 1
eval_max_workers_per_gpu: 1
eval_batch_size: 1
max_parallel_tasks: 1
slurm:
  gres: gpu:1
  cpus: 8
  memory: 64G
  time: '3:00:00'

# 로깅
logging:
  wandb:
    enable: true
    project: MimicGen_eval
