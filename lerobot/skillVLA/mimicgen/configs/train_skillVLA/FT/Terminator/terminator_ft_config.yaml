# 공통 설정 / 학습 종류
newtask_ft_common: true
newtask_ft: true
stage1_component: Terminator
mode: ft

# 실험 이름
run:
  suffix: lab

# 학습 / 체크포인트 저장
training:
  dataloader:
    workers: 6
    gpus: 1

  optimizer:
    base_lr: 2.5e-05
    terminator_lr_scale: 1.0
    grad_clip_norm: 1.0
  gradient_checkpointing: false

  schedule:
    steps: 20000
    lr_mode: warmup_constant
    warmup_steps: 500
    lr_decay_steps: 20000
    log_every: 100
    save_every: 5000
  checkpoint_archive: ''

# 로깅 / 저장 관리
logging:
  wandb:
    enable: true
    project: VLA_NewTask_FT

# 실행 자원
slurm:
  gres: gpu:1
  cpus: 32
  memory: 96G
  time: '24:00:00'
