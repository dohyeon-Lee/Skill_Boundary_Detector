# 공통 설정 / 학습 종류
newtask_ft_common: true
newtask_ft: true
stage1_component: Predictor
mode: ft

# 실험 이름
run:
  suffix: lab

# 모델 / 입력 / 학습 목표
predictor_ft:
  unfreeze: all

  lora:
    enabled: false
    rank: 8
    alpha: 16.0
    targets: q,k,v,o
    dropout: 0.0

# 학습 / 체크포인트 저장
training:
  dataloader:
    workers: 6
    gpus: 1

  optimizer:
    base_lr: 2.5e-05
    predictor_lr_scale: 1.0
    predictor_lora_lr_scale: 10.0
    predictor_vlm_lr_scale: 1.0
    grad_clip_norm: 1.0
  gradient_checkpointing: false
  checkpoint_archive: ''
  keep_checkpoints: -1

  schedule:
    steps: 10000
    lr_mode: warmup_constant
    warmup_steps: 500
    lr_decay_steps: 100000
    log_every: 100
    save_every: 10000
    save_steps: [1000, 5000, 10000]

# 로깅 / 저장 관리
logging:
  wandb:
    enable: true
    project: VLA_NewTask_FT

# 실행 자원
slurm:
  gres: gpu:1
  cpus: 16
  memory: 192G
  time: '24:00:00'
