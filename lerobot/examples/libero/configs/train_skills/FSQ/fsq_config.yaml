# ── FSQ training config (Stage 3) ──────────────────────────────────────────────
# Trains FSQ on one completed DP skillset. Live images are read only when the
# selected terminator input includes image. Select the
# immutable artifact by folder names only; dataset_root comes from global_config
# and DP/checkpoint/mode/threshold/min-length provenance comes from the selected
# skillset_manifest.json.
fsq_dataset_root: FSQ_dataset
target_dataset: libero_90_full_full # libero_90_full_full | langgap_56_full_full
fsq_inputs_name: FSQ_inputs
# skillset_seg_name: seg_langgap_56_full_full_state_obs20_ck100000_std_episodemean_80p
skillset_seg_name: seg_libero_90_full_full_state_obs20_ck100000_std_episodemean_100p
skillset_name: skillset


# ── Run / FSQ bottleneck ──────────────────────────────────────────────────────
fsq_exp: "pos_pos_termfull_LR6_raw_withentH_stateonly_nodiv" # _LRdown
fsq_levels: [3, 3, 3] # [3, 4, 5]    # [6, 10] | [5, 5, 5]
fsq_encoder_lr: 3.0e-6
fsq_terminator_lr: 3.0e-6
fsq_reconstructor_lr: 3.0e-6
fsq_lr_schedule: constant # cosine | constant


# ── Encoder ───────────────────────────────────────────────────────────────────
# raw | zero_grounded | optimal
fsq_encoder_input_mode: raw
# spline: proprio trajectory -> spline control points
# action_seq: full action sequence -> transformer
fsq_encoder_arch: spline
# The encoder length token is fixed OFF in the standard FSQ training path.


# ── FSQ entropy loss ──────────────────────────────────────────────────────────
fsq_entropy: true
fsq_entropy_conf_weight: 0.1
fsq_entropy_div_weight: 0 # 0.1
fsq_entropy_inv_temperature: 100.0


# ── Decoder outputs ───────────────────────────────────────────────────────────
# Each branch/objective can be enabled independently. At least one must be true.
fsq_decoder_reconstructor: true
fsq_decoder_terminator_progress: true
fsq_decoder_terminator_termination: true


# ── Reconstructor ─────────────────────────────────────────────────────────────
# chunk: reconstruct an action chunk at sampled timesteps
# skill: reconstruct the complete skill spline control-point grid once
fsq_reconstructor_arch: skill
# false: reconstruct from skill z (and progress for chunk) without start state
fsq_reconstructor_start_state: false
fsq_chunk_size: 10


# ── Terminator ────────────────────────────────────────────────────────────────
# input_space always includes FSQ skill z:
# state = proprio only, image = third+wrist images, both = proprio+third+wrist
fsq_terminator_input_space: state       # state | image | both
# default = current-step MLP/query model; rnn = full-skill state RNN
# rnn currently supports input_space=state only.
fsq_terminator_arch: rnn                # default | rnn
# Visual/default terminator details. Ignored by state+rnn.
fsq_terminator_default_arch: small      # small | cond
fsq_terminator_layers: 3                # small only: query-transformer layers
fsq_terminator_heads: 4                 # small only
fsq_vision_backbone: dino               # dino | siglip
fsq_freeze_vision_encoder: true
fsq_dino_model_path: models/dinov3-vits16
fsq_dino_image_size: 224
fsq_siglip_image_size: 224
fsq_cond_encoder_variant: gemma_300m


# ── Training hyperparameters ──────────────────────────────────────────────────
fsq_batch_size: 64
fsq_num_epochs: 2000
fsq_checkpoint_every: 50
# Used by chunk reconstruction or a default/current-step terminator.
# Automatically becomes 1 for skill(oneshot) + full-sequence RNN.
fsq_samples_per_skill: 5
fsq_skill_cond_mode: broadcast
fsq_num_workers: 8
# Validation decodes in the training process to avoid intermittent AV1 worker deadlocks.
fsq_val_num_workers: 0
# Validation is diagnostic only; FSQ_epoch*.pt files are the training artifacts.
fsq_val_every: 25
fsq_save_best_model: false
fsq_gradient_checkpointing: false


# ── FSQ loss weights ──
fsq_action_loss_weight: 1.0
fsq_progress_loss_weight: 1.0    # 학습은 (1,1,1) — end까지 다 걸어 코드를 termination-coherent하게 형성
fsq_end_loss_weight: 1.0          #   (종료 다른 스킬 분리).
fsq_end_target_sigma: 2.0

# ── Slurm (partition/qos/nodelist/exclude from configs/global_config.yaml) ──
fsq_train_gres: gpu:1
fsq_train_cpus_per_task: 12
fsq_train_mem: 128G
fsq_train_time: "48:00:00"
fsq_wandb_project: VAE_train
