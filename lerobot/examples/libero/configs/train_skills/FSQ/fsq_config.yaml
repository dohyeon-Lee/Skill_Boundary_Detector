# FSQ whole-skill autoencoder. Architecture and input/output convention are
# selected together by fsq_autoencoder; mixed combinations are unsupported.


# ── Data artifact ─────────────────────────────────────────────────────────────
fsq_dataset_root: FSQ_dataset
target_dataset: libero_90_full_full
fsq_inputs_name: FSQ_inputs
skillset_seg_name: seg_libero_90_full_full_grounded_future_only_obs20_future24_transformer_constLR_small_ck010000_gaussian_x0hat_globalmean_100p
skillset_name: skillset


# ── Experiment / bottleneck ──────────────────────────────────────────────────
# Optional single-underscore suffix appended after the automatic run name.
# The canonical norm_action01 tag is always omitted. Recon-only is also omitted,
# while non-default decoder composition remains visible; this setup is named
# FSQ333_recon_term22__contrastiveON_routeON_loss_new.
# FSQ starts with its levels
# (FSQ333_...); BSQ shows one binary level per
# latent dimension (for example, code_dim=4 becomes BSQ2222_...).
# Two layers are the default and therefore carry no suffix; set this only for
# a genuinely separate experiment (for example "layer3").
fsq_exp: "new_rand10"
# Choose exactly one of the following forms.
# fsq_quantizer: {type: fsq, levels: [3,3,3,3]}  
fsq_quantizer: {type: fsq, levels: [3,3,3]}  
# fsq_quantizer: {type: bsq, code_dim: 5}       # 32 spherical binary codes
fsq_hidden_dim: 256
fsq_num_layers: 2


# ── Architecture ─────────────────────────────────────────────────────────────
# raw    : absolute proprio B-spline -> FSQ -> absolute proprio B-splineㅇ
# zero   : zero-grounded proprio B-spline -> FSQ -> zero-grounded B-spline
# action      : raw controller actions -> FSQ -> causal Transformer raw actions
# norm_action : dataset q01/q99-normalized actions -> FSQ -> normalized actions
# Encoder and decoder are an indivisible preset; mixed combinations are not
# exposed. gripper_weight is the gripper MSE weight; sqrt(weight) is applied to
# the final 2 proprio axes (raw/zero) or final action axis (action/norm_action)
# in both encoder input and decoder target so route/recon agree.
# 1.0 is the untuned normalized baseline.
# Every mode name includes the compact value: zero/0.1 -> zero01.
fsq_autoencoder: {mode: norm_action, gripper_weight: 0.1}  # raw | zero | action | norm_action
# Optional decoder context, available in every autoencoder mode.  The FSQ code
# remains the decoder content; the normalized skill-start proprio state only
# modulates decoder blocks through a separate zero-init AdaLN path.
fsq_start_state_conditioning: none      # none | adaln
# term22: frozen DINO/top camera, current+skill-start proprio tokens, no skill
# skip, and training-only start-anchor jitter (±5 half-normal, p=0.5).
fsq_terminator: {architecture: term22, termination: true}
fsq_decoder_reconstructor: true


# ── Code assignment / regularization ─────────────────────────────────────────
# One-time z_head calibration only; samples=0 uses all training skills.
fsq_init_calibration: {enabled: true, gain: 1.0, samples: 0}


# Losses are each configured in one place. pair type: none | contrastive | overlap | js.
# type=none disables pair loss and names the run pairOFF.
fsq_pair_loss: {type: contrastive, weight: 0.1, inv_temperature: 5.0}
fsq_route_loss: {enabled: true}
fsq_action_loss: {weight: 1.0}
fsq_end_loss: {weight: 0.1, target_sigma: 2.0, positive_weight: 2.0}

# Reconstruction-only warm-up, followed by a linear pair-weight ramp.
fsq_pair_warmup: {enabled: true, epochs: 50, ramp_epochs: 50}

# One boundary is moved per positive pair. With all four directions enabled,
# start/end is selected 50:50 and early/late within it is selected 50:50
# (thus each direction is 25%). Values below are maximum frame offsets, not %.
# fsq_boundary_aug_early_start_pmax: 10  # prepend previous-skill actions
# fsq_boundary_aug_late_start_pmax: 5    # trim actions from the skill start
# fsq_boundary_aug_early_end_pmax: 10    # trim actions from the skill end
# fsq_boundary_aug_late_end_pmax: 5      # append next-skill actions

fsq_boundary_aug_early_start_pmax: 10  # prepend previous-skill actions
fsq_boundary_aug_late_start_pmax: 10    # trim actions from the skill start
fsq_boundary_aug_early_end_pmax: 10    # trim actions from the skill end
fsq_boundary_aug_late_end_pmax: 10      # append next-skill actions

# ── Optimization ─────────────────────────────────────────────────────────────
fsq_lr: 3.0e-6                  # encoder = reconstructor = terminator
fsq_lr_schedule: constant           # constant | cosine

fsq_batch_size: 64
fsq_num_epochs: 2000
fsq_samples_per_skill: 3            # train: 3 uniform random timesteps; val: fixed start/mid/end
fsq_num_workers: 24
fsq_val_num_workers: 0
fsq_val_every: 25
fsq_checkpoint_every: 100
fsq_save_best_model: false
fsq_gradient_checkpointing: false

# Visual input is predecoded once, then staged to node-local storage. The
# DataLoader already uses pinned memory, persistent workers, and prefetch=2.
fsq_frame_cache_enabled: true
fsq_frame_cache_stage_local: true
fsq_frame_cache_cpus_per_task: 32
fsq_frame_cache_workers: 24
fsq_frame_cache_decoder_threads: 1

# Independent execution-only accelerations. DINO precompute creates/reuses one
# dataset-level top-camera token cache; route batching scores several codes per
# terminator call. Neither changes the checkpoint architecture or objective
# definition (route dropout draws can differ when its batch shape changes).
fsq_dino_features: {enabled: true, batch_size: 256}
fsq_route_batching: {enabled: true, chunk_size: 8}


# ── Slurm / logging ──────────────────────────────────────────────────────────
fsq_train_gres: gpu:1
fsq_train_cpus_per_task: 32
fsq_train_mem: 96G
fsq_train_time: "48:00:00"
fsq_wandb_project: VAE_train
