# ── FSQ training config (Stage 3) ──────────────────────────────────────────────
# Self-contained: trains the FSQ skill autoencoder on the skillset + DINO tokens that
# build_data produced. Read by submit_train_fsq.sh. Project paths/slurm from global_config.
#
# Consumes the skillset under FSQ_inputs/seg_{dp_run_name}_ck{dp_checkpoint}_{mode}/ — so it points
# at the SAME DP build_data used.

target_dataset: libero_90_full_full

# Which DP's skillset/tokens to train on — must match the build_data run.
# dp_run_name: libero_90_full_full_dino8_obs10
dp_run_name: libero_90_full_full_state_obs20

dp_checkpoint: "100000"
fsq_patch_grid: 8                  # FSQ token grid (matches build_data)
fsq_dataset_root: FSQ_dataset
fsq_inputs_name: FSQ_inputs
skillset_name: skillset
# Must match build_data/build_data_config.yaml so FSQ consumes the intended segmentation.
skillset_mode: std

# ── FSQ model / run ──
# {dp_tag} = the DP run that produced the skillset (dataset prefix stripped, e.g. state_obs20 /
# dino8_obs10) → the FSQ folder shows WHICH DP it was trained on, not just its own grid.
fsq_run_name: "{target_dataset}_{dp_tag}_{fsq_tag}_dino{fsq_patch_grid}{weighted_suffix}{fsq_exp_suffix}"
fsq_exp: "both_best_ratio"                # optional ablation suffix
fsq_levels: [5, 5, 5]    # [8, 8] | [5, 5, 5]  

# Terminator cameras (must match build_data's fsq_terminator_use_wrist for token availability).
fsq_terminator_use_third: true
fsq_terminator_use_wrist: true

fsq_batch_size: 64
fsq_num_workers: 0
fsq_num_epochs: 5000
fsq_checkpoint_every: 500
fsq_chunk_size: 10

# ── FSQ loss weights ──
fsq_delta_loss_weight: 1.0
fsq_progress_loss_weight: 0.1     # 학습은 (1,1,1) — end까지 다 걸어 코드를 termination-coherent하게 형성
fsq_end_loss_weight: 0.1          #   (종료 다른 스킬 분리). FSQ.pt "선택"만 아래 val_select로 recon 우선.
fsq_end_target_sigma: 1.0

# ── best-val 선택 기준 (override) ──  학습 loss(1/1/1)와 별개로 FSQ.pt를 고르는 metric.
# 학습은 end까지 걸어 코드를 termination-coherent하게 만들되, total val은 end가 지배(~67%)라 그대로
# 고르면 recon-suboptimal 지점이 잡힘 → 여기서 recon 우선으로 재선택. (비우면 loss 비율 그대로 따라감.)
# FSQ.pt = argmin( 1*delta + 0.1*progress + 0.1*end ) on val → delta ~76% 지배 (end~0.07*0.1 < delta~0.025).
fsq_val_select_delta_weight: 1.0
fsq_val_select_progress_weight: 0.1
fsq_val_select_end_weight: 0.1

# Probe: end-weight the reconstructor (delta) loss per-frame by w=1+progress (skill END ~2× the
# start) → FSQ latent allocates more code resolution to the skill's latter/handoff part. progress &
# termination losses stay uniform. true → run/folder name gets a "_weighted" tag (before fsq_exp).
weighted_loss: false

# ── Slurm (partition/qos/nodelist/exclude from configs/global_config.yaml) ──
fsq_train_gres: gpu:1
fsq_train_cpus_per_task: 12
fsq_train_mem: 128G
fsq_train_time: "48:00:00"
fsq_wandb_project: VAE_train
