# Shared config for configs/train_skills.
# This folder owns the training stages that prepare skill checkpoints.

# ── Paths ─────────────────────────────────────────────────────
# Change this when moving to another server.
project_root: /data2/dohyeon/SBD
dataset_root: libero_dataset
outputs_root: DP_outputs
fsq_outputs_root: FSQ_outputs
fsq_dataset_root: FSQ_dataset

# Dataset to train on. This can be a full dataset or a generated subset.
target_dataset: libero_90

# ── DINO features ─────────────────────────────────────────────
# DP consumes precomputed frame-level DINO tokens.
# Full-dataset DINO outputs are generated by configs/generate_training_dataset.
# train_skills prepares target-specific DINO copies under:
#   {project_root}/{dataset_root}/{fsq_dataset_root}/{target_dataset}/DINO/pg{grid}
dino_feature_dataset: "{target_dataset}"
dino_source_dataset: ""
dino_image_keys: ["observation.images.image"]
dino_patch_grid: 8
dino_feature_dim: 384
dino_visual_feature_dim: 256
dino_transformer_n_layers: 1
dino_transformer_n_heads: 4
dino_cache_size: 8
dino_copy_mode: copy  # copy | hardlink | symlink
dino_overwrite_prepared: false

# ── Diffusion Policy ──────────────────────────────────────────
train_DP: true  # false: only prepare target DINO; skip DP training submission.
dp_base_config: examples/libero/configs/DP_train/train_dp_libero_90.yaml
dp_policy_name: "dp_{target_dataset}_dino{dino_patch_grid}_obs{dp_n_obs_steps}_horizon{dp_horizon}"
dp_checkpoint: "100000"

dp_n_obs_steps: 10
dp_n_action_steps: 16
dp_horizon: 16
dp_batch_size: 64
dp_steps: 100000
dp_num_workers: 4
dp_save_freq: 5000
dp_log_freq: 200
dp_eval_freq: 0
dp_seed: 42
dp_wandb_project: DP_train
dp_wandb_enable: true
dp_overwrite_output: false

# ── Slurm defaults for DP training ────────────────────────────
dp_partition: debug
dp_nodelist: node100
dp_qos: big_qos
dp_gres: gpu:1
dp_cpus_per_task: 8
dp_mem: 64G
dp_time: "48:00:00"

################################################################

# ── Shared Slurm defaults for FSQ preparation jobs ────────────
# Used by skillset generation, DINO token extraction, and SAM2 flag jobs.
slurm_partitions:
  - debug
  # - base_suma_rtx3090
  # - dell_rtx3090
  # - big_suma_rtx3090
slurm_nodelist: ""
slurm_exclude_nodes:
  - node200
  # - node19
  # - node13
  # - node18
  # - node16
  # - node08
  # - node10
  # - node21
  # - node14
  # - node04
  # - node05
  # - node31
slurm_qos: base_qos
slurm_gres: gpu:1
slurm_gpu_reserve: 0
slurm_gpu_max_per_node: 7

# ── Skillset generation with trained DP ───────────────────────
# Output:
#   {project_root}/{dataset_root}/{fsq_dataset_root}/{target_dataset}/FSQ_inputs/skillset
skillset_name: skillset
skillset_tasks_per_job: 5
skillset_wandb_project: Skill_dataset

skillset_dn_step: 7
skillset_n_gmm: 5
skillset_smooth_window: 7
skillset_savgol_polyorder: 4
skillset_replan_interval: 3
skillset_nms_dist: 25

skillset_cpus_per_task: 4
skillset_mem: 32G
skillset_time: "4:00:00"

# ── FSQ input precompute: skill DINO tokens + SAM2 flags ──────
# Output:
#   {project_root}/{dataset_root}/{fsq_dataset_root}/{target_dataset}/FSQ_inputs
fsq_inputs_name: FSQ_inputs
sam2_checkpoint: ""

fsq_build_patch_flags: true
fsq_precompute_max_workers: 40
fsq_precompute_recovery_workers: 20
fsq_cleanup_sam2_masks: true

################################################################

# ── FSQ specs, used by later train_skills stages ──────────────
# EEF pose is always absolute and the motion decoder always predicts K-step
# action chunks, so eef_mode/action_mode are no longer configurable.
fsq_run_name: "{target_dataset}_{fsq_tag}_pg{dino_patch_grid}_{decoder_image_mode}_image{fsq_image_token_dim}"
fsq_levels: [5, 5, 5]
fsq_epoch: "1000"
# motion_reconstructor image feature: dino_flags = include SAM2 [is_changed, is_green]
# patch flags, dino_only = pure DINO (no flags). The skill_termination_predictor
# always uses pure DINO. This is the main knob to A/B the motion flags.
decoder_image_mode: dino_only # dino_only | dino_flags
fsq_batch_size: 128
fsq_num_epochs: 1000
fsq_checkpoint_every: 500
fsq_lr: 3e-4
fsq_hidden_dim: 256
fsq_num_layers: 2
fsq_n_control: 30
# Internal per-patch width N inside the image encoders (must be divisible by
# image heads=4 and >2). Flags occupy 2 of N channels in dino_flags mode, so
# smaller N raises the relative flag weight. Image-encoder output is still 256.
fsq_image_token_dim: 256 # 64 128 256
fsq_chunk_size: 10
fsq_max_length: 200
fsq_delta_loss_weight: 10.0
fsq_progress_loss_weight: 1.0
fsq_end_loss_weight: 1.0
fsq_wandb_project: VAE_train

# ── Slurm defaults for FSQ training ───────────────────────────
fsq_train_partition:
  - debug
fsq_train_nodelist: ""
fsq_train_exclude_nodes:
  - node200
fsq_train_qos: base_qos
fsq_train_gres: gpu:1
fsq_train_cpus_per_task: 12
fsq_train_mem: 64G
fsq_train_time: "48:00:00"
