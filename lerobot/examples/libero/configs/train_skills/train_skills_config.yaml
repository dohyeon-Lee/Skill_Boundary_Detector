# Shared config for configs/train_skills.
# This folder owns the training stages that prepare skill checkpoints.
#
# Sections, in pipeline order:
#   COMMON          — paths / dataset / DINO features (every stage uses these)
#   STAGE 1 · DP train
#   STAGE 2 · FSQ data prepare (skillset generation + DINO token extraction)
#   STAGE 3 · FSQ train

################################################################
# COMMON  (used by every stage)
################################################################

# ── Paths ─────────────────────────────────────────────────────
# Change this when moving to another server.
project_root: /data2/dohyeon/SBD
# libero_dataset | libero_original_dataset
dataset_root: libero_original_dataset
# DP_outputs | outputs_DP
outputs_root: outputs_DP
# FSQ_outputs | outputs_FSQ
fsq_outputs_root: outputs_FSQ
fsq_dataset_root: FSQ_dataset

# Dataset to train on. This can be a full dataset or a generated subset.
# libero_90 | libero_90_full_full
target_dataset: libero_90_full_full

# ── DINO features ─────────────────────────────────────────────
# DP trains on these tokens AND FSQ data-prepare extracts skill tokens from them.
# Full-dataset DINO outputs are generated by configs/generate_training_dataset.
# train_skills prepares target-specific DINO copies under:
#   {project_root}/{dataset_root}/{fsq_dataset_root}/{target_dataset}/DINO/pg{grid}
dino_feature_dataset: "{target_dataset}"
dino_source_dataset: libero_90_full_full #  "" | libero_90_full_full
dino_image_keys: ["observation.images.image"]
dino_patch_grid: 8
dino_feature_dim: 384
dino_visual_feature_dim: 256
dino_transformer_n_layers: 1
dino_transformer_n_heads: 4
dino_cache_size: 8
dino_copy_mode: copy  # copy | hardlink | symlink
dino_overwrite_prepared: false

################################################################
# STAGE 1 · DP TRAIN
################################################################
train_DP: true  # false: only prepare target DINO; skip DP training submission.
dp_base_config: examples/libero/configs/train_skills/DP/src/train_dp_libero_90.yaml
dp_policy_name: "dp_{target_dataset}_dino{dino_patch_grid}_obs{dp_n_obs_steps}_horizon{dp_horizon}"
dp_checkpoint: "100000"

dp_n_obs_steps: 10
dp_n_action_steps: 16
dp_horizon: 16
dp_batch_size: 64
dp_steps: 100000
dp_num_workers: 4
dp_save_freq: 50000
dp_log_freq: 200
dp_eval_freq: 0
dp_seed: 42
dp_wandb_project: DP_train
dp_wandb_enable: true
dp_overwrite_output: false

# ── Slurm (DP training) ───────────────────────────────────────
dp_partition: debug
dp_nodelist: node100
dp_qos: big_qos
dp_gres: gpu:1
dp_cpus_per_task: 8
dp_mem: 64G
dp_time: "48:00:00"

################################################################
# STAGE 2 · FSQ DATA PREPARE  (skillset generation + DINO token extraction)
################################################################

# ── Shared Slurm defaults for FSQ preparation jobs ────────────
# Used by skillset generation and DINO token extraction.
slurm_partitions:
  - debug
  # - base_suma_rtx3090
  # - dell_rtx3090
  # - big_suma_rtx3090
slurm_nodelist: ""
slurm_exclude_nodes:
  - node200
  # - node19
  # - node13
  # - node18
  # - node16
  # - node08
  # - node10
  # - node21
  # - node14
  # - node04
  # - node05
  # - node31
slurm_qos: base_qos
slurm_gres: gpu:1

# ── Skillset generation with trained DP ───────────────────────
# Output:
#   {project_root}/{dataset_root}/{fsq_dataset_root}/{target_dataset}/FSQ_inputs/skillset
skillset_name: skillset
skillset_tasks_per_job: 5
skillset_wandb_project: Skill_dataset

skillset_dn_step: 7
skillset_n_gmm: 5
skillset_smooth_window: 7
skillset_savgol_polyorder: 4
skillset_replan_interval: 3
skillset_nms_dist: 25

skillset_cpus_per_task: 4
skillset_mem: 32G
skillset_time: "4:00:00"

# ── FSQ input precompute: skill DINO tokens (3rd-person + wrist) ──
# Output:
#   {project_root}/{dataset_root}/{fsq_dataset_root}/{target_dataset}/FSQ_inputs
# (which cameras get extracted is decided by fsq_terminator_use_wrist in STAGE 3.)
fsq_inputs_name: FSQ_inputs

################################################################
# STAGE 3 · FSQ TRAIN
################################################################
# EEF pose is always absolute and the motion decoder always predicts K-step
# action chunks, so eef_mode/action_mode are no longer configurable.
fsq_exp: ""  # optional suffix for ablations, e.g. exp1 -> ..._exp1
fsq_run_name: "{target_dataset}_{fsq_tag}_pg{dino_patch_grid}_image{fsq_image_token_dim}{fsq_exp_suffix}"
fsq_levels: [8, 8]
fsq_epoch: "1000"

fsq_batch_size: 128
fsq_num_epochs: 1000
fsq_checkpoint_every: 100
fsq_lr: 3e-4
fsq_hidden_dim: 256
fsq_num_layers: 2
fsq_n_control: 30
# Internal per-patch width N inside the image encoders (must be divisible by
# image heads=4). Image-encoder output is still hidden_dim.
fsq_image_token_dim: 256 # 64 128 256
# FSQ terminator cameras (also decides whether STAGE 2 extracts wrist tokens):
#   true  = 3rd-person + wrist (two DINO encoders) — needs the wrist DINO tokens
#           (run_frame_dino_parallel --camera wrist/both + extract; prepare_dino auto-copies)
#   false = 3rd-person only (original single-camera FSQ; old checkpoints stay loadable)
fsq_terminator_use_wrist: true
fsq_chunk_size: 10
fsq_max_length: 200
fsq_delta_loss_weight: 1.0 # 10
fsq_progress_loss_weight: 1.0
fsq_end_loss_weight: 1.0
fsq_wandb_project: VAE_train

# ── Slurm (FSQ training) ──────────────────────────────────────
fsq_train_partition:
  - debug
fsq_train_nodelist: ""
fsq_train_exclude_nodes:
  - node200
  # - node01
fsq_train_qos: base_qos
fsq_train_gres: gpu:1
fsq_train_cpus_per_task: 12
fsq_train_mem: 64G
fsq_train_time: "48:00:00"
