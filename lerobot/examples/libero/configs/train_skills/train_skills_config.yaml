# Shared config for configs/train_skills.
# This folder owns the training stages that prepare skill checkpoints.
#
# Sections, in pipeline order:
#   COMMON          — paths / dataset / DINO features (every stage uses these)
#   STAGE 1 · DP train
#   STAGE 2 · FSQ data prepare (skillset generation + DINO token extraction)
#   STAGE 3 · FSQ train

################################################################
# COMMON  (used by every stage)
################################################################

# ── Paths ─────────────────────────────────────────────────────
# Change this when moving to another server.
# Single checkpoint output root. Per-stage subdirs are fixed by the resolver
# (not configurable here): DP -> {outputs_root}/DP/{dp_policy_name},
#                          FSQ -> {outputs_root}/FSQ/{fsq_run_name}.
# project_root/dataset_root come from configs/global_config.yaml.
# outputs_root comes from configs/global_config.yaml.
target_dataset: libero_90_full_full

# ── DINO features ─────────────────────────────────────────────
# DP trains on these tokens AND FSQ data-prepare extracts skill tokens from them.
# Full-dataset DINO outputs are generated by configs/generate_training_dataset.
# train_skills prepares target-specific DINO copies under:
#   {project_root}/{dataset_root}/{fsq_dataset_root}/{target_dataset}/DINO/pg{grid}
# Fixed DINO model/runtime knobs (feature_dim, visual_feature_dim, transformer
# n_layers/n_heads, cache_size, copy_mode) live as defaults in
# src/train_skills_config.py — change them there if ever needed.
dino_feature_dataset: "{target_dataset}"
dino_source_dataset: libero_90_full_full #  "" | libero_90_full_full
dino_image_keys: ["observation.images.image"] # what DP use
dino_patch_grid: 8
dino_overwrite_prepared: false


################################################################
# STAGE 1 · DP TRAIN
################################################################
# Fixed DP training hyperparams (n_obs_steps, n_action_steps, horizon, batch_size,
# num_workers, eval_freq, seed, overwrite_output=true, wandb project/enable) live as
# defaults in src/train_skills_config.py — change them there if ever needed.
train_DP: false  # false: only prepare target DINO; skip DP training submission.
dp_base_config: examples/libero/configs/train_skills/DP/src/train_dp_libero_90.yaml
dp_policy_name: "{target_dataset}_dino{dino_patch_grid}"
dp_checkpoint: "100000"
dp_steps: 100000
dp_save_freq: 50000
dp_log_freq: 200
# ── Slurm (DP training; partition/qos/nodelist/exclude from configs/global_config.yaml) ──
dp_gres: gpu:1
dp_cpus_per_task: 8
dp_mem: 64G
dp_time: "48:00:00"

################################################################
# STAGE 2 · FSQ DATA PREPARE  (skillset generation + DINO token extraction)
################################################################
# Fixed skillset extraction knobs (dn_step, n_gmm, smooth_window, savgol_polyorder,
# replan_interval, nms_dist) live as defaults in src/train_skills_config.py.
# ── Shared Slurm defaults for FSQ preparation jobs ────────────
# Used by skillset generation and DINO token extraction.
# partition/qos/nodelist/exclude_nodes come from configs/global_config.yaml.
slurm_gres: gpu:1
skillset_tasks_per_job: 5
skillset_wandb_project: Skill_dataset
skillset_cpus_per_task: 4
skillset_mem: 32G
skillset_time: "4:00:00"

# ── Skillset generation with trained DP ───────────────────────
# Output:
#   {project_root}/{dataset_root}/{fsq_dataset_root}/{target_dataset}/FSQ_inputs/skillset
fsq_dataset_root: FSQ_dataset
skillset_name: skillset
# ── FSQ input precompute: skill DINO tokens (3rd-person + wrist) ──
# Output:
#   {project_root}/{dataset_root}/{fsq_dataset_root}/{target_dataset}/FSQ_inputs
# (which cameras get extracted is decided by fsq_terminator_use_wrist in STAGE 3.)
fsq_inputs_name: FSQ_inputs

################################################################
# STAGE 3 · FSQ TRAIN
################################################################
# EEF pose is always absolute and the motion decoder always predicts K-step
# action chunks, so eef_mode/action_mode are no longer configurable.
fsq_terminator_use_wrist: false
# Reconstructor start-image input. true = [z, start_state, start_img, progress] (current);
# false = drop the start image → forces z to be the sole motion source (start_state kept).
fsq_reconstructor_use_image: false
fsq_run_name: "{target_dataset}_{fsq_tag}_dino{dino_patch_grid}{fsq_exp_suffix}"
fsq_exp: "wow_imgX"  # optional suffix for ablations, e.g. exp1 -> ..._exp1
fsq_levels: [5, 5, 5]
fsq_epoch: "1000"

fsq_batch_size: 256 
fsq_num_epochs: 1000
fsq_checkpoint_every: 100
# FSQ terminator cameras (also decides whether STAGE 2 extracts wrist tokens):
#   true  = 3rd-person + wrist (two DINO encoders) — needs the wrist DINO tokens
#           (run_frame_dino_parallel --camera wrist/both + extract; prepare_dino auto-copies)
#   false = 3rd-person only (original single-camera FSQ; old checkpoints stay loadable)
fsq_chunk_size: 10
fsq_max_length: 200
# ── FSQ loss weights ──────────────────────────────────────────
fsq_delta_loss_weight: 1.0      # action chunk reconstruction (SmoothL1)
fsq_progress_loss_weight: 1.0   # skill progress prediction (SmoothL1)
fsq_end_loss_weight: 1.0        # skill termination (BCE)
fsq_end_target_sigma: 2.0       # soft end target: Gaussian bump std (frames) at the skill end;
                                # curbs termination-head val overfit. 0 = hard 1-frame spike.
# Fixed FSQ hyperparams (lr, hidden_dim, num_layers, n_control, image_token_dim=256)
# live as defaults in src/train_skills_config.py.

# ── Slurm (FSQ training; partition/qos/nodelist/exclude from configs/global_config.yaml) ──
fsq_train_gres: gpu:1
fsq_train_cpus_per_task: 12
fsq_train_mem: 128G
fsq_train_time: "48:00:00"
fsq_wandb_project: VAE_train
