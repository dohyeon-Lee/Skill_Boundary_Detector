
# One FSQ run or a list of runs to evaluate together, e.g.
#   fsq_eval_run_name: [runA, runB, runC]
# With a list, output_name becomes the comparison parent and each run writes to
# output_name/<run_name>; afterwards build the tabbed comparison report:
#   python src/fsq_gt_replay_report.py --compare outputs/fsq_gt_replay/<output_name>/*/
# 네이밍 규칙 (2026-08 정리): constLR(기본 LR)·말미 _oneshot 마커·bsq의 joint(항상 joint)는
# 폴더명에서 제거. 구조 라벨은 입출력 모달리티로 표기: pos_pos(스플라인→ctrl 복원),
# pos_act(스플라인→action rollout), act_act(action 시퀀스→action rollout).
# LR 태그는 전 run 필수: e-4대=LR4, e-5대=LR5, e-6대=LR6 (enc≠dec인 옛 LRdown 계열은 LenTok/에 보관).
# encoder 입력 모드 태그도 전 run 필수: raw | zero | opt(optimal) — LR 태그 바로 뒤 슬롯.
# 길이토큰 세대 run(구 noLenTok 미표기 시절)은 LenTok/에 보관 — noLenTok 라벨 폐지(무토큰이 기본).
# loss 구조 태그 전 run 필수: ReconOnly(entropy 항 없음) | withEntH(entropy 항 포함; BSQ는 항상 withEntH).

output_name: "progress_comparison" 
fsq_eval_run_name:
  # exp1 : FSQ_opt_raw_zero
