# fsq_eval_checkpoint: [50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 950, 1000]
# fsq_eval_checkpoint: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000]

fsq_eval_checkpoint: [50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700]
# fsq_eval_checkpoint: [400, 500, 600]


# How episodes get their task id.
#   exact   : from the rendered episode-exact map (skillvla_dataset/<ds>/eval_init_states.npz).
#             target_task must then be a real LIBERO suite, and episodes whose scene
#             is outside that suite are dropped.
#   dataset : from the dataset's own meta/tasks.parquet.  Covers every episode even
#             when the dataset draws scenes from several suites (langgap_56 spans
#             langgap_ext + libero_spatial + libero_object + libero_goal + libero_10),
#             needs neither the exact map nor libero_original_dataset, and makes
#             target_task a report label only.  No original-HDF5 demo provenance.
episode_source: exact        # exact | dataset

target_task: libero_90 # langgap_56 | libero_90
# List of task ids, or "all" for every task the dataset can serve. Ids without
# enough episodes in the dataset are skipped with a warning.
# The list below picks one task per libero_90 scene (20 scenes; task 51 is
# absent from the filtered dataset).
# task_ids: [3, 4, 5]
task_ids: [0, 3, 4, 5, 6, 11, 18, 22, 28, 33, 35, 38, 40, 46, 50, 55, 60, 65, 69, 73, 77, 81, 86]
# task_ids: all
episodes_per_task: 20
episode_selection: first       # first | random
episode_ids: []                # optional exact global episode IDs
seed: 42

# eval_num_gpus caps how many jobs run at once; workers_per_checkpoint splits one
# checkpoint's occurrences across that many jobs. Images now come straight from
# the dataset videos (no simulator), so 1 worker per checkpoint is enough; the
# GPU is only used to encode missing latents.
eval_num_gpus: 20
workers_per_checkpoint: 1
resume: true
              # FSQ_VS_BSQ

slurm:
  gres: gpu:1
  cpus: 8
  memory: 64G
  time: "00:30:00"
