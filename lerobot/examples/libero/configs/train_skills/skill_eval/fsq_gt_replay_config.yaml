  # # exp4 : FSQ_pospos_posact_actact_withEntH
  # - libero_90_full_full_state_obs20_std_episodemean_100p_fsq333_pos_pos_LR6_raw_withEntH
  # - libero_90_full_full_state_obs20_std_episodemean_100p_fsq333_pos_act_LR6_raw_withEntH
  # - libero_90_full_full_state_obs20_std_episodemean_100p_fsq333_act_act_LR6_raw_withEntH
  # # exp5 : FSQ_ReconOnly_withEntH_pospos
  # - libero_90_full_full_state_obs20_std_episodemean_100p_fsq333_pos_pos_LR6_raw_ReconOnly
  # - libero_90_full_full_state_obs20_std_episodemean_100p_fsq333_pos_pos_LR6_raw_withEntH
