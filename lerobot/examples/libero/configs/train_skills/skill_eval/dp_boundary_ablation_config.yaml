# One-model, one-task diagnostic for the DP skill-boundary mechanism.
# Submit with ./submit_dp_boundary_ablation.sh.

target_dataset: libero_90_full_full
fsq_dataset_root: FSQ_dataset
fsq_inputs_name: FSQ_inputs
skillset_seg_name: seg_libero_90_full_full_grounded_future_only_obs20_future24_small_ck100000_std_episodemean_100p
skillset_name: skillset

output_name: task1_boundary_ablation
task_id_space: suite             # suite | dataset
target_task: libero_90
task_ids: [1]
n_episodes: 20
resume: true
seed: 42

# Fair 2x2 probe ablation in the same no-gripper PCA space:
#   random vs exact +/- antithetic symmetry, at equal totals of 24 and 48.
# Keep output_name unchanged: all four raw probe clouds produced by the previous
# 2x2 run are reused. This run only recomputes CPU-side BIC evidence curves.
pca_variance: 0.95
pca_stride: 3
probe_variants:
  # Existing cache from the previous run.
  - {name: no_gripper_std, mode: std_without_gripper, count: 24, alpha: 0.1, antithetic: false}
  # New: 12 sampled directions and their 12 exact negatives.
  - {name: no_gripper_antithetic24, mode: std_without_gripper, count: 24, alpha: 0.1, antithetic: true}
  # New: 48 independently sampled directions.
  - {name: no_gripper_random48, mode: std_without_gripper, count: 48, alpha: 0.1, antithetic: false}
  # Existing cache from the previous run: 24 directions plus 24 negatives.
  - {name: no_gripper_antithetic, mode: std_without_gripper, count: 48, alpha: 0.1, antithetic: true}

cluster_variants:
  - {name: diag_bic_k1_3, selection: bic, min_k: 1, max_k: 3, covariance: diag, n_init: 10, min_weight: 0.08, weighted: true}

boundary_variants:
  # Gain=0 means the denoiser added no K>1 evidence beyond probe geometry.
  - {name: gain_rising_mad, method: rising, threshold: median_mad_floor_zero, threshold_scale: 2.0, smooth_window: 5, polyorder: 2, nms_frames: 20, prominence: 0.0, sustain: 2}

# delta_bic = BIC(K=1) - min(BIC(K=2), BIC(K=3)).
# Score below subtracts each probe layout's input delta-BIC baseline, retaining
# only multimodality evidence added by the DP denoising/vector field.
experiments:
  - {name: random24_dbic_gain, probe: no_gripper_std, cluster: diag_bic_k1_3, metric: delta_bic_gain, boundary: gain_rising_mad}
  - {name: antithetic24_dbic_gain, probe: no_gripper_antithetic24, cluster: diag_bic_k1_3, metric: delta_bic_gain, boundary: gain_rising_mad}
  - {name: random48_dbic_gain, probe: no_gripper_random48, cluster: diag_bic_k1_3, metric: delta_bic_gain, boundary: gain_rising_mad}
  - {name: antithetic48_dbic_gain, probe: no_gripper_antithetic, cluster: diag_bic_k1_3, metric: delta_bic_gain, boundary: gain_rising_mad}

# Expensive reference: sample complete conditional DP trajectories instead of
# probing around the demonstrated branch. Enable after the cheap ablation.
rollout:
  enabled: false
  samples: 32
  batch_size: 16
  probe: no_gripper_std
  cluster: diag_bic_k1_3
  metric: hybrid
  boundary: rising_mad

# GPU resources. Partition/QoS/node filters come from global_config.yaml.
eval_gres: gpu:1
eval_cpus_per_task: 4
eval_mem: 48G
eval_time: "04:00:00"
