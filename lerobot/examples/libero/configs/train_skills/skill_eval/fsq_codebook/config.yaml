#   - {"model_name": "new", "run_name": "FSQ333_contrastiveON_routeON_loss_new"}

output_name: "new_SBD_mode_term_rand10"
fsq_eval_models:
  - {"model_name": "pairOFF", "run_name": "FSQ333_pairOFF_routeON_loss_new"}
  - {"model_name": "js", "run_name": "FSQ333_jsON_routeON_loss_new"}
  - {"model_name": "contrastive", "run_name": "FSQ333_contrastiveON_routeON_loss_new"}
  - {"model_name": "contrastive_rand", "run_name": "FSQ333_contrastiveON_routeON_loss_new_rand10"}
  - {"model_name": "contrastive_term", "run_name": "FSQ333_norm_action01_recon_term22__contrastiveON_routeON_loss_new"}
  - {"model_name": "contrastive_term_rand", "run_name": "FSQ333_norm_action01_recon_term22__contrastiveON_routeON_loss_new_rand10"}



fsq_eval_checkpoint: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1500, 2000]

# How episodes get their task id.
#   exact   : from the rendered episode-exact map (skillvla_dataset/<ds>/eval_init_states.npz).
#             target_task must then be a real LIBERO suite, and episodes whose scene
#             is outside that suite are dropped.
#   dataset : from the dataset's own meta/tasks.parquet.  Covers every episode even
#             when the dataset draws scenes from several suites (langgap_56 spans
#             langgap_ext + libero_spatial + libero_object + libero_goal + libero_10),
#             needs neither the exact map nor libero_original_dataset, and makes
#             target_task a report label only.  No original-HDF5 demo provenance.
episode_source: exact        # exact | dataset

target_task: libero_90 # langgap_56 | libero_90
# List of task ids, or "all" for every task the dataset can serve. Ids without
# enough episodes in the dataset are skipped with a warning.
# The list below picks one task per libero_90 scene (20 scenes; task 51 is
# absent from the filtered dataset).
task_ids: [0, 3, 4, 5, 6, 11, 18, 22, 28, 33, 35, 38, 40, 46, 50, 55, 60, 65, 69, 73, 77, 81, 86]
# task_ids: all
episodes_per_task: 20
episode_selection: first       # first | random
episode_ids: []                # optional exact global episode IDs
seed: 42

# eval_max_concurrent caps how many replay tasks run at once; workers_per_checkpoint
# splits one checkpoint's occurrences across that many jobs. Images come straight
# from the dataset videos (no simulator) and the replay holds NO GPU, so this is a
# Replay concurrency throttle. With inherited train QOS, each slot also reserves
# one GPU even though the replay computation itself remains CPU-only.
eval_max_concurrent: 2   # one replay job per listed FSQ run
# "all" makes one CPU allocation replay every available checkpoint for a run.
# The process keeps decoded frames in RAM, so later checkpoints neither re-import
# the stack nor decode the same episode frames again.
checkpoints_per_job: all
workers_per_checkpoint: 1
resume: true
              # FSQ_VS_BSQ

slurm:
  # gres/latents_time cover the GPU prepass that encodes each checkpoint's skill
  # latents -- the only GPU work in this pipeline, submitted as ONE job per run.
  gres: gpu:1
  latents_time: "01:00:00"
  # Replay computation only uses CPU. When replay_qos is blank, however, it
  # inherits train placement and reserves gpu:1 to satisfy GPU-QOS rules.
  # With an explicit replay_qos, blank replay_gres means true CPU-only.
  replay_gres: ""
  # Blank -> global_config.yaml train_partition/train_qos + one GPU reservation.
  # For CPU-only, explicitly set dell_cpu/cpu_qos and leave replay_gres blank.
  replay_partition: "" # "dell_cpu"
  replay_qos: "" # "cpu_qos"
  # dell_cpu is only 4 nodes (52 CPUs / 450G each), so a smaller footprint fits
  # many more replay tasks at once: 8 CPU/64G allows 6 per node, 4 CPU/16G
  # allows 13. The replay itself just decodes two frames per occurrence.
  replay_cpus: 4
  replay_memory: 16G
  cpus: 8
  memory: 64G
  time: "01:00:00"
