# GT-skill probe of FSQ co-trained or standalone auxiliary terminators.
#
# Every listed model is scored against the SAME GT skills: the skillset fixes
# each skill's start and end frame, so no policy rollout and no MAIN terminator
# are involved -- the question is only "when does this terminator fire relative
# to the known end?". Entries must therefore share one FSQ skillset; the config
# resolver refuses the run otherwise.
#
# Each row owns its FSQ encoder/code space. For source=auxiliary, the resolver
# loads the source FSQ.pt named by the skill_aux checkpoint and overlays only
# model.fsq_term_train.*. Thus zero/norm_action models may be compared on the
# same GT skill occurrences without sharing integer code meanings.

output_name: "3333_2"

# source: auxiliary resolves:
#   <outputs_root>/skillVLA_terminator/<run_name>/checkpoints/<step>/pretrained_model
# checkpoint: last selects the greatest complete training step at submission.
# source: fsq remains supported for historical co-trained FSQ checkpoints.
terminator_models:
  - label: 3333_cont_own
    source: fsq
    run_name: FSQ3333_norm_action01_recon_termRES__contrastiveON_routeON_loss
    checkpoint: 1750
  
  - label: 3333_cont_DINO_frez
    source: auxiliary
    run_name: bs32_FSQ3333_termRES_contrastive_1750_pt_libero_90_full_full_terminator
    checkpoint: 100000

  # - label: zero_DINO
  #   source: auxiliary
  #   run_name: bs32_FSQ333_zero01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_libero_90_full_firsthalf_scene_terminator_DINO_unfrez
  #   checkpoint: last
  # - label: norm_action_RES
  #   source: auxiliary
  #   run_name: bs32_FSQ333_norm_action01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_libero_90_full_firsthalf_scene_terminator_resnet_unfrez
  #   checkpoint: last
  # - label: norm_action_DINO
  #   source: auxiliary
  #   run_name: bs32_FSQ333_norm_action01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_libero_90_full_firsthalf_scene_terminator_DINO_unfrez
  #   checkpoint: last

target_task: libero_90
# Which numbering task_ids uses. The skillset numbers tasks by the SOURCE
# DATASET's meta/tasks.parquet, while terminator_eval / fsq_gt_replay with an
# episode-exact map number them by the LIBERO suite -- and a filtered dataset
# drops tasks, so the two disagree (libero_90_full_full has 73 tasks; suite id 1
# is dataset id 26). Set "suite" to paste the same list those tools use; the run
# then logs the translation it applied.
task_id_space: suite        # dataset | suite
# Task ids, or "all" for every task the skillset covers.
task_ids: [0, 3]
# task_ids: [0, 3, 4, 5, 6, 11, 18, 22, 28, 33, 35, 38, 40, 46, 50, 55, 60, 65, 69, 73, 77, 81, 86]
episodes_per_task: 3
episode_selection: first       # first | random
episode_ids: []                # optional exact global episode ids
seed: 42

# Firing rule: the first frame whose termination probability crosses this.
end_threshold: 0.5

# Rendering cost knob. Every sampled skill is scored, but only this many per
# codebook entry get a GT video with the terminator bars drawn on it.
max_plot_entries: 0             # 0 = every active entry
max_plot_samples: 3
batch_size: 64

video:
  frame_stride: 1
  fps: 10

resume: true
eval_num_gpus: 4
slurm: {gres: "gpu:1", cpus: 8, memory: 64G, time: "01:00:00"}
