# skill_eval — FSQ eval config (Stage 4). Submit with ./submit_fsq_eval.sh.
# FSQ reconstruction/termination/progress HTML (needs a trained FSQ). The FSQ is
# evaluated on the skillset it was trained on, recorded in its fsq_meta.json.
# Project paths / slurm partition+qos come from configs/global_config.yaml.

# ── Roots ──
# libero_90_full_full | abc_toy
target_dataset: libero_90_full_full
fsq_dataset_root: FSQ_dataset
fsq_inputs_name: FSQ_inputs
skillset_name: skillset
# Resolver fallback only: the evaluated skillset normally comes from the FSQ run's
# fsq_meta.json; legacy checkpoints missing a field fall back to these values.
skillset_mode: std                   # spherical | full | without_gripper | std
skillset_output_suffix: ""
skillset_boundary_threshold_mode: global_mean   # episode_mean | global_mean
# Optional frozen global-threshold JSON (selects the `_globalref` skillset). Must match build_data.
skillset_global_threshold_source: ""

# ── FSQ selection ──
fsq_eval_dino_model_path: models/dinov3-vitl16

# Folder names now embed the DP run (dp_tag) that produced the skillset. Renamed runs (all dino8_obs10):
fsq_eval_run_name: libero_90_full_full_state_obs20_std_global_ms1_fsq333_dino_frozen_small_optimal
# fsq_eval_run_name: libero_90_full_full_state_obs20_std_global_ms1_fsq333_dino_frozen_small_optimal_broadcast
fsq_eval_checkpoint: 200
# The terminator always consumes both cameras; architecture/backbone live in the checkpoint.

# ── Evaluation / HTML knobs ──
fsq_eval_n_action_steps: 5       # chunk plot stride (draw a predicted chunk every N steps)
fsq_eval_n_samples: 10            # sample skills shown per codebook entry
fsq_eval_max_entries: 10 #0          # 0 = render sample plots for every active entry
fsq_eval_decoder_scope: samples    # samples = decode only 50×10 displayed skills; all = full-skill decoder metric
fsq_eval_end_threshold: 0.5      # termination probability threshold for timing
# Overlay actions from a different trained code sampled from the farthest active-code fraction.
fsq_eval_random_far_skill: true
fsq_eval_random_far_fraction: 0.1
eval_thumb_size: 160
eval_image_key: observation.images.image
fsq_eval_wandb_project: VAE_eval

# ── Slurm / GPU. partition/qos/nodelist/exclude_nodes come from configs/global_config.yaml. ──
eval_gres: gpu:1
eval_cpus_per_task: 4
eval_mem: 64G   # DINO npz loaded via mmap_mode='r' — only accessed pages are paged in
eval_time: "02:00:00"
