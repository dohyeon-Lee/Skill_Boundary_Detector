# ── BSQ training config (FSQ-original 구조에서 quantizer만 BSQ로 교체) ─────────
# 인코더(스플라인 토큰 transformer)/디코더(oneshot|rnn)/학습 루프는 FSQ_original과
# 동일하고, FSQ 그리드 대신 Binary Spherical Quantization(2^code_dim 구면 코너)을
# 사용. BSQ 논문의 entropy loss(샘플 confidence + 배치 diversity)를 분리 가중치로
# 지원. run 이름의 fsq 태그가 bsq{code_dim}으로 바뀌어 FSQ run과 절대 안 섞임.
fsq_dataset_root: FSQ_dataset
target_dataset: libero_90_full_full # libero_90_full_full | langgap_56_full_full
fsq_inputs_name: FSQ_inputs
skillset_seg_name: seg_libero_90_full_full_state_obs20_ck100000_std_episodemean_100p
skillset_name: skillset


# ── BSQ quantizer ──
bsq_code_dim: 5                  # 코드북 2^5=32 (fsq333=27과 비교용). 시각화용은 3(=8, 구면 8분면)
bsq_inv_temperature: 10.0        # soft-bit 날카로움. 논문은 100; 10→30→100 스케줄 비교 가치
bsq_entropy_conf_weight: 0.1     # 샘플 entropy 최소화(비트 확신, 경계 밀어냄). 0=끔
bsq_entropy_div_weight: 0.1      # 배치 entropy 최대화(비트 균형). 0=confidence-only. 논문 γ=1 ≙ conf=div
# coverage loss: 죽은 코드 소생 전용 (floor 미달 코드에만 압력; 균등화 없음). 0 = 끔.
bsq_entropy_cov_weight: 0.0
bsq_entropy_cov_floor: 0.0      # 0 = 자동 (1/batch)
# dataset entropy는 항상 joint(전체 코드 열거, 정확 계산) — 선택지 아님.


# ── model / run ──
# fsq_exp 태그 관례: 구조는 입출력 모달리티로 표기 — pos_pos | pos_act | act_act.
# joint는 항상 켜져 있으므로 태그 생략, constLR(기본 LR)도 생략. BSQ는 loss 태그 항상 withEntH.
fsq_exp: "act_act_LR6_raw_withEntH"
fsq_levels: [3, 3, 3]            # bsq에선 무시되지만 resolver 태그 치환용으로 유지
fsq_hidden_dim: 256
fsq_num_layers: 3
fsq_n_control: 30
# zero_grounded | raw_state | optimal (zero-grounded + one absolute start-EEF token)
fsq_encoder_input_mode: raw_state
# false: 인코더에서 길이 토큰 제거 (길이는 모션 형태를 통해서만 z에 들어감)
fsq_orig_encoder_length_token: false
# spline: 고정 컨트롤포인트 토큰. action_seq: 가변 ACTION 시퀀스 transformer (rnn 디코더 필수)
fsq_orig_encoder_arch: action_seq
fsq_orig_decoder_layers: 3
# oneshot: ctrl point 복원 MLP. rnn: z-only GRU unroll (매 스텝 action + termination)
fsq_orig_decoder_arch: rnn
# oneshot 전용; rnn에서는 무시됨
fsq_orig_reconstruct_length: false

# ── rnn arch 전용 loss ──
fsq_orig_action_loss_weight: 1.0
fsq_orig_term_loss_weight: 1.0
fsq_orig_term_pos_weight: 1.0
fsq_orig_term_sigma: 1.0

# ── oneshot 전용 loss ──
fsq_orig_ctrl_loss_weight: 1.0
fsq_orig_length_loss_weight: 1.0


# ── training ──
fsq_encoder_lr: 3.0e-6
fsq_orig_decoder_lr: 3.0e-6
fsq_lr_schedule: constant # cosine | constant
fsq_batch_size: 64
fsq_num_epochs: 1000
fsq_checkpoint_every: 25
fsq_num_workers: 0
fsq_val_every: 25
fsq_save_best_model: false


# ── Slurm (partition/qos/nodelist/exclude from configs/global_config.yaml) ──
fsq_train_gres: gpu:1
fsq_train_cpus_per_task: 8
fsq_train_mem: 32G
fsq_train_time: "24:00:00"
fsq_wandb_project: VAE_train
