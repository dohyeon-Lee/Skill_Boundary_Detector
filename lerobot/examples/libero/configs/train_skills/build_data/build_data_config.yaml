# ── FSQ-data build config (Stage 2) ────────────────────────────────────────────
# Self-contained: runs a TRAINED DP to segment the demos into a skillset. This is the
# only stage that depends on a specific DP. FSQ reads raw images live, so this stage
# emits no per-skill visual-token cache.
#
# Output: {dataset_root}/{fsq_dataset_root}/{target}/FSQ_inputs/seg_{dp_run_name}_ck{dp_checkpoint}/
#           skillset/

target_dataset: libero_90_full_full

# Which trained DP to segment with — folder name under outputs/DP/ (ls there for choices).
dp_run_name: libero_90_full_full_state_obs20
dp_checkpoint: "100000"

# Skillset output roots.
fsq_dataset_root: FSQ_dataset
fsq_inputs_name: FSQ_inputs
skillset_name: skillset

# Skill-boundary action-manifold mode. The mode is part of the skillset path.
skillset_mode: std                   # spherical | full | without_gripper | std
skillset_action_mode: dataset        # LIBERO: dataset; ABC DP/VLA: anchor_relative
skillset_gripper_mode: discrete      # LIBERO: discrete; ABC: continuous
skillset_gripper_indices: [-1]       # ABC bimanual layout: [6, 13]
# One SBD spacing rule: boundaries must be farther apart than this many frames,
# and peaks within this distance from either episode edge are excluded.
skillset_nms_dist: 20
# Optional manual tag for a separate skillset artifact. Example: `trialA` becomes
# `seg_*_std_globalmean_trialA/`. Empty keeps the canonical output name.
skillset_output_suffix: "min20"

# Boundary threshold: episode_mean uses each episode's own smoothed-divergence
# mean (legacy). global_mean first collects every episode's curve, computes one
# replan-point-weighted global mean, then segments every episode against it.
# Global output is isolated under a `_globalmean` segment directory so it never
# resumes from or overwrites a legacy skillset.
skillset_boundary_threshold_mode: global_mean   # episode_mean | global_mean
# Empty = compute a fresh global mean from this target dataset. To freeze the
# taxonomy for a new task, set a project-relative or absolute JSON source, e.g.
# dataset_filtered/FSQ_dataset/libero_90_full_full/FSQ_inputs/seg_libero_90_full_full_state_obs20_ck100000_std_globalmean/skillset/global_boundary_threshold.json
# A non-empty source produces a separate seg_*_globalref output and reuses its
# global_mean after this target's curves have been computed.
skillset_global_threshold_source: ""

# ── Slurm for skillset generation (partition/qos from global_config) ──
slurm_gres: gpu:1
skillset_wandb_project: ""
skillset_tasks_per_job: 5
skillset_cpus_per_task: 4
skillset_mem: 32G
skillset_time: "4:00:00"
