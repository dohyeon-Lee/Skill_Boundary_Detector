# ── FSQ-data build config (Stage 2) ────────────────────────────────────────────
# Self-contained: runs a TRAINED DP to segment the demos into a skillset. This is the
# only stage that depends on a specific DP. FSQ reads raw images live, so this stage
# emits no per-skill visual-token cache.
#
# Output: {dataset_root}/{fsq_dataset_root}/{target}/FSQ_inputs/seg_{dp_run_name}_ck{dp_checkpoint}/
#           skillset/

target_dataset: libero_90_full_full

# Which trained DP to segment with — folder name under outputs/DP/ (ls there for choices).
# The DP-DINO grid below must match this DP (dino{grid}); for resnet/state DPs the grid is unused.
dp_run_name: libero_90_full_full_state_obs20
dp_checkpoint: "100000"

# DINO grid below belongs only to a DINO-based DP segmenter.
dino_source_dataset: libero_90_full_full
dino_patch_grid: 8                  # DP grid (matches dp_run_name)
dino_copy_mode: hardlink
dino_overwrite_prepared: false

# Skillset output roots.
fsq_dataset_root: FSQ_dataset
fsq_inputs_name: FSQ_inputs
skillset_name: skillset

# ── Slurm for skillset generation (partition/qos from global_config) ──
slurm_gres: gpu:1
skillset_wandb_project: Skill_dataset
skillset_tasks_per_job: 5
skillset_cpus_per_task: 4
skillset_mem: 32G
skillset_time: "4:00:00"
