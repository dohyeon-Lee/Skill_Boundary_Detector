# libero_90_full_full | abc_toy | playdraw_full_full
target_dataset: libero_90_full_full
# state DP omits the default encoder from its name; non-default encoders keep their suffix.
# Proprio grounding is read from the selected DP checkpoint automatically.

# dp_run_name: playdraw_full_full_grounded_future_only_obs20_future24_small
# dp_run_name: playdraw_full_full_grounded_history_reconstruction_obs20_future24_small

# dp_run_name: libero_90_full_full_grounded_future_only_obs20_future24_small
# dp_run_name: libero_90_full_full_grounded_future_only_obs5_future24_small
# dp_run_name: libero_90_full_full_grounded_history_reconstruction_obs20_future24_small
# dp_run_name: libero_90_full_full_grounded_future_only_obs20_future16_small
dp_run_name: libero_90_full_full_grounded_future_only_obs20_future24_transformer_constLR_small

# dp_checkpoint: "100000"
dp_checkpoint: "010000"

# Skillset output roots.
fsq_dataset_root: FSQ_dataset
fsq_inputs_name: FSQ_inputs
skillset_name: skillset

# Skill-boundary detector mode. The mode is part of the skillset path.
# gaussian_x0hat selects the final r5_global_mean detector preset.
skillset_mode: gaussian_x0hat        # spherical | full | without_gripper | std | gaussian_x0hat
skillset_action_mode: dataset        # LIBERO: dataset; ABC DP/VLA: anchor_relative
skillset_gripper_mode: discrete      # LIBERO: discrete; ABC: continuous
skillset_gripper_indices: [-1]        # ABC bimanual layout: [6, 13]

# ── Slurm for skillset generation (partition/qos from global_config) ──
slurm_gres: gpu:1
skillset_wandb_project: ""
skillset_tasks_per_job: 5
skillset_cpus_per_task: 4
skillset_mem: 32G
skillset_time: "4:00:00"
