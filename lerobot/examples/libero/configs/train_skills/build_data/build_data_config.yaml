# libero_90_full_full | abc_toy | langgap_56_full_full
target_dataset: libero_90_full_full_rel
# libero_90_full_full_state_obs20 | abc_toy_full_full_state_obs20 | langgap_56_full_full_state_obs20 | libero_90_full_full_rel_state_obs20
dp_run_name: libero_90_full_full_rel_state_obs20
dp_checkpoint: "100000"

# Skillset output roots.
fsq_dataset_root: FSQ_dataset
fsq_inputs_name: FSQ_inputs
skillset_name: skillset

# Skill-boundary action-manifold mode. The mode is part of the skillset path.
skillset_mode: std                   # spherical | full | without_gripper | std
skillset_action_mode: dataset        # LIBERO: dataset; ABC DP/VLA: anchor_relative
skillset_gripper_mode: discrete      # LIBERO: discrete; ABC: continuous
skillset_gripper_indices: [-1]    # [-1]       # ABC bimanual layout: [6, 13]

skillset_nms_dist: 20
skillset_min_skill_len: 10
skillset_output_suffix: ""

skillset_boundary_threshold_mode: episode_mean   # episode_mean | global_mean
skillset_boundary_threshold_scale: 1 # 0.8
skillset_global_threshold_source: ""

# ── Slurm for skillset generation (partition/qos from global_config) ──
slurm_gres: gpu:1
skillset_wandb_project: ""
skillset_tasks_per_job: 5
skillset_cpus_per_task: 4
skillset_mem: 32G
skillset_time: "4:00:00"
