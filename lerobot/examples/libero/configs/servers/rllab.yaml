# RLLAB server (Slurm). Selected automatically when the checkout lives under a detect: prefix
# (see ../src/global_config_loader.py); override with SBD_SERVER=rllab. project_root = the checkout.
# Keep this file flat (key: value / - item); pyyaml may be absent.

detect:
  - /data1/dohyeon
  - /data2/dohyeon

scheduler: slurm
slurm_submit_mode: srun

# --- Slurm common defaults (canonical; every module reads these) ---
train_partition: debug
train_qos: base_qos
train_nodelist: "node200"
train_exclude_nodes: [""]
