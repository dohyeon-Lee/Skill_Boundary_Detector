# Yonsei AI cluster (Slurm). Selected automatically when the checkout lives under a detect: prefix
# (see ../src/global_config_loader.py); override with SBD_SERVER=yonsei. project_root = the checkout.
# Keep this file flat (key: value / - item); pyyaml may be absent.

# srun --pty \
#   --partition=dell_cpu \
#   --account=ys_ms \
#   --qos=cpu_qos \
#   --cpus-per-task=4 \
#   --mem=16G \
#   --time=08:00:00 \
#   bash -l

detect:
  - /scratch2/mdorazi
  - /scratch/mdorazi

# How submit_*.sh start jobs (src/submit_job.sh): slurm = sbatch.
scheduler: slurm

# --- Slurm common defaults (canonical; every module reads these) ---
# train_partition: accepts one or more (comma/list); blank -> Slurm picks first available.
# NOTE: leave non-empty — resolvers fall back to per-module defaults (big/debug) when this is
# blank, which would re-introduce divergence. Set the partition(s) you actually want here.
train_partition:
  - suma_rtx4090
  - base_suma_rtx3090
  - dell_rtx3090
  - big_suma_rtx3090
  - asus_a5000
  - gigabyte_a5000

  - gigabyte_a6000
  - suma_a6000
  - asus_6000ada
  - tyan_a6000
# train_qos: base_qos
train_qos: big_qos

#   - asus_pro6000
#   - gigabyte_pro6000
# train_qos: pro6000_qos

train_nodelist: ""
train_exclude_nodes:
  - node18
  - node40
  - node24
  - node54
  - node52
  - node30
  - node33
  - node29
  - node23
