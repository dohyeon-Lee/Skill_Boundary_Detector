stage: ft
pi05_outputs_root: pi05_cyclic_FT
pi05_ft_outputs_root: pi05_cyclic_FT
pi_base: models/pi05_base
pi05_tokenizer: models/paligemma-3b-pt-224-tokenizer
ft_source:
  model_dir: bs16_libero_10_0_full_PT20k_ptstats_from_bs16_libero_90_full_full_base
  label: iid
  stage: ft
ft_source_checkpoint: '005000'
ft_probe_source_run: outputs_filtered/pi05_cyclic_PT/bs16_libero_90_full_full_base_cyclic_g10p200_s0_gckpt
ft_dataset: libero_10_3_full
ft_exp: ''
ft_probe_every: 250
adaptation:
  freeze_expert: false
training:
  normalization_stats: pt
  dataloader:
    batch_size: 16
    workers: 4
  optimizer:
    base_lr: 2.5e-05
  gradient_checkpointing: false
  schedule:
    steps: 5000
    lr_mode: warmup_constant
    warmup_steps: 1000
    lr_decay_steps: 30000
    decay_lr: 2.5e-06
    log_every: 200
    save_every: 1000
    save_steps:
    - 1000
    - 3000
    - 5000
  keep_checkpoints: -1
  protect_checkpoints: []
logging:
  wandb:
    enable: true
    project: cyclic_FT
slurm:
  gres: gpu:1
  cpus: 16
  memory: 128G
  time: '48:00:00'
ft_reference_pt_checkpoint: outputs_filtered/pi05_PT/bs16_libero_90_full_full_base/checkpoints/020000/pretrained_model
