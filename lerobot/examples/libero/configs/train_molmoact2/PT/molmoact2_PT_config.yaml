# ./submit_train.sh --smoke first; ./submit_train.sh starts the configured PT run.
# Roots and Slurm placement come from configs/global_config.yaml + servers/<server>.yaml.
stage: pt
runtime:
  venv: .venv_molmoact2_lerobot
  source: third_party/lerobot_molmoact2
model:
  checkpoint: models/molmoact2_base
dataset:
  name: libero_90_full_full
  action_horizon: 10
run: {suffix: "base"}
pt_proprio_grounding: true      # state[:3] -= episode's first EEF XYZ; same cache/stats as pi05

training:
  # batch_size is the GLOBAL batch; micro_batch_size is per GPU forward/backward.
  # Accumulation = batch_size / (micro_batch_size * gpus); no automatic LR scaling.
  tuning: full                 # full | action_expert (VLM frozen)
  
  # action_format: both          # paper FT recipe: discrete-action CE + continuous flow matching
  # num_flow_timesteps: 8        # paper FT recipe: 8 training noise/time pairs, NOT inference steps
  action_format: continuous   # keep the current experiment: continuous flow matching only
  num_flow_timesteps: 1        # training noise/time pairs, NOT inference denoising steps
  optimizer: {base_lr: 2.5e-5}  # all four groups; optional *_lr overrides remain supported
  keep_checkpoints: 2          # latest 2 regular checkpoints, plus the protected steps below
  protect_checkpoints: [30000, 50000, 100000]  # keep full training state; must align with save_every
  dataloader: {batch_size: 16, micro_batch_size: 16, workers: 12, gpus: 1}
  gradient_checkpointing: false
  schedule: {steps: 100000, lr_mode: warmup_constant, warmup_steps: 1000, log_every: 100, save_every: 10000}

logging:
  wandb: {enable: true, project: VLA_stage1, entity: ""}
# slurm: {gres: "gpu:1", cpus: 16, memory: 128G, time: "48:00:00"}
slurm: {gres: "gpu:1", cpus: 24, memory: 128G, time: "48:00:00"}
