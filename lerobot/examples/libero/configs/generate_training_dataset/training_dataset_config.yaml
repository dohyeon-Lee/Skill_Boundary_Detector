# Shared config for configs/generate_training_dataset.
# Update project_root when moving this workflow to another server.

# project_root/dataset_root come from configs/global_config.yaml.

# Defaults for build_training_dataset.py
build_dataset: libero_90_full_full
build_task_range: full
build_episodes_per_task: full
build_output_name: ""
build_overwrite: false    # false: fail if the output dataset already exists; true: replace it.
build_allow_fewer: false  # false: fail if a task has fewer episodes than requested; true: use all available.

# Defaults for inspect_training_dataset.py
inspect_dataset: libero_90_full_full

# Defaults for run_frame_dino_parallel.sh
dino_target_dataset: libero_object_full_2
# Which camera(s) the frame-DINO precompute runs for. Ergonomic knob (CLI --camera overrides):
#   image (3rd-person) | wrist | both | <raw comma-separated keys>
# Run 3rd-person and wrist separately (image then wrist) or together (both); each writes a
# separate camera subdir under the same output dir. DP is unaffected (it reads its own
# dino_image_keys from train_skills_config). Empty → fall back to dino_image_keys below.
dino_camera: both
dino_image_keys: ["observation.images.image"]
dino_patch_grid: 8  # 14 <- original
dino_batch_size: 1024
dino_dtype: float16
dino_wandb_project: DP_train

# Slurm/GPU settings for DINO precompute.
# partition/qos/exclude_nodes come from configs/global_config.yaml.
dino_gpu_reserve: 0
dino_gpu_max_per_node: 7
dino_max_workers: 0
