# Shared config for configs/generate_training_dataset.
# Update project_root when moving this workflow to another server.

# project_root/dataset_root come from configs/global_config.yaml.

# Defaults for build_training_dataset.py
build_dataset: libero_90_full_full
build_task_range: full
build_episodes_per_task: full
build_output_name: ""
build_overwrite: false    # false: fail if the output dataset already exists; true: replace it.
build_allow_fewer: false  # false: fail if a task has fewer episodes than requested; true: use all available.

# Defaults for inspect_training_dataset.py
inspect_dataset: libero_90_full_full
