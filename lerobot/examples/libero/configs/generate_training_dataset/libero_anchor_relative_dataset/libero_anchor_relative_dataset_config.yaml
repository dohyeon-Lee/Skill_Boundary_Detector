# Opt-in LIBERO action-space conversion.
# project_root / dataset_root / Slurm partition settings come from ../../global_config.yaml.
#
# Source rows contain post-action observations paired with the action that produced
# them.  The builder shifts by one row per episode and stores absolute commanded EEF
# targets.  SO(3)-relative model targets are generated on the fly during training.

# Blank means the global dataset_root. Keeping source and output under one root makes
# downstream training selection a dataset-name-only change.
anchor_relative_dataset_root: ""

# output dataset name -> source LeRobot-v3 dataset name
anchor_relative_datasets:
  libero_10_full_full_rel:
    source_dataset: libero_10_full_full
  libero_90_full_full_rel:
    source_dataset: libero_90_full_full

# Canonical robosuite OSC_POSE normalization used by the source LIBERO collection.
osc_position_scale: 0.05
osc_rotation_scale: 0.5

# Must cover the largest Diffusion Policy horizon that will consume the sidecar.
relative_chunk_size: 50

# Videos/proprio are copied; videos are decoded and re-encoded because one terminal
# frame is removed from every episode. portable_h264 performs a real one-frame NVENC
# probe on each execution node and falls back to software H.264 on any failure.
convert_vcodec: portable_h264
convert_streaming_encoding: true
convert_encoder_queue_maxsize: 64
convert_encoder_threads: 4
convert_deferred_video_packing: true
convert_image_writer_threads: 10
convert_image_writer_processes: 5
convert_overwrite: false

# Allow the final afterok merge to replace an old/incomplete derived output without
# requiring FORCE=1. Replacement happens only after every new shard validates. A final
# output with a valid aggregation manifest is never overwritten by this setting.
convert_replace_incomplete_output: true

# Each dataset is split by converted frame count. Within every array task, a complete
# mini-dataset is committed every N episodes so a killed/requeued job resumes from the
# last valid checkpoint instead of restarting its whole shard.
convert_num_shards: 4
convert_checkpoint_episodes: 20
convert_keep_checkpoints: false

# A dependent aggregation job runs only after every array task succeeds, computes
# relative stats once, then removes the verified intermediate shards by default.
convert_keep_shards: false

# Slurm resources for the rewrite. The global train partition/qos/exclude are reused.
convert_gres: gpu:1
convert_cpus_per_task: 16
convert_mem: 64G
convert_time: "24:00:00"
