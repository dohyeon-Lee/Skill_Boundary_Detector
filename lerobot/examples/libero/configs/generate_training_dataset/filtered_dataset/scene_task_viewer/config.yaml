# ── scene_task_viewer 설정 ──────────────────────────────────────────────
# 분석할 (filtered) LIBERO 데이터셋들을 나열하면, scene별로 어떤 task가 있는지
# 첫 프레임 이미지 + language + 소속 데이터셋과 함께 보여주는 단일 HTML을 만든다.
#
# 실행:
#   /data2/dohyeon/SBD/.venv/bin/python build_scene_task_html.py --config config.yaml

# 데이터셋 루트. 절대경로거나 project_root 기준 상대경로.
project_root: /data2/dohyeon/SBD
dataset_root: dataset_filtered

# LIBERO benchmark(scene↔language 매핑용). project_root 기준 상대경로 가능.
libero_pkg: tools/lerobot-libero

# scene 카드에 보여줄 카메라 (observation.images.image = 정면, wrist_image = 손목).
image_key: observation.images.image

# 첫 프레임 JPEG 품질(1-95). 작을수록 HTML 용량↓.
jpeg_quality: 82

# 분석할 데이터셋들. 로컬 폴더명({dataset_root}/{name}).
#   suite: 생략 시 이름에서 자동 유도(libero_90_full_full -> libero_90).
#          scene↔language 매핑을 위해 libero_task_map의 suite 키와 일치해야 함.
datasets:
  - name: libero_90_full_full
  - name: libero_10_full_full
  - name: libero_goal_full_full
  - name: libero_object_full_full
  - name: libero_spatial_full_full

# 출력 HTML 경로(스크립트 위치 기준 상대경로 가능).
output_html: scene_tasks.html
