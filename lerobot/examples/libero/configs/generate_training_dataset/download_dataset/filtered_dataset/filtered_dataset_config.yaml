# Shared config for FILTERED LIBERO download/convert utilities.
# project_root comes from configs/global_config.yaml.
#
# "Filtered" = the OpenVLA-preprocessed LIBERO suites (failed replays removed, no-op frames
# stripped), hosted by IPEC-COMMUNITY on the HF hub in LeRobot v2.1 format. The build here:
#   download (v2.1) → migrate v2.1→v3.0 → gripper remap (zero_close: 0/1 → ±1) → quantile stats
# Images need NO 180° rotation (already corrected by the OpenVLA regeneration —
# the existing libero_dataset/libero_90 came from the same source and is upright).

# ── Output root ───────────────────────────────────────────────
# Final datasets land at {project_root}/{filtered_dataset_root}/{name};
# v2.1 staging downloads live under {project_root}/{filtered_dataset_root}/_v21/{name}.

# FILTERED_ONLY="libero_90" ./submit_build_filtered.sh

filtered_dataset_root: dataset_filtered

# ── Suites: local name -> HF repo id (note: only libero_90 lacks the `_1.0.0_` infix) ──
# 로컬 이름은 repo 변환 산출물 컨벤션({suite}_full_full)을 따름 — 하류 설정의
# source_dataset(libero_90_full_full 등)과 일치해야 global dataset_root 전환만으로 물림.
filtered_suites:
  libero_90_full_full: IPEC-COMMUNITY/libero_90_no_noops_lerobot
  libero_10_full_full: IPEC-COMMUNITY/libero_10_no_noops_1.0.0_lerobot
  libero_spatial_full_full: IPEC-COMMUNITY/libero_spatial_no_noops_1.0.0_lerobot
  libero_object_full_full: IPEC-COMMUNITY/libero_object_no_noops_1.0.0_lerobot
  libero_goal_full_full: IPEC-COMMUNITY/libero_goal_no_noops_1.0.0_lerobot

# ── v2.1 → v3.0 conversion file sizes (match the existing local datasets' layout) ──
data_file_size_in_mb: 100
video_file_size_in_mb: 200

# ── Stats 계산 범위 ───────────────────────────────────────────
# false (기본/fast): 비디오 feature는 변환 시 집계된 min/max/mean/std 유지(DP의 MEAN_STD에 충분),
#   quantile(q01..q99)은 비-비디오 feature(state/action 등)만 parquet에서 직접 계산 — 몇 분.
#   (이미지 quantile은 DP/pi05/skillVLA 어느 것도 사용하지 않음: VISUAL=IDENTITY 또는 MEAN_STD)
# true (full): 에피소드별 비디오 전체 디코딩으로 모든 feature의 모든 stat 재계산 — 수 시간.
#   구서버 libero_90과 stats.json을 byte 수준까지 맞추고 싶을 때만.
stats_include_videos: false
