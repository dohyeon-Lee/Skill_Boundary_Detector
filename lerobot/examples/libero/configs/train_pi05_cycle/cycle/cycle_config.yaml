# Block-cyclic PT mini-experiments (configs/train_pi05_cycle).
# project_root / dataset_root / outputs_root come from configs/global_config.yaml.
# 이 yaml만 수정하고 ./submit_cycle_PT.sh — run name에 조건 자동 인코딩되므로 겹칠 걱정 없음.
#
# ── 조건 프리셋 치트시트 (바꿀 키만 표시, 나머지는 그대로) ──────────────────
#  iid baseline          : cycle_iid_baseline=true                        → PTiid_..._constlr
#  순수 cyclic           : iid=false, lambda=0, beta=1, beta_end=-1       → PTcyc_...
#  cyclic + Δ            : iid=false, cycle_delta_lambda=0.5              → ..._lam05
#  cyclic + Reptile 고정 : iid=false, cycle_reptile_beta=0.5              → ..._b05
#  cyclic + β스케줄(주력): iid=false, beta=0.5, beta_end=0.1              → ..._b05to01
#  decay LR 비교군       : pt_constant_lr=false                          → (constlr 태그 없음)
#  k sweep               : cycle_phase_steps ∈ {125, 250, 500, ...}       → ..._p{K}
#  g sweep (사이클 보존) : cycle_n_groups + cycle_n_cycles>0              → ..._g{G}c{N}
#
# Output: {project_root}/{outputs_root}/pi05_cycle_PT/{run_name}

pi05_cycle_outputs_root: pi05_cycle_PT
pi_base: models/pi05_base
pi05_tokenizer: models/paligemma-3b-pt-224-tokenizer

# ── PT (mirrors train_pi05 keys) ──────────────────────────────
pt_dataset: libero_90_full_full
pt_batch_size: 16 # 16
pt_num_workers: 4
pt_exp: ""
pt_lr_base: 2.5e-05 # 5.0e-05 # 2.5e-05
# true → warmup 후 LR 고정(cosine decay 끔). forget 진폭 감소가 구조 형성인지
# LR decay 아티팩트인지 분리하는 대조군용. run name에 _constlr 자동 태그.
pt_constant_lr: true
pt_steps: 20000          # mini scale: g8 × p500 → 4k steps/cycle → 5 cycles
pt_save_freq: 5000
pt_log_freq: 200
pt_wandb_project: VLA_cycle

# ── block-cyclic curriculum ───────────────────────────────────
cycle_n_groups: 8        # 73 tasks → frame-balanced groups (greedy bin-packing, task는 통째로)
cycle_phase_steps: 250 #125   # k — THE sweep dial (perturbation size / cross-term gain)
cycle_n_cycles: 0        # >0: OVERRIDES phase_steps = steps // (n_groups × n_cycles)
                         #     (n_groups sweep 시 사이클 수 보존용; run name → g{G}c{N})
cycle_group_seed: 0      # task→group split + per-cycle order shuffle

# Δ-feedback (0 = off): w_g = 1 + λ·max(0, rel_forget), capped at delta_max_weight
cycle_delta_lambda: 0.0
cycle_delta_max_weight: 3.0

# Reptile (1.0 = off): cycle-level anchor, θ ← anchor + β(θ − anchor)
cycle_reptile_beta: 1.0 # 0.5 # 1.0
# β-스케줄 (≥0이면 켜짐): β를 사이클에 걸쳐 cycle_reptile_beta → 이 값으로 cosine anneal.
# "커밋만 anneal" — 정찰(inner LR)은 풀 스케일 유지, anchor는 말기에 합의 지점에 안착.
# LR decay의 CL-정합 대체재 (pt_constant_lr: true와 함께 쓰는 게 의도된 조합).
# run name → _b{start}to{end} (예: b05to01)
cycle_reptile_beta_end: # 0.1

# iid baseline (true = 학습은 순수 iid 글로벌 셔플, probe/로깅은 cyclic 런과 동일 → 공정 대조군.
# phase_steps는 probe 측정 주기로만 쓰이고 Δ/Reptile은 무시됨)
cycle_iid_baseline: true

# probe (fixed batches + fixed flow-matching noise → deterministic forgetting measurement)
cycle_probe_batches: 2   # per group, batch_size frames each
cycle_probe_seed: 12345
cycle_probe_grad_group: 0  # ≥0: log probe-grad rotation for that group (+1 backward/boundary, ~6GB CPU)

# ── Slurm (partition/qos/nodelist/exclude from global_config.yaml) ──
pt_gres: gpu:1
pt_cpus_per_task: 16
pt_mem: 128G
pt_time: "24:00:00"
