# ============================================================================
# Global config — single source of truth for machine/cluster-wide settings.
#
# Every module config under this `configs/` tree merges this file as its base
# (resolvers walk up to find `global_config.yaml`). Module yamls override `roots`
# locally if they declare the same key, but Slurm 4-keys below are read from here
# unconditionally (canonical `train_*`), so per-module partition/qos/nodelist/
# exclude settings all follow these values.
#
# NOTE: pyyaml may be absent (flat-yaml fallback parser is used). Keep this file
# flat (key: value), and do NOT put inline comments on empty-value lines.
# ============================================================================


# ============================================================================
# Cluster A (RLLAB) ==========================================================
# ============================================================================

# # --- Roots (module yamls may override locally, e.g. pi05 uses libero_dataset) ---
project_root: /data2/dohyeon/SBD
#dataset | dataset_filtered
dataset_root: dataset_filtered
#outputs | outputs_filtered
outputs_root: outputs_filtered
# --- Slurm common defaults (canonical; every module reads these) ---
# train_partition: accepts one or more (comma/list); blank -> Slurm picks first available.
# NOTE: leave non-empty — resolvers fall back to per-module defaults (big/debug) when this is
# blank, which would re-introduce divergence. Set the partition(s) you actually want here.
train_partition: debug
train_qos: base_qos
train_nodelist: ""
train_exclude_nodes: ["node200", "node01"]

