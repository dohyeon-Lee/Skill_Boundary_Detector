# ============================================================================
# Global config — settings shared by every machine.
#
# Every module config under this `configs/` tree merges this file as its base
# (resolvers walk up to find `global_config.yaml`). Machine-specific settings — the
# Slurm 4-keys (train_partition/qos/nodelist/exclude_nodes) and storage locations —
# live in servers/<name>.yaml and are merged on top by src/global_config_loader.py:
#   server = $SBD_SERVER, else `server:` below, else auto-detected from the checkout
#   path (each server file's detect: prefixes). project_root defaults to the checkout.
# Module yamls override `roots` locally if they declare the same key, but the Slurm
# 4-keys are read from the server file unconditionally (canonical `train_*`).
# Check the merged result:  python src/global_config_loader.py
#
# NOTE: pyyaml may be absent (flat-yaml fallback parser is used). Keep this file
# flat (key: value), and do NOT put inline comments on empty-value lines.
# ============================================================================

# auto | yonsei | rllab | runpod
server: auto

# --- Roots (module yamls may override locally, e.g. pi05 uses libero_dataset) ---
# Switch BOTH to *_filtered to run the whole pipeline on the filtered LIBERO data
# (see generate_training_dataset/download_dataset/filtered_dataset/): dataset_filtered / outputs_filtered.

# dataset_calvin | dataset | dataset_filtered | dataset_ABC | dataset_draw
dataset_root: dataset_filtered
# outputs_calvin | outputs | outputs_filtered | outputs_ABC | outputs_draw
outputs_root: outputs_filtered
