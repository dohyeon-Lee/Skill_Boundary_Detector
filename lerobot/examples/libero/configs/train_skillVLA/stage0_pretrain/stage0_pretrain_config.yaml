dataset:
  skillvla_root: skillvla_dataset
  source: libero_90_full_full
  run: FSQ333_dino_frozen_small_optimal_vsa_broadcast_150_std_pt_snap10_ms1_pmax15_halfnormal
  transition_randomization: true

warm_start:
  pi_base: models/pi05_base
  tokenizer: models/paligemma-3b-pt-224-tokenizer
  fsq: ""
  pretrain: {run: FSQ333_dino_frozen_small_optimal_vsa_broadcast_150_std_pt_snap10_ms1_pmax15_halfnormal_pretrain_full_rand, checkpoint: "020000"}

cond: {dino_model: models/dinov3-vitl16, state_adarms: true}
expert: {source: fsq} # fsq | pi05_base

connections: {vlm_to_cond: true, cond_to_expert: true, vlm_to_expert: true}
token_access: {image: true, language: true, skill: true, fast: false}

vlm_lora: {targets: [q, k, v, o], rank: 8, alpha: auto, dropout: 0.0, lr_scale: 10.0}
expert_lora: {targets: [q, k, v, o, mlp, action_out], rank: 8, alpha: auto, dropout: 0.0, lr_scale: 10.0}
language_bridge: {rank: 64, lr_scale: 10.0}
components:
  adapters: {vlm_lora: false, cond_lora: false, expert_lora: false, language_bridge: false}

regime:
  A:
    probability: 1 # 0.7
    drop_vlm: false
    freeze:
      base:    {vlm: false, cond: false, expert: false}
      adapter: {vlm_lora: false, cond_lora: true, expert_lora: false, language_bridge: false}
      vision:  {vlm_vision: true, cond_vision: true}
      skill:   {skill_reader: true, skill_head: true}
  B:
    probability: 0 # 0.3
    drop_vlm: true
    freeze:
      base:    {vlm: true, cond: false, expert: true}
      adapter: {vlm_lora: false, cond_lora: true, expert_lora: false, language_bridge: true}
      vision:  {vlm_vision: true, cond_vision: false}
      skill:   {skill_reader: true, skill_head: true}
  wrong_language: {weight: 0.0, margin: 0.02}

loss:
  flow:
    A: {skill_start_weight: 1.0, skill_end_weight: 1.0}
    B: {skill_start_weight: 1.0, skill_end_weight: 3.0}
  autoregressive:
    skill_weight: 1.0
    fast: false
    fast_weight: 1.0
    structure_weight: 0.1
    batch_size: 4

terminator: {train: false, freeze_vision: true}
run: {suffix: "pt20k_full_FASTX"}

training:
  dataloader: {batch_size: 16, workers: 4, gpus: 1}
  optimizer: {base_lr: 2.5e-05, cond_lr_scale: 1.0}
  schedule: {steps: 50000, warmup: 1000, save_every: 10000, log_every: 100}

logging:
  param_drift: true
  wandb: {enable: true, project: VLA_stage0}

slurm: {gres: "gpu:1", cpus: 16, memory: 256G, time: "48:00:00"}
