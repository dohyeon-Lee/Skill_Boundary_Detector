# project_root, dataset_root, outputs_root and cluster defaults come from global_config.yaml.

# Stage-2 data is prepared separately. It must use the same FSQ skill space and
# state/action geometry as the selected Stage-1 checkpoint.
dataset:
  skillvla_root: skillvla_dataset
  source: libero_90_full_secondhalf
  # run is inherited from the Stage-1 checkpoint's train_config.json.

# Exact Stage-1 output directory name; it is never parsed for architecture.
# The resolver reads checkpoints/<checkpoint>/pretrained_model/config.json.
warm_start:
  stage1_run: libero_90_full_firsthalf_FSQ333_175_dino_tuned
  checkpoint: last

likelihood:
  layers: 4
  # gt is the default; predictor uses the frozen Stage-1 predictor on skill-start observations.
  training_skill_source: gt

# Optional continuation training. The predictor still keeps its VLM frozen and
# trains only reader/head; both auxiliaries keep separate clipping from likelihood.
auxiliary:
  skill_predictor: {train: false, weight: 0.5, lr_scale: 1.0}
  terminator: {train: false, lr_scale: 1.0}

run: {suffix: ""}

training:
  dataloader: {batch_size: 16, workers: 2, gpus: 1}
  optimizer: {base_lr: 2.5e-05}
  gradient_checkpointing: true
  schedule: {steps: 50000, log_every: 100, save_every: 5000}

logging:
  wandb: {enable: true, project: VLA_stage2}

slurm: {gres: "gpu:1", cpus: 16, memory: 256G, time: "48:00:00"}
