# ── Paths (project_root/dataset_root come from configs/global_config.yaml) ──
skillvla_dataset_root: skillvla_dataset
# source_dataset is AUTO-DERIVED from where the run_tag lives ({skillvla_root}/*/{run_tag}); add a
# `source_dataset:` line here only if the same run_tag exists under more than one source.

# ── Warm-start (also selects the dataset: source + run_tag parsed from stage1_run_name) ──
pi_base: models/pi05_base  
# stage1_run_name: FSQ555_dino8_both_1000_siglip_batch256_state
# stage1_run_name: FSQ555_dino8_both_1000_siglip_batch256_state_weighted
stage1_run_name: FSQ555_dino8_weighted_wow_1000_siglip_batch256_state_weighted
stage1_checkpoint: "015000"   # "last" or a step number of the Stage-1 run above

# ── Skill head / FSQ ──────────────────────────────────────────
skill_loss_weight: 0.1                # total = BC + λ·skill_CE (λ<1 keeps BC dominant)

# ── Skill reader (SEPARATE post-VLM module; VLM stays pristine [imgs,lang]) ──────────────
# N learned probe tokens read the VLM's FINAL-layer output via JOINT concat-KV attention (probes'
# own K/V compete with the VLM K/V in one softmax; VLM read-only). Respects attend_language. The
# pooled probe hidden → SkillHead. Freezing the skill decoder (freeze_skill_head) freezes reader+head.
num_reader_tokens: 4                  # probe tokens (self-attend + read the VLM). run-name rp{n}d{depth}
reader_depth: 2                       # joint concat-KV layers (shallow = forgetting-friendly)
reader_heads: 8                       # attention heads (must divide the VLM width)
# SkillHead regression dead-zone as a FRACTION of per-dim grid spacing: margin = frac/(levels-1).
# Once |pred-target|<margin the code already rounds right → that dim's loss is zeroed (faster
# convergence, no post-correct drift). frac=1 stops as soon as correct; <1 leaves a safety band.
# 0 = plain MSE. Codebook-independent. run-name _dz{frac}.
skill_deadzone_frac: 0.8

# ── 모듈 간 attention 연결 (VLM, cond, action expert). VLM→cond→expert 체인 + VLM→expert 지름길의
#    각 엣지를 토글. 학습/추론 마스크 둘 다에 적용(train/infer 일치). skill-query는 항상 제외. ──
# attend_language: VLM '언어' 토큰을 attend할지 (cond·expert 공통 마스터 스위치). false=이미지만(visual
#   grounding 강제) / true=언어도(ablation). run-name _lang.
attend_language: false
vlm_cond: true
cond_expert: true
vlm_expert: true

# CFG식 VLM dropout (학습 전용): 이 확률로 배치당 cond→VLM/action→VLM 어텐션을 끊어 action expert가
# cond(현재obs)+GT skill z 만으로(=Stage-1 형태) 학습 → VLM에 collapse 안 하도록. VLM self-attn은 유지돼
# skill head는 매 배치 지도됨(staleness 없음). 마스크만(RoPE/위치 불변, 순수 ablation). 0=off, p=0이면
# 코인 안 던져서 dropout 없을 때와 완전 동치. run-name에 _vdrop{p}.
vlm_dropout_p: 0.5

# Per-regime freeze (vlm_dropout_p>0에서만 적용; p=0이면 아래 정적 freeze_* 사용). A=VLM_VSA(VLM 있음),
# B=VSA(VLM 드롭=Stage-1형태). true=그 regime 배치에서 해당 그룹 freeze(업데이트 안 함). 그룹:
# expert=action expert(+action/time proj), cond=cond-encoder, vlm=VLM LLM. 둘 다 학습되는 모듈만 옵티마이저에
# 넣고 배치마다 requires_grad 토글. vision 백본/skill_head는 정적 flag 유지. run-name에 _frzA{ecv}B{ecv}.
freeze_vlm_vsa: {expert: true,  cond: false, vlm: false}   # A: expert 고정(Stage-1 base) + cond/VLM 학습
freeze_vsa:     {expert: false, cond: false, vlm: false}   # B: 전부 학습(=Stage-1 형태로 expert 재학습)

# ── FSQ terminator co-training (same as FT; disjoint from the SkillVLA params) ──
# Adapt the FSQ terminator on this dataset's GT signals (z←true skill, current DINO + state →
# progress + soft termination) alongside Stage-2. Warm-starts from the run's FSQ.pt and is exported
# per-checkpoint (checkpoints/<step>/FSQ_ft.pt) for stage2_eval. Needs the dataset's dino.npz.
train_terminator: true
terminator_lr_scale: 1.0
terminator_end_target_sigma: 1.0     # soft termination target std in FRAMES (exp(-de²/2σ²))
terminator_end_pos_weight: 1.0

# ── Run naming ────────────────────────────────────────────────
exp: ""                                        # optional run-name suffix (blank = none)

# ── Freeze toggles (all parts otherwise trained) ──────────────
freeze_cond_encoder: false                    # reuse the Stage-1 current-obs cond-encoding (frozen)
freeze_expert_vision: false

freeze_vlm: false
freeze_vlm_vision: false                     # train the SigLIP tower for the new skill-start view

freeze_action_expert: true


# ── Optimization ──────────────────────────────────────────────
batch_size: 16
num_workers: 4
num_gpus: 1
lr_base: 2.5e-05                             # effective base lr = lr_base * num_gpus (VLM + vision use this)
expert_lr_scale: 1.0                         # action expert(gemma_expert + action/time proj) LR 배수
cond_lr_scale: 1.0                           # cond side(cond_encoder + image/state proj) LR 배수
steps: 100000
save_freq: 5000


# ── wandb ─────────────────────────────────────────────────────
wandb_enable: true
wandb_project: VLA_stage2

# ── Slurm (partition/qos/nodelist/exclude_nodes come from configs/global_config.yaml) ──
train_gres: gpu:1
train_cpus_per_task: 16
train_mem: 128G
train_time: "48:00:00"
