# SkillVLA Stage-2 training (policy.type=skill_vla).
#
# A PaliGemma VLM (warm-started from pi05_base) predicts the skill from the skill-START obs; an
# action expert warm-started from a Stage-1 skill_expert checkpoint flow-matches the action chunk.
# expert_arch (A=joint / B=fused), vision_backbone, action_expert_variant and skill_vocab_size are
# read from the Stage-1 checkpoint by the model — set only the Stage-1 run name below.
#
# Roots come from ../build_data/train_skillVLA_config.yaml; skill_fsq_levels defaults to the FSQ the
# dataset was built with. Output:
#   {project_root}/skillVLA_outputs/S2_{source_dataset}_{run_tag}_batch{N}_stage2_{A|B}[_{exp}]/

# ── Which skillvla dataset to train on ────────────────────────
# Resolves to {project_root}/{dataset_root}/{skillvla_dataset_root}/{source_dataset}/{run_tag}/
#   (→ skillvla/ + FSQ.pt, built by configs/train_skillVLA/build_data).
source_dataset: libero_90
run_tag: FSQ555_pg8_image256_eqloss_1000

# ── Warm-start ────────────────────────────────────────────────
pi_base: lerobot/pi05_base                  # VLM (PaliGemma) init
# Stage-1 skill_expert run folder under {project_root}/{skillvla_outputs_root}/ whose
# checkpoints/{stage1_checkpoint}/pretrained_model warm-starts the action expert + cond side. Its
# config supplies expert_arch (A/B) / vision_backbone / skill_vocab — no need to repeat them here.
stage1_run_name: S1_libero_90_FSQ555_pg8_image256_eqloss_1000_batch32_stage1_init_joint_unfreeze_siglip
stage1_checkpoint: "020000"     # "last" (newest at launch time) or a step number, e.g. "020000", to pin it
skillvla_outputs_root: skillVLA_outputs

# ── Skill head / FSQ ──────────────────────────────────────────
# skill_fsq_levels defaults to build_data's fsq_levels; override only to mismatch deliberately.
# skill_fsq_levels: [5,5,5]
skill_loss_weight: 0.1 # 0.5                       # total = BC + λ·skill_CE (λ<1 keeps BC dominant)

# ── Freeze toggles (all parts otherwise trained) ──────────────
freeze_cond_encoder: true                    # [A only] reuse the Stage-1 current-obs encoding
freeze_expert_vision: true
freeze_vlm: false
freeze_vlm_vision: false                     # train the SigLIP tower for the new skill-start view
freeze_action_expert: false


# ── Optimization ──────────────────────────────────────────────
batch_size: 8
num_workers: 4
num_gpus: 1
lr_base: 2.5e-05                             # effective lr = lr_base * num_gpus
steps: 100000
save_freq: 2500

# ── Run naming ────────────────────────────────────────────────
exp: "loss01"                                      # optional suffix → ..._stage2_{A|B}_{exp}

# ── wandb ─────────────────────────────────────────────────────
wandb_enable: true
wandb_project: VLA_stage2

# ── Slurm ─────────────────────────────────────────────────────
train_partition:
  - debug
train_qos: base_qos
train_gres: gpu:1
train_cpus_per_task: 16
train_mem: 128G
train_time: "48:00:00"
train_nodelist: ""
train_exclude_nodes: []
