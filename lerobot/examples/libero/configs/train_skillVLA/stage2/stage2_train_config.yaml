# project_root, dataset_root, outputs_root and cluster defaults come from global_config.yaml.

# Stage-2 data is prepared separately. It must use the same FSQ skill space and
# state/action geometry as the selected Stage-1 checkpoint.
dataset:
  skillvla_root: skillvla_dataset
  source: libero_90_full_lasthalf_scene # libero_90_full_full | libero_90_full_firsthalf_scene
  # run is inherited from the Stage-1 checkpoint's train_config.json.

# Stage 2 assembles the Stage-1 prior with the frozen base VLM from
# models/pi05_base. Architecture is never parsed from run names.
#   stage1_run : cond_gemma (arch0-family) VSA prior. Needs no predictor or
#                terminator of its own.
#   predictor  : optional; needed only when training_skill_source=predictor.
#                Its learned reader/head/LoRA are overlaid on the base VLM.
# Terminators stay out of Stage 2; attach one at evaluation time.
warm_start:
  # stage1_run: bs32_libero_90_full_firsthalf_scene_FSQ333_termRES_js_2000_pt_pmax15_arch0_skillendmask_visunfreeze
  # stage1_run: bs32_libero_90_full_firsthalf_scene_FSQ333_termRES_contrastive_2000_pt_pmax15_arch0_skillendmask_visunfreeze
  # stage1_run: bs32_libero_90_full_firsthalf_scene_FSQ333_termRES_contrastive_2000_pt_arch0_skillendmask_visunfreeze
  stage1_run: bs32_libero_90_full_firsthalf_scene_FSQ3333_termRES_contrastive_1750_pt_arch0_skillendmask_visunfreeze
  checkpoint: "200000"
  # Uncomment only for likelihood.training_skill_source: predictor. Resolved as
  # outputs_root/skillVLA_terminator/<model_dir>/checkpoints/<checkpoint>/pretrained_model.
  # predictor:
  #   model_dir: bs16_libero_90_full_firsthalf_scene_FSQ333_pos_pos_LR6_raw_withEntH_1000_std_pt_episodemean_100p_snap10_pmax15_halfnormal
  #   checkpoint: "050000"

# likelihood preserves the corrected legacy Stage-2 objective. dsbc freezes the
# complete Stage-1 VSA and learns only an FRS-supervised initial-noise selector.
stage2_mode: likelihood  # likelihood | dsbc

likelihood:
  layers: 4
  # gt needs only the canonical base VLM. predictor conditions training on a
  # frozen predictor's skill-start predictions and requires warm_start.predictor.
  training_skill_source: gt
  # last: cross-attend the VLM's final hidden (original design).
  # layer_mix: each block learns a softmax mixture over all 18 VLM layers,
  # initialized near the final layer. layer_mix is the default name contract;
  # selecting last adds _vlmlast.
  vlm_memory: layer_mix
  # LR multiplier for the language-pathway bootstrap parameters (gate dense,
  # VLM projection, layer mix) to escape the zero-gate cold start. Diagnosis of
  # the first four runs showed the projection stuck at its random init.
  gate_lr_scale: 10

dsbc:
  # shared predicts one 7D noise vector and repeats it over the action chunk;
  # per_step predicts a separate 7D vector for every action token.
  noise_output_mode: per_step  # shared | per_step
  # Paper setting: squash normalized predicted noise to (-5, 5).
  noise_output_bound: 5.0
  # Online action(t=0) -> noise(t=1) Euler integration through frozen Stage 1.
  frs_num_steps: 10
  # Seed for the fixed Gaussian selector anchor (not the predicted VSA noise).
  anchor_seed: 0

# Stage 2 always supervises the complete action chunk, including actions after
# the skill end. mask_actions_after_skill_end is fixed to false in code.

# Optional relative-trajectory auxiliary, identical to Stage 1. The fixed flow
# loss keeps weight 1.0; this adds weight * prefix cumulative clean-action XYZ
# MSE after one per-sample horizon normalization ((valid_steps + 1) / 2).
cumulative_xyz_loss:
  enabled: false
  weight: 0.5

# Auto name: {stage1_run}_{checkpoint}[_dsbc][_shared]
#            [_cumxyz{weight}][_vlmlast][_{suffix}]
run: {suffix: "lasthalf"}

training:
  dataloader:
    # batch_size: 256 # 32
    # workers: 24 # 8
    batch_size: 32 
    workers: 8 
    gpus: 1
    # Half the batch becomes post-jitter-same-skill/different-task pairs.
    same_skill_different_task: {enabled: false, grouped_fraction: 0.5, progress_temperature: 0.1}
  optimizer: {base_lr: 2.5e-05}
  gradient_checkpointing: false
  # lr_mode warmup_constant matches Stage 1: warm up then hold base_lr flat
  # (no cosine decay; lr_decay_steps is only used by cosine_decay).
  schedule: {steps: 500000, log_every: 100, save_every: 10000, lr_mode: warmup_constant, warmup_steps: 1000}

logging:
  wandb: {enable: true, project: VLA_stage2}

slurm: {gres: "gpu:1", cpus: 12, memory: 256G, time: "48:00:00"}
# slurm: {gres: "gpu:1", cpus: 32, memory: 256G, time: "48:00:00"}
