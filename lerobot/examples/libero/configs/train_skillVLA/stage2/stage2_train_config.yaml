# Dataset source and FSQ settings are inferred from the Stage-1 run.
dataset: {skillvla_root: skillvla_dataset}

warm_start:
  pi_base: models/pi05_base
  tokenizer: models/paligemma-3b-pt-224-tokenizer
  stage1_run: FSQ333_dino_frozen_small_optimal_vsa_state_skill_125_pt_snap10_dino_batch128_state_skill_lorae8_ltq-k-v-o-mlp-actionout_weighted
  checkpoint: "020000"

skill:
  loss_weight: 0.1
  deadzone: 0.8
  reader: {tokens: 4, depth: 2, heads: 8, all_layers: true}

loss: {weighted: true, skill_start_weight: 3.0}

vlm_token_access:
  cond:         {image: false, language: true}
  skill_reader: {image: true,  language: true}

connections: {vlm_to_cond: true, cond_to_expert: true, vlm_to_expert: false}

lora:
  train: {vlm: true, cond: true}
  targets: [q, k, v, o]
  rank: 8
  alpha: auto
  dropout: 0.0
  lr_scale: 10.0

regime:
  vlm_severed: {probability: 0, anchor_weight: 1.0}

freeze:
  vlm: true
  cond: true
  expert: true
  vlm_lora: false
  cond_lora: false
  expert_lora: true
  vlm_vision: true
  cond_vision: true

# This is a separate FSQ module; set train=false for strictly LoRA-only training.
terminator: {train: true, lr_scale: 1.0, target_sigma: 1.0, end_weight: 1.0}

run: {suffix: ""}

training:
  dataloader: {batch_size: 128, workers: 2, gpus: 1}
  optimizer: {base_lr: 2.5e-05}
  schedule: {steps: 50000, save_every: 2500}

logging:
  param_drift: true
  wandb: {enable: true, project: VLA_stage2}

slurm: {gres: "gpu:1", cpus: 16, memory: 256G, time: "48:00:00"}
