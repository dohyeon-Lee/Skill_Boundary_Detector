# SkillVLA training-data build. Project, dataset/output roots, and cluster
# placement come from configs/global_config.yaml.

# Source
skillvla_dataset_root: skillvla_dataset
source_dataset: libero_90_full_full # libero_90_full_full # libero_90_full_firsthalf_scene | langgap_56_full_firsthalf | libero_90_full_lasthalf_scene | libero_10_full_1
skillvla_data_mode: pt  # pt | ft | ft_own | ft_epi

# Skill segmentation
# Detector and action conventions come from the FSQ training skillset.

skillset_tasks_per_job: 5
skillset_array_throttle: 0        # 0 = unlimited
skillset_max_sweeps: 2

# FSQ encoder

# Previous FSQ used by `VSA skill transition randomization — 100k`.
# Keep this active first so the new jitter policy is compared in the same code space.
# fsq_run_name: FSQ333_contrastiveON_routeON_loss_new

# Terminator-joint FSQ variants for the follow-up comparison.
fsq_run_name: FSQ333_recon_term22__contrastiveON_routeON_loss_new_rand15pct
# fsq_run_name: FSQ333_recon_term22__contrastiveON_routeON_loss_new_rand15pct_endstrat


fsq_checkpoint: 2000                # epoch | best
fsq_snap_to_supported: true
fsq_snap_min_code_freq: 10

# SkillVLA dataset
skillvla_output_suffix: "fov_rand20_grip"  # keep the previous fov_rand dataset intact
# Exclude complete episodes containing a rotation action with |action[3:6]| > 0.5.
# This is intended for the four rare LangGap-ext obstacle-fallback episodes.
# The generated folder gains `_except_outlier`, and every SkillVLA loader reads
# the saved exclusion contract automatically.
exclude_rotation_outlier_episodes: false
# none: preserve the source dataset's world-frame EEF xyz.
# episode_start_xyz: subtract each episode's first EEF xyz before computing
# state statistics. The generated folder gains `_grounded` automatically.
proprio_grounding: episode_start_xyz  # none | episode_start_xyz

# Per-skill visual focus target for the foveated top-view Stage-1 input.
# The build projects the skill-end EEF into the recorded agentview camera and
# stores both normalized [-1, 1] UV and pixel coordinates in skill_focus_uv.npz.
# suite / exact-map / original HDF5 paths are inferred from source_dataset when
# left blank. The selected UV later follows the same jittered skill k' as the
# skill code; temporal offset does not move this canonical spatial target.
focus_uv:
  enabled: true
  camera: agentview
  suite: ""                    # blank -> infer libero_10 / libero_90 / ...
  eval_init_states_path: ""    # blank -> <source parent>/eval_init_states.npz
  original_dataset_dir: ""     # blank -> libero_original_dataset/<suite>

max_order: 0                      # 0 = auto
max_length: 500
# Dataset/ISS maximum contract. Runtime training may choose any percentage up
# to this value, and may choose half_normal or uniform without rebuilding.
# The four boundary directions all share this one maximum.
# transition_jitter_max_percent: 35
# transition_jitter_precompute_gripper_validity: true

transition_jitter_pmax: 20
transition_jitter_precompute_gripper_validity: true
transition_jitter_distribution: half_normal  # build-time default only

# Legacy fixed-step build alternative (choose ONE contract):
# 1) comment out `transition_jitter_max_percent` above
# 2) uncomment the single shared pmax below
# transition_jitter_pmax: 20
# 3) change skillvla_output_suffix to e.g. `fov_rand_pmax20_grip`
# Gripper-valid offsets and the runtime distribution remain independently usable.
skill_decoder_state_indices: "[0,1,2,3,4,5,6,7]"
cleanup_intermediate: false

# Slurm resources
skillvla_gres: gpu:1
skillvla_cpus_per_task: 8
skillvla_mem: 64G
skillvla_time: "2:00:00"
