# SkillVLA training-data build. Project, dataset/output roots, and cluster
# placement come from configs/global_config.yaml.

# Source
skillvla_dataset_root: skillvla_dataset
source_dataset: libero_90_full_full # libero_90_full_full # libero_90_full_firsthalf_scene | langgap_56_full_firsthalf | libero_90_full_lasthalf_scene | libero_10_full_1
skillvla_data_mode: pt  # pt | ft | ft_own

# Skill segmentation
# Detector and action conventions come from the FSQ training skillset.

skillset_tasks_per_job: 5
skillset_array_throttle: 0        # 0 = unlimited
skillset_max_sweeps: 2

# FSQ encoder

# fsq_run_name: norm_action01_recon_termRES__jsON_routeON_loss__vis_unfreeze_term01
# fsq_run_name: norm_action01_recon_only__contrastiveON_routeON_loss
# fsq_run_name: FSQ3333_norm_action01_recon_termRES__contrastiveON_routeON_loss
# fsq_run_name: FSQ3333_norm_action01_recon_only__jsON_routeON_loss
# fsq_run_name: FSQ22222_norm_action01_recon_termRES__contrastiveON_routeON_loss
fsq_run_name: FSQ333_norm_action01_recon_only__contrastiveON_routeON_loss

fsq_checkpoint: 2000                # epoch | best
fsq_snap_to_supported: true
fsq_snap_min_code_freq: 10

# SkillVLA dataset
skillvla_output_suffix: ""         # optional custom suffix appended to the run folder
# Exclude complete episodes containing a rotation action with |action[3:6]| > 0.5.
# This is intended for the four rare LangGap-ext obstacle-fallback episodes.
# The generated folder gains `_except_outlier`, and every SkillVLA loader reads
# the saved exclusion contract automatically.
exclude_rotation_outlier_episodes: true
# none: preserve the source dataset's world-frame EEF xyz.
# episode_start_xyz: subtract each episode's first EEF xyz before computing
# state statistics. The generated folder gains `_grounded` automatically.
proprio_grounding: episode_start_xyz  # none | episode_start_xyz
max_order: 0                      # 0 = auto
max_length: 500
transition_jitter_early_start_pmax: 10  # predictor start before the GT boundary
transition_jitter_late_start_pmax: 5    # predictor start after the GT boundary
transition_jitter_early_end_pmax: 10    # switch to the next skill before the GT end
transition_jitter_late_end_pmax: 5      # keep the previous skill after its GT end

# transition_jitter_early_start_pmax: 15  # predictor start before the GT boundary
# transition_jitter_late_start_pmax: 15    # predictor start after the GT boundary
# transition_jitter_early_end_pmax: 15    # switch to the next skill before the GT end
# transition_jitter_late_end_pmax: 15      # keep the previous skill after its GT end


transition_jitter_distribution: half_normal  # half_normal | uniform
skill_decoder_state_indices: "[0,1,2,3,4,5,6,7]"
cleanup_intermediate: false

# Used only by ./submit_relabel.sh. source_run directly selects an already-built
# SkillVLA folder, so this command does not depend on fsq_run_name/fsq_meta.json.
# The predictor must emit codes in the same FSQ space as that source dataset.
# "last" selects the greatest numeric checkpoint in the run. The resolved step
# is appended to the output, e.g. 085000 produces `<source>_relabeled_85k`.
# Example for the existing LIBERO-90 grounded dataset:
skill_relabel: {source_run: "FSQ333_contrastive_2000_pt_grounded", predictor_model: "bs32_FSQ333_contrastive_2000_pt_grounded_libero_90_full_full_predictor", checkpoint: "085000"}
# skill_relabel: {source_run: "", predictor_model: "", checkpoint: "last"}

# Slurm resources
skillvla_gres: gpu:1
skillvla_cpus_per_task: 8
skillvla_mem: 64G
skillvla_time: "2:00:00"
