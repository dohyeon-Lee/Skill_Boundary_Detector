# SkillVLA training-data build. Project, dataset/output roots, and cluster
# placement come from configs/global_config.yaml.

# Source
skillvla_dataset_root: skillvla_dataset
source_dataset: libero_10_full_5 # libero_90_full_firsthalf_scene | langgap_56_full_firsthalf | libero_90_full_lasthalf_scene | libero_10_full_1
skillvla_data_mode: pt  # pt | ft | ft_own

# Skill segmentation
# Detector and action conventions come from the FSQ training skillset.

skillset_tasks_per_job: 5
skillset_array_throttle: 0        # 0 = unlimited
skillset_max_sweeps: 2

# FSQ encoder
# fsq_run_name: langgap_56_full_full_state_obs20_std_episodemean_80p_fsq345_fast
# fsq_run_name: langgap_56_full_full_state_obs20_std_episodemean_80p_fsq333_fast

# fsq_run_name: libero_90_full_full_state_obs20_std_episodemean_80p_fsq345
fsq_run_name: libero_90_full_full_state_obs20_std_episodemean_100p_fsq333_pos_pos_LR6_raw_withEntH
fsq_checkpoint: 1000 # 125               # epoch | best
fsq_snap_to_supported: true
fsq_snap_min_code_freq: 10

# SkillVLA dataset
max_order: 0                      # 0 = auto
max_length: 500
pmax: 15
transition_jitter_distribution: half_normal  # half_normal | uniform
skill_decoder_state_indices: "[0,1,2,3,4,5,6,7]"
cleanup_intermediate: false

# Slurm resources
skillvla_gres: gpu:1
skillvla_cpus_per_task: 8
skillvla_mem: 64G
skillvla_time: "8:00:00"
