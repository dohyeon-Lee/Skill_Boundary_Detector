# Stage-1 teacher-forced COMPARISON across many models → outputs/summary.md.
# (project_root/dataset_root/outputs_root come from configs/global_config.yaml.)
#
# Run:   ./submit_tf_compare.sh            (sbatch; --force to recompute)
#   or:  ./run_tf_compare.sh               (in an existing GPU allocation)
# Each target's result is cached at outputs/{name}/metrics.json (skipped if present); add targets
# and rerun to extend the table. report.py renders outputs/summary.md.

# ── 비교할 모델들 ─────────────────────────────────────────────
# name → {model_dir, checkpoint}.  model_dir = stage1 run folder under {outputs_root}/skillVLA_stage1/
# (source_dataset + run_tag are parsed from it). 같은 모델의 다른 checkpoint를 비교하려면 항목을
# 여러 개로 나열 (FSQ_utilized_eval에서 epoch별 run_dir 나열한 것과 동일).
# 다른 루트에 있는 모델(예: prev-server run은 outputs/ + dataset/, 현재 global은 *_filtered/)은
# target에 dataset_root / outputs_root를 적어 오버라이드 (없으면 global_config 값 사용).
targets:
  # newdata_555_dino_freeze_c25_005k_adaLN:
  #   model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_dino_freeze_batch256_A_adaLN_c25
  #   checkpoint: "005000"
  
  newdata_555_dino_freeze_c25_005k_ae:
    model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_dino_freeze_batch256_A_ae_c25
    checkpoint: "005000"
  newdata_555_dino_freeze_c25_010k_ae:
    model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_dino_freeze_batch256_A_ae_c25
    checkpoint: "010000"
  newdata_555_dino_freeze_c25_015k_ae:
    model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_dino_freeze_batch256_A_ae_c25
    checkpoint: "015000"


# ── 공통 teacher-forced knobs ────────────────────────────────
n_frames: 512        # random frames evaluated per model
batch_size: 32
n_swap: 4            # swapped (wrong) skill codes compared per frame
seed: 1000

# ── Slurm (partition/qos/nodelist/exclude come from configs/global_config.yaml) ──
eval_gres: gpu:1
eval_cpus_per_task: 8
eval_mem: 32G
eval_time: "4:00:00"
