eval_num_gpus: 16
n_episodes: 5
eval_batch_size: 1
max_parallel_tasks: 1
n_action_steps: 5

oracle:
  # true requires every listed model to use the same episode-exact dataset map.
  episode_exact: true

terminator:
  # state_image = regular state+camera terminator; image_only = camera-only aux model.
  # image_only requires advance_mode: external and a skill_aux checkpoint above.
  variant: image_only
  end_mode: termination             # termination | progress | or | and
  end_threshold: 0.5
  progress_threshold: 0.95
  immediate_replan_on_skill_end: true
  max_skill_length: 200

video: {max_per_task: 15, frame_stride: 4, fps: 10}
skill_html: true
skill_html_train_samples: 5

logging:
  wandb: {enable: true, project: VLA_stage1_eval}

slurm: {gres: "gpu:1", cpus: 8, memory: 64G, time: "6:00:00"}
