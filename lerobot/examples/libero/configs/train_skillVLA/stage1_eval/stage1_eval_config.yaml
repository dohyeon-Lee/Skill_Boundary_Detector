# Unified Stage-1 closed-loop evaluation.
#
# Arch0--4 may be mixed freely in one models list. The evaluator reads the exact
# architecture/revision from each checkpoint and loads one model at a time.
# Historical VSA checkpoints under skillVLA_stage1/previous use `previous: true`.
# Old skillVLA_real Cond-Gemma checkpoints without an architecture field are
# recognized from their saved conditioning_route; no manual architecture field
# belongs in this YAML.
outputs_root: outputs_filtered
# outputs_root: outputs

# Used only by entries with skill_source: external or advance_mode: external.
# The target model architecture may differ: only compatible predictor/terminator
# submodules are validated and overlaid.
# external_skill_model: outputs_filtered/skillVLA_stage1/bs16_libero_90_full_firsthalf_scene_FSQ333_125_std_pt_episodemean_80p_snap10_pmax15_halfnormal_arch1_VisO_StateO_SkillO/checkpoints/030000/pretrained_model
external_skill_model: outputs_filtered/skillVLA_stage1/bs32_libero_90_full_firsthalf_scene_FSQ333_fast_500_std_pt_episodemean_80p_snap10_pmax15_halfnormal_arch4_DINO_LR_100p_Skill_Predictor/checkpoints/100000/pretrained_model
# external_skill_model: outputs/skillVLA_stage1/bs32_langgap_56_full_firsthalf_FSQ345_fast_500_std_pt_episodemean_80p_snap10_pmax15_halfnormal_arch0/checkpoints/100000/pretrained_model

# Common values inherited by every models[] entry. A value written inside an
# individual model entry takes priority over the corresponding value here.

# model_defaults:
#   previous: false
#   # A scalar keeps the old behavior. A list evaluates every model at every
#   # checkpoint, e.g. ["050000", "070000", "090000"].
#   checkpoint: "050000"
#   skill_source: external
#   advance_mode: original
# models:
#   - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_fast_500_std_pt_episodemean_80p_snap10_pmax15_halfnormal_arch0
#     label: state_cond_nonmask
#   - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_fast_500_std_pt_episodemean_80p_snap10_pmax15_halfnormal_arch0_skillendmask
#     label: state_cond
#   - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_fast_500_std_pt_episodemean_80p_snap10_pmax15_halfnormal_arch0_1_skillendmask
#     label: state_expert
#   - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_fast_500_std_pt_episodemean_80p_snap10_pmax15_halfnormal_arch0_2_skillendmask
#     label: state_both
#   - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_fast_500_std_pt_episodemean_80p_snap10_pmax15_halfnormal_arch0_3_skillendmask
#     label: state_expert_wrist
# # Empty => timestamped directory. A fixed name is useful with resume: true.
# output_name: "skillendmask_and_stateposition_ext_5k_or"

model_defaults:
  previous: false
  checkpoint: "050000" # ["030000", "050000", "070000", "085000"]
  skill_source: external
  advance_mode: original
models:
  - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_fast_500_std_pt_episodemean_80p_snap10_pmax15_halfnormal_arch0_2_skillendmask
    label: arch0_2
  - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_fast_500_std_pt_episodemean_80p_snap10_pmax15_halfnormal_arch0_2_skillendmask_cumxyz0p5
    label: arch0_2_cumxyz0p5
  - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_fast_500_std_pt_episodemean_80p_snap10_pmax15_halfnormal_arch0_2_sep_skillendmask
    label: arch0_2_sep
  - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_fast_500_std_pt_episodemean_80p_snap10_pmax15_halfnormal_arch0_2_sep_skillendmask_cumxyz0p5
    label: arch0_2_sep_cumxyz0p5
# Empty => timestamped directory. A fixed name is useful with resume: true.
output_name: "cum_and_sep_ext_5k_or"

