outputs_root: outputs_filtered

# A Stage-1 policy and its terminator must use the same FSQ skill space.
# With episode_exact enabled, each entry receives the GT code sequence from its
# own skill dataset while every panel replays the same shared source episode.
model_defaults:
  previous: false
  checkpoint: "150000"
  skill_source: gt                 # gt | own | external
  advance_mode: original           # gt | own | external | original
  terminator_variant: state_image  # state_image | image_only
  external_predictor_checkpoint: "last"
  external_terminator_checkpoint: "100000"



