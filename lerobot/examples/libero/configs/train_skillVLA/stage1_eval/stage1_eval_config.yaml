# Renewed Stage-1 VSA multi-model closed-loop evaluation.
# Checkpoints follow global outputs_root. Eval artifacts are kept locally under
# stage1_eval/outputs/ so evaluation never mixes with training outputs.

# Each entry is one video/metric panel. Duplicate a checkpoint with different
# skill_source values to compare oracle skills against its learned predictor.
models:
  - model_dir: libero_90_full_firsthalf_FSQ333_175_dino_tuned_flow
    checkpoint: "last"
    skill_source: predictor
    advance_mode: terminator
    label: flow-pred
  - model_dir: libero_90_full_firsthalf_FSQ333_175_dino_tuned_flow_endpoint_xyz
    checkpoint: "last"
    skill_source: predictor
    advance_mode: terminator
    label: endpoint-pred
  - model_dir: libero_90_full_firsthalf_FSQ333_175_dino_tuned_token_flow
    checkpoint: "last"
    skill_source: predictor
    advance_mode: terminator
    label: token-pred

# Used only when an entry omits the corresponding field.
checkpoint: "last"
skill_source: gt              # gt | predictor
models_per_row: 2

# Empty => timestamped folder under stage1_eval/outputs/.
output_name: "flow_vs_endpoint_exactX_vs_token"

target_task: libero_90
task_ids: [1, 2, 3, 4, 5, 6, 8, 9, 10]
eval_num_gpus: 10
n_episodes: 3
eval_batch_size: 1
max_parallel_tasks: 1
n_action_steps: 10

oracle:
  # false: normal LIBERO reset states, GT/reference sequences matched by language.
  # true: dataset episode-exact reset; run oracle_matching/run.sh first.
  episode_exact: false
  advance_mode: terminator       # per-model override allowed; gt requires skill_source=gt

terminator:
  # Every panel uses the co-trained terminator inside its own checkpoint.
  end_mode: or                   # termination | progress | or | and
  end_threshold: 0.5
  progress_threshold: 0.9
  max_skill_length: 200

video: {max_per_task: 3, frame_stride: 2, fps: 10}
skill_html: true
skill_html_train_samples: 5

logging:
  wandb: {enable: true, project: VLA_stage1_eval}

slurm: {gres: "gpu:1", cpus: 8, memory: 64G, time: "4:00:00"}
