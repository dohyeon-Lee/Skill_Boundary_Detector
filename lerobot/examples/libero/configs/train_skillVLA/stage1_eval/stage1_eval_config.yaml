
model_defaults:
  checkpoint: "060000"
  skill_source: external                 # gt | own | external
  # auto uses a trained UV head whenever own/external predictor has one;
  # otherwise it retains the exact demonstration focus used historically.
  focus_source: auto               # auto | gt | predictor
  # Arch9--Arch12 only: auto uses a compatible end-state predictor, otherwise exact GT.
  pose_source: auto                # auto | gt | predictor
  advance_mode: external           # gt | own | external | original
  terminator_variant: state_image  # state_image | image_only
  external_predictor_checkpoint: "100000" # "025000"
  external_terminator_checkpoint: "100000"
  # Random samples one z per skill. Oracle selects hindsight z from the exact
  # demonstration at its first chunk, over the full skill, or per action chunk.
  latent_source: oracle             # random | oracle
  oracle_latent_target: full_skill  # start_chunk | full_skill | per_chunk
  oracle_latent_grid_size: 5        # sampled z + a grid_size x grid_size grid
  oracle_latent_timesteps: 2        # fixed FM scoring points per candidate

