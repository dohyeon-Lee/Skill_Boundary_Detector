# STATE-influence probe — pi05 (state in prompt) vs SkillVLA-cond (1-token state), same skillvla
# dataset, same raw-state perturbations. Tests whether the cond 1-token state is diluted vs pi05's
# discretized-in-prompt state. Offline (no simulator). See src/state_probe.py.

# ── cond: SkillVLA Stage-1 skill_expert run (under {outputs_root}/skillVLA_stage1/) ──
cond_model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_dino_freeze_batch256_A_ae_c25
cond_checkpoint: "015000"

# ── pi05: plain pi05 trained on the SAME data (under {outputs_root}/pi05_PT/); blank → cond-only ──
pi05_model_dir: PT_libero_90_full_full_pi05_batch16
pi05_checkpoint: "015000"
pi05_outputs_subdir: pi05_PT

# ── Probe params ──
n_frames: 512                 # random dataset frames (shared across both models)
batch_size: 32
gauss_sigmas: "0.5,1.0,2.0"   # σ sweep for state_gauss (× per-batch state std)
seed: 1000

# ── Slurm (partition/qos/nodelist/exclude come from configs/global_config.yaml train_*) ──
eval_gres: gpu:1
eval_cpus_per_task: 8
eval_mem: 48G                 # two models loaded sequentially (one freed before the next)
eval_time: "1:00:00"
