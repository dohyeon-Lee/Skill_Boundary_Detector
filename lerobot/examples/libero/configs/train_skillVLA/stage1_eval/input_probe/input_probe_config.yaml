# INPUT-influence probe — compare N models' STATE / SKILL / PROGRESS sensitivity on the SAME skillvla
# dataset, same raw-input perturbations (offline, no simulator). See src/input_probe.py. SKILL/PROGRESS
# exist only for skill models (pi05 → — in the report).

# ── Targets (compared side-by-side; run sequentially, one loaded at a time) ──
# Each: label, kind (cond → outputs_root/skillVLA_stage1 ; pi05 → outputs_root/{pi05_outputs_subdir}),
# model_dir, checkpoint. The SHARED dataset comes from the FIRST cond target's {source}/{run_tag}.
# state_cond_mode is now 2 modes: state | state_skill (run-name tag _{mode}). OLD runs use the legacy
# _s{mode} tags (_sadaln/_sae_adaln); they still load (config.json names are auto-aliased). pi05 → no skill.
targets:
  - {label: state,   kind: cond, model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_siglip_unfreeze_batch256_state_ac_c10,   checkpoint: "015000"}
  # - {label: state_cum,      kind: cond, model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_siglip_unfreeze_batch256_state_cum_all_ac_c10,      checkpoint: "015000"}

  # - {label: state_cum_ep,      kind: cond, model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_siglip_unfreeze_batch256_state_cum_ep_ac_c10,      checkpoint: "015000"}

  - {label: state_skill,   kind: cond, model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_siglip_unfreeze_batch256_state_skill_ac_c10,   checkpoint: "015000"}
  # - {label: state_skill_cum,      kind: cond, model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_siglip_unfreeze_batch256_state_skill_cum_all_ac_c10,      checkpoint: "015000"}

  # - {label: dino_state,   kind: cond, model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_dino_unfreeze_batch256_state_ac_c10,   checkpoint: "015000"}
  # - {label: dino_state_cum,      kind: cond, model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_dino_unfreeze_batch256_state_cum_all_ac_c10,      checkpoint: "015000"}
  # - {label: dino_state_cum_ep,      kind: cond, model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_dino_unfreeze_batch256_state_cum_ep_ac_c10,      checkpoint: "015000"}

  # - {label: dino_state_skill,   kind: cond, model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_dino_unfreeze_batch256_state_skill_ac_c10,   checkpoint: "015000"}
  # - {label: dino_state_skill_cum,      kind: cond, model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_dino_unfreeze_batch256_state_skill_cum_all_ac_c10,      checkpoint: "015000"}



  - {label: pi05,       kind: pi05, model_dir: PT_libero_90_full_full_pi05_batch16, checkpoint: "015000", pi05_outputs_subdir: pi05_PT}

# ── Probe params ──
n_frames: 128 #512                 # random dataset frames (shared across both models)
batch_size: 64
gauss_sigmas: "2.0"   # σ sweep for state_gauss (× per-batch state std)
seed: 1000

# ── Slurm (partition/qos/nodelist/exclude come from configs/global_config.yaml train_*) ──
eval_gres: gpu:1
eval_cpus_per_task: 8
eval_mem: 48G                 # models loaded sequentially (each freed before the next)
eval_time: "1:00:00"
