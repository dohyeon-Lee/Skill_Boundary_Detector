# Offline paired counterfactual analysis for Stage-1 inputs.
# Replace/add models here. One array worker (one GPU) is assigned per model.
model_defaults:
  checkpoint: "120000"
  skill_source: gt
  advance_mode: gt

models:
  - model_dir: bs32_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_relabeled_85k_arch0_skill_skillendmask_zbest5k1m2_rank_zfp32_visfreeze_lab
    label: arch0_skill

  - model_dir: bs32_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_relabeled_85k_arch0_skill_chunk_skillendmask_zbest5k1m2_rank_zfp32_visfreeze_lab
    label: arch0_skill_chunk

  # Add more models in the same form. They are evaluated in parallel and merged
  # into one HTML/CSV summary.
  # - model_dir: another_stage1_run
  #   checkpoint: "010000"
  #   label: another_model

output_name: input_influence
eval_num_gpus: 2

analysis:
  n_frames: 512
  batch_size: 16
  num_workers: 4
  seed: 1000
  # null uses the checkpoint's normal inference-step count.
  num_inference_steps: null
  save_per_sample: true
  perturbations:
    - state_swap
    - top_image_swap
    - wrist_image_swap
    - image_swap
    - skill_swap
    - all_inputs_swap

# Existing Stage-1 config resolver also reads this harmless offline default.
oracle: {episode_exact: true}
logging: {wandb: {enable: false}}
slurm: {gres: "gpu:1", cpus: 8, memory: 64G, time: "4:00:00"}
