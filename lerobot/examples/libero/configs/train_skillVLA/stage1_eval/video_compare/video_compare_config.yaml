# Side-by-side eval-video comparison — pick which eval runs to glue here, then run ./run.sh
# (or compare_videos.py). For every SAME task + SAME episode shared by all folders below, their
# rollout videos are stitched HORIZONTALLY into one clip, each panel labelled on top.
#
# GRID layout: if folders carry BOTH `dino:` and `siglip:` prefixes, the panels are laid out in a
# GRID instead — dino entries on ROW 1, siglip on ROW 2, stacked vertically. Columns share labels
# (so the same column label may repeat across the two rows); each row's leftmost panel shows its
# backbone. Each backbone must list the SAME number of folders (equal columns).
#
# Output: video_compare/outputs/{label1_vs_label2_...}/task{T}_ep{E}.mp4  (grid → grid__{labels}/)

# ── Backbone ── default policy vision variant for the folder substrings below: "" = any; "dino"/"siglip"
#    restricts matching to that variant (the `_dino_`/`_siglip_` POLICY tag, NOT the run-tag's `_dino8_`).
#    To see siglip AND dino TOGETHER in one compare, leave this "" and prefix individual folders with
#    `dino:` / `siglip:` (per-folder override — see the mixed example below). Both variants may be evaluated
#    at several checkpoints, so keep the ckpt (e.g. _010000 / _012500) in the substring when it's ambiguous.
backbone: ""        # "" | dino | siglip   (global default; override per-folder with dino:/siglip:)

# ── Folders to compare (2-4) ── full name OR any unique substring of one (resolved under
#    stage1_eval/outputs/), optionally prefixed `dino:`/`siglip:`. Order here = left→right panel order.
folders:
  # mix siglip + dino in ONE ROW (per-folder prefix beats `backbone`):
  #   - siglip:state_ac_c10_012500
  #   - dino:state_ac_c10_012500
  # GRID (dino row 1 / siglip row 2; same columns → labels shared):

  # - siglip:state_ac_c10_015000
  # - siglip:state_cum_all_ac_c10_015000
  # - siglip:state_cum_ep_ac_c10_015000
  # - siglip:state_skill_ac_c10_015000
  # - siglip:state_skill_cum_all_ac_c10_015000

  # - dino:state_ac_c10_015000
  # - dino:state_cum_all_ac_c10_015000
  # - dino:state_cum_ep_ac_c10_015000
  # - dino:state_skill_ac_c10_015000
  # - dino:state_skill_cum_all_ac_c10_015000
  
  - dino:state_ac_c10_015000
  - dino:state_cum_all_ac_c10_015000
  - dino:state_cum_ep_ac_c10_015000
  - dino:state_cum_ep_ac_w_c10_015000
  # - dino:state_cum_ep_ac_x_c10_015000



# ── Panel labels ── the text drawn on top of each panel. ONE per folder, SAME order as `folders`
#    above (count must match). Edit these freely. Set to [] for auto (the part of each name that differs).
# labels: [state, state_cum, state_cum_ep, state_skill, state_skill_cum]
labels: [state_ac, state_cum_all_ac, state_cum_ep_ac, state_cum_ep_ac_w]

# labels: [prev_state_pro, prev_state_skill_pro, prev_state, prev_state_skill, state, state_cum, state_skill, state_skill_cum]

# ── Filters ── blank/[] = all shared (task, episode).
tasks: []           # e.g. [0, 1, 2]   (libero_90 task ids)
episodes: []        # e.g. [0, 1]

# ── Render ──
height: 256         # panel height in px (width auto from aspect)
fps: 0              # 0 = use the source video fps
out: ""             # blank = outputs/{labels joined by _vs_}
