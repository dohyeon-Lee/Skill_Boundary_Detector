# Stage-2 fine-tuning on a new SkillVLA dataset.
#
# Unlike stage2/, this starts from a COMPLETE skill_vla_stage2 checkpoint.
# The Stage-1 prior and Stage-2 likelihood/DSBC modules are restored from that
# checkpoint, then the normal Stage-2 freeze/optimizer contract is continued on
# the new dataset with a fresh optimizer and scheduler.
# No predictor overlay is needed here: training_skill_source stays GT, and the
# Stage-2 memory encoder explicitly disables the learned predictor adapter.

dataset:
  skillvla_root: skillvla_dataset
  source: libero_10_full_5
  # Empty: inherit the FSQ run directory name from the Stage-2 checkpoint.
  # The selected dataset FSQ.pt must be byte-identical to the checkpoint FSQ.pt.
  run: ""

warm_start:
  outputs_subdir: skillVLA_stage2
  # stage2_run: bs32_libero_90_full_firsthalf_scene_FSQ333_pos_pos_LR6_raw_withEntH_1000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_arch0_skillendmask_100000_gt_batchOFF_nomask_layermix_glr10_lasthalf_fixed
  # checkpoint: "400000"
  stage2_run: bs32_libero_90_full_firsthalf_scene_FSQ333_pos_pos_LR6_raw_withEntH_1000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_arch0_skillendmask_100000_gt_batchOFF_dsbc_shared_frs10_nomask_layermix_glr10_lasthalf_bs256
  checkpoint: "040000"

run:
  # Explicit names keep the output readable and avoid filesystem name limits.
  name: libero10_lasthalf40k_likelihood_ft_bs16

training:
  dataloader: {batch_size: 16, workers: 8, gpus: 1}
  optimizer: {base_lr: 2.5e-05}
  gradient_checkpointing: false
  schedule:
    steps: 30000
    log_every: 100
    save_every: 1000
    lr_mode: warmup_constant
    warmup_steps: 1000
    lr_decay_steps: 30000

logging:
  wandb: {enable: true, project: VLA_stage2_FT}

slurm: {gres: "gpu:1", cpus: 12, memory: 192G, time: "48:00:00"}
