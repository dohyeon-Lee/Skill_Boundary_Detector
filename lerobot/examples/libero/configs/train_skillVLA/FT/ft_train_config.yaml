# SkillVLA FINETUNING (FT) — adapt a post-trained Stage-2 model to a NEW task.
#
# Warm-starts the WHOLE skill_vla policy from a Stage-2 checkpoint (pretrained_path → from_pretrained's
# is_stage2 full-load: VLM + cond + expert + skill head), then trains on the new task's skillvla
# dataset (same FSQ codebook). stage1_checkpoint_path / skill_fsq_levels / skill_loss_weight are read
# from the Stage-2 checkpoint's config.json (architecture only; no Stage-1 weights reloaded).
# Output: {project_root}/{outputs_root}/skillVLA_FT/{run_name}/

# ── Paths (project_root/dataset_root/outputs_root come from configs/global_config.yaml) ──
skillvla_dataset_root: skillvla_dataset

# ── Warm-start: the Stage-2 run + checkpoint to finetune from ──
stage2_run_name: libero_90_full_full_FSQ555_dino8_wow_imgX_500_siglip_unfreeze_015000_unfreeze_state_cum_all_ac_actvlm
stage2_checkpoint: "050000"          # "last" or a step number
# stage1_checkpoint_path:            # blank → read from the Stage-2 checkpoint config.json
# skill_fsq_levels:                  # blank → read from the Stage-2 checkpoint config.json

# ── New task: the skillvla dataset to finetune ON (built by build_data with the SAME FSQ) ──
source_dataset: libero_10_full_2_FT
run_tag: FSQ555_dino8_wow_imgX_500

# ── FT behaviour ──────────────────────────────────────────────
# cond_skill_source: gt = teacher-force GT skill (Stage-2 style); pred = condition the action prefix
# on the VLM's OWN predicted skill (STE) → matches inference, flow loss backprops into the VLM.
cond_skill_source: gt
skill_loss_weight:                   # blank → inherit the Stage-2 value (0.1)

# ── Terminator co-training (adapt the FSQ terminator to the new task; disjoint from the policy) ──
train_terminator: true
terminator_lr_scale: 1.0
terminator_end_target_sigma: 1.0     # soft termination target std in FRAMES (exp(-de²/2σ²))
terminator_end_pos_weight: 1.0

# ── VLM dropout (stage2와 동일; FT 기본은 끔) ─────────────────
# p>0이면 배치당 코인으로 cond→VLM/action→VLM 엣지 절단(B=VSA 배치) — FT에선 "VLM 없이 자기 skill만으로
# 실행"을 새 task에서도 유지시키는 용도. VLM self-attn은 유지돼 skill head는 매 배치 지도됨.
# 0(기본) = 코인 없음, freeze_vlm_vsa가 정적 적용 (기존 FT와 완전 동치).
vlm_dropout_p: 0
# 스케줄(선택): p → p_end 로 decay_steps 동안 선형 annealing 후 유지. 둘 다 비우면 고정 확률.
# 스텝 카운터는 체크포인트에 저장돼 resume해도 이어짐. run-name: "90to20p30k".
vlm_dropout_p_end:            # 비움 = 고정 확률
vlm_dropout_decay_steps:

# ── Freeze toggles (FT default: VLM-only finetune) ────────────
# Stage-2와 동일한 단일 소스: p=0이면 모든 배치가 A(VLM 있음) → freeze_vlm_vsa가 그대로 정적 적용
# (freeze_vsa 무시); p>0이면 배치마다 A/B 딕셔너리 토글. 그룹: expert=action expert(+action/time proj),
# cond=현재obs 파이프라인 통째(vision인코더+image_proj+cond-encoder), llm=VLM의 Gemma LLM 트렁크만
# (구 이름 vlm), vlm_vision=PaliGemma SigLIP tower.
# 기본: VLM(트렁크+vision) 학습(새 task에 obs→skill 재접지), 모터 쪽(cond)은 동결, skill decoder 동결.
freeze_vlm_vsa: {expert: false, cond: true, llm: false, vlm_vision: false}
freeze_vsa:     {expert: false, cond: false, llm: false, vlm_vision: false}   # p>0일 때만 의미
freeze_skill_head: true


exp: "ae_unfreeze"                              # optional EXTRA run-name suffix

# ── Optimization ──────────────────────────────────────────────
batch_size: 16
num_workers: 4
num_gpus: 1
lr_base: 2.5e-05                     # effective base lr = lr_base * num_gpus
steps: 50000
save_freq: 5000

# ── wandb ─────────────────────────────────────────────────────
wandb_enable: true
wandb_project: VLA_FT

# ── Slurm ──
# Pin to the 97GB RTX PRO 6000 nodes (node55-58). FT needs MORE memory than stage2 — cond_skill_source
# =pred runs the VLM twice + terminator co-training — so the 48GB a6000/6000ada and 24GB 4090/3090
# nodes OOM at batch 16. These partitions only allow pro6000_qos (base_qos is rejected there).
train_partition: [asus_pro6000, gigabyte_pro6000]
train_qos: pro6000_qos
train_gres: gpu:1
train_cpus_per_task: 16
train_mem: 128G
train_time: "48:00:00"
