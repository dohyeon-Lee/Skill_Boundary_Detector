# Train the Stage-2 architecture on a new SkillVLA dataset using either a
# complete Stage-2 checkpoint or a fresh Stage-2 initialized from Stage 1.
# The parent checkpoint is the architecture contract: its noise predictor and
# optional latent/skill predictor settings (reader, LoRA, loss, freeze policy,
# samples per skill) are inherited exactly. There is no duplicate FT probe.
dataset:
  source: libero_10_full_1
  # Optional. When omitted, the unique run with a byte-identical FSQ.pt is
  # selected automatically below dataset_root/skillvla_dataset/<source>/.
  # run: FSQ333_contrastive_2000_ft_grounded

# stage2: load and continue the Stage-2 checkpoint below.
# stage1: use that same checkpoint only as a configuration recipe, discard its
#         Stage-2 weights, and initialize fresh from its recorded Stage-1 prior.
initialization:
  mode: stage1  # stage2 | stage1

# Both modes use this checkpoint: as weights in stage2 mode (including the
# jointly trained skill predictor), as a recipe in stage1 mode. Its config
# records the original Stage-1 checkpoint automatically.
warm_start:
  stage2_run: bs32_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_relabeled_85k_arch0_skill_skillendmask_visfreeze_300000_dsbc_allreader_slocalx3h1s0_pro_12h
  checkpoint: "100000"

# stage2 mode: {stage2_run}_{checkpoint}_{dataset.source}_ft[_{suffix}]
# stage1 mode: same name with `_fresh` appended
run: {suffix: ""}

# In stage1 mode, model/optimizer/schedule settings come from the recorded
# Stage-2 train_config; `gpus` and SLURM resource requests remain local knobs.
training:
  dataloader: {batch_size: 8, workers: 8, gpus: 1}
  optimizer: {base_lr: 2.5e-05}
  gradient_checkpointing: false
  schedule:
    steps: 30000
    log_every: 100
    save_every: 1000
    lr_mode: warmup_constant
    warmup_steps: 1000
    lr_decay_steps: 30000

logging:
  wandb: {enable: true, project: VLA_stage2_FT}

slurm: {gres: "gpu:1", cpus: 12, memory: 192G, time: "48:00:00"}
