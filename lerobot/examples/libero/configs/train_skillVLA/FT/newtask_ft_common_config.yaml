# Shared NewTask FT inputs. VSA, Predictor, Terminator, and their Joint job
# jobs all read this file; each submission snapshots it beside its component
# YAML and global_config.yaml.
#
# The new-task dataset must be labeled by the SAME FSQ model as the source
# checkpoints (verified through fsq_source.json). Arch5--Arch13 and foveated
# checkpoints additionally need skill_focus_uv.npz: build the run with
# focus_uv.enabled=true.
run:
  # Optional suffix shared by FT VSA/Predictor/Joint; Terminator ignores it.
  common_suffix: ""

# dataset:
#   skillvla_root: skillvla_dataset
#   source: libero_10_full_1
#   run: FSQ333_contrastive_2000_ft_grounded_fov_rand
#   relabeled: ""

# transition_randomization:
#   enabled: true
#   percent: 15
#   distribution: uniform
#   preserve_gripper: true

dataset:
  skillvla_root: skillvla
  source: libero_10_full_1
  run: FSQ333_contrastive_2000_ft_grounded
  relabeled: ""

# transition_randomization:
#   enabled: true
#   percent: 15
#   distribution: half_normal
#   preserve_gripper: true

transition_randomization:
  enabled: true
  percent: 25
  distribution: half_normal  # half_normal | uniform
  preserve_gripper: true

warm_start:
  # vsa_checkpoint: {run: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_fov_new_fullskill_vis_2_lastlayer_lastvis_sdpa_vlast9_dinoS_lab, checkpoint: "100000"}
  vsa_checkpoint: {run: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_vanila_skill_uv_pi05vlm_vlast18_base, checkpoint: "100000"}
  # Scalar = one Predictor FT; list = independent simultaneous FT on ONE GPU.
  # VSA/Terminator ignore these entries. Joint still requires a single source.
  predictor_checkpoint: {run: bs16_FSQ333_contrastive_2000_pt_grounded_libero_90_full_full_predictor_uv_fullvlm_mode2_uvclip, checkpoint: "100000"}
  terminator_checkpoint:
    - {run: bs32_FSQ333_contrastive_2000_pt_grounded_libero_90_full_full_terminator_Term_Token_1_dinoS_freeze, checkpoint: "100000"}
    - {run: bs32_FSQ333_contrastive_2000_pt_grounded_libero_90_full_full_terminator_Term_Token_2_dinoS_freeze, checkpoint: "100000"}
    - {run: bs32_FSQ333_contrastive_2000_pt_grounded_libero_90_full_full_terminator_Term_Token_3_dinoS_freeze, checkpoint: "100000"}
    - {run: bs32_FSQ333_contrastive_2000_pt_grounded_libero_90_full_full_terminator_Term_Token_4_dinoS_freeze, checkpoint: "100000"}


fsq: {verify_source: true}
