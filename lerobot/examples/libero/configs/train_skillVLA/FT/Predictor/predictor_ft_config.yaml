newtask_ft_common: true
newtask_ft: true
stage1_component: Predictor
mode: ft
# New output folder: do not auto-resume the old FT run with target-dataset stats.
run: {suffix: "lab_ptstats"}

# The predictor contract (reader, spatial target, sampling mode) and batch size
# are inherited from warm_start.predictor_checkpoint in
# ../newtask_ft_common_config.yaml. Predictor training always uses the original
# (non-relabeled) skill labels of the new-task dataset.
# New FT inherits the warm-start checkpoint's normalization statistics, including
# the proprio-to-state-token quantiles. They stay fixed throughout training/eval.
# A resume keeps its own saved statistics, including for older FT checkpoints.
# How the inherited VLM adapts to the new task. Leave the block out to keep whatever the
# warm-start checkpoint did (the previous behaviour). Everything ELSE about the predictor --
# reader shape, spatial target, sampling mode -- stays inherited, because changing it would
# leave the warm-started weights meaningless.
#   (omitted)                 -> the checkpoint's own choice
#   unfreeze: none            -> reader + skill/xyz heads only; VLM base stays frozen
#   unfreeze: all             -> co-train the whole VLM (requires lora.enabled: false)
#   unfreeze: vision_encoder  -> train SigLIP + image-language projector; language base frozen
# LoRA can accompany none or vision_encoder: language-model base weights remain frozen.
# Adding LoRA to a checkpoint that has none is fine: the adapter is zero-initialized on its B
# side, so it starts as the identity, and the pretrained projections are routed into it.
# Run names distinguish _fullvlm / _frozenvlm / _visionencoder (and optional _lora).
predictor_ft:
  unfreeze: "none"  # all | none | vision_encoder
  lora: {enabled: false, rank: 8, alpha: 16.0, targets: "q,k,v,o", dropout: 0.0}

training:
  dataloader: {workers: 6, gpus: 1}
  optimizer: {base_lr: 2.5e-05, predictor_lr_scale: 1.0, predictor_lora_lr_scale: 10.0, predictor_vlm_lr_scale: 1.0, grad_clip_norm: 1.0}
  gradient_checkpointing: false
  # rllab -> Yonsei login4 /scratch2, preserving the output-relative path.
  # Archive full optimizer/RNG state; NEVER prune failed/unverified transfers.
  # Disable both with checkpoint_archive: "" and keep_checkpoints: -1.
  # checkpoint_archive: scratch2
  # keep_checkpoints: 1
  checkpoint_archive: ""
  keep_checkpoints: -1
  # save_steps replaces save_every. Step 0 is the unmodified warm-start predictor.
  schedule: {steps: 50000, lr_mode: warmup_constant, warmup_steps: 500, lr_decay_steps: 100000, log_every: 100, save_every: 10000, save_steps: [0, 500, 1000, 2000, 5000, 10000, 20000, 30000, 40000, 50000]}
logging:
  wandb: {enable: true, project: VLA_NewTask_FT}
slurm: {gres: "gpu:1", cpus: 8, memory: 96G, time: "48:00:00"}
