newtask_ft_common: true
newtask_ft: true
stage1_component: VSA

run: {suffix: "own_fullloss"}

# The architecture, token counts, bridge depth, foveation, auxiliary heads and
# their loss weights are all inherited from warm_start.vsa_checkpoint.
# Shared-route Arch0--Arch3 checkpoints are incompatible; new core-exit
# architecture names do not require a second allow-list here.
#
# Default FT split: DINO, the Expert motion core, action I/O, time/skill
# projections and DSBC are frozen/disabled. Cond-Gemma, the bottleneck, visual
# bridge, terminal Expert layer(s), and auxiliary heads train.
adaptation:
  train_dino: true
  dino_lr_scale: 1.0
  # true: freeze ALL Expert transformer layers, including the terminal layer(s).
  # Other FT modules keep their normal trainability; adds _frozenexpert to the run.
  # Compatible with skill_flow_loss: true: Expert/head remain frozen while
  # skill supervision backpropagates into trainable visual inputs and bridges.
  freeze_expert: true
  # true와 freeze_expert:false를 함께 사용: 실제 vision 연결층 + action 출력 head만 학습.
  # 나머지 Expert, final norm, 입력/time/skill projection은 동결.
  train_bridge_layers_and_head: false
  # Vis: full-skill flow loss / Bspline: full-skill proprio spline loss.
  # freeze_expert=true: Expert/head 동결 유지, 앞쪽 Cond/bottleneck/bridge 학습.
  # freeze_expert=false: 기존처럼 Expert 전체 + final norm/action head도 학습.
  # ON이면 _skillflow 또는 _skillbspline suffix 추가. DINO는 계속 동결.
  # 단, freeze_expert=true인 독립 planner _wovis 모델은 자동 false 적용
  # (fullskill 경로에 학습 가능한 파라미터가 없어 loss/정답 준비 생략).
  skill_flow_loss: true
  # 시작/현재 Top·Wrist patch 및 vision XYZ/UV 보조 loss. 입력 조건은 유지.
  # false면 보조 loss 계산을 생략하고 출력명에 _novisaux 추가.
  visual_aux_loss: true

training:
  dataloader: {batch_size: 16, workers: 8, gpus: 1}
  optimizer: {base_lr: 2.5e-05}
  gradient_checkpointing: false
  # 지정한 FT 체크포인트와 최신 1개를 보존.
  checkpoint_archive: ""
  keep_checkpoints: 1
  protect_checkpoints: [3000, 5000, 10000, 20000, 30000, 40000, 50000]
  schedule: {steps: 50000, lr_mode: warmup_constant, warmup_steps: 500, log_every: 100, save_every: 10000}
  vsa_debug: {every: 2000, initial: [1, 100]}

logging:
  wandb: {enable: true, project: VLA_NewTask_FT}
slurm: {gres: "gpu:1", cpus: 16, memory: 128G, time: "48:00:00"}
