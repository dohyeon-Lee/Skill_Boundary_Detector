# Learnable PT 100k -> FT 10k, matching the frozen-Expert/trainable-DINO comparison.
newtask_ft_common: true
newtask_ft: true
stage1_component: VSA

run: {suffix: "own_fullloss"}

adaptation:
  freeze_expert: true
  train_dino: true
  dino_lr_scale: 1.0
  # The resolver automatically disables fullskill loss for frozen _wovis routes.
  skill_flow_loss: true
  visual_aux_loss: true

training:
  dataloader: {batch_size: 16, workers: 8, gpus: 1}
  optimizer: {base_lr: 2.5e-05}
  gradient_checkpointing: true
  # Keep all local checkpoints for later 5k/10k evaluation; no remote offload.
  checkpoint_archive: ""
  keep_checkpoints: -1
  schedule: {steps: 10000, lr_mode: warmup_constant, warmup_steps: 500, log_every: 100, save_every: 1000}
  vsa_debug: {every: 2000, initial: [1, 100]}

logging:
  wandb: {enable: true, project: VLA_NewTask_FT}
slurm: {gres: "gpu:1", cpus: 12, memory: 128G, time: "48:00:00"}

warm_start:
  vsa_checkpoint: {run: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_fov_new_UV_Bspline_skill_learnable_wovis_nouv_vlast9_dinoS_lab, checkpoint: "100000"}

# Per-job BASE override; leave the user's global 48gb selector unchanged.
# Avoid the 256GB-RAM nodes used by asus_a5000 and tyan_a6000.
train_qos: base_qos
train_partition:
  - suma_rtx4090
  - base_suma_rtx3090
  - dell_rtx3090
  - gigabyte_a5000
  - gigabyte_a6000
  - suma_a6000
  - asus_6000ada
