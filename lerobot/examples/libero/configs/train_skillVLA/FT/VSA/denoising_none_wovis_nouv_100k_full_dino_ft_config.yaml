# Fully unfrozen VSA FT: DINO + all Expert/plan/conditioning/Action modules train.
newtask_ft_common: true
newtask_ft: true
stage1_component: VSA

run: {suffix: "own_fullloss"}

adaptation:
  full_unfreeze: true
  train_dino: true
  dino_lr_scale: 1.0
  freeze_expert: false
  freeze_skill_core: false
  # Keep all inherited nonzero Action/fullskill/visual auxiliary losses active.
  # Wovis also learns its fullskill route here; no frozen-path auto-disable.
  skill_flow_loss: true
  visual_aux_loss: true

training:
  dataloader: {batch_size: 16, workers: 8, gpus: 1}
  optimizer: {base_lr: 2.5e-05}
  gradient_checkpointing: true
  # External rllab -> Yonsei /scratch2; includes optimizer/RNG resume state.
  # Keep the latest local save; prune older ones ONLY after remote verification.
  # checkpoint_archive: scratch2
  # keep_checkpoints: 1
  # On Yonsei itself, disable offload with BOTH settings below instead:
  checkpoint_archive: ""
  keep_checkpoints: -1
  schedule: {steps: 10000, lr_mode: warmup_constant, warmup_steps: 500, log_every: 100, save_every: 1000}
  vsa_debug: {every: 2000, initial: [1, 100]}

logging:
  wandb: {enable: true, project: VLA_NewTask_FT}
slurm: {gres: "gpu:1", cpus: 12, memory: 128G, time: "48:00:00"}

# Independent FT from this model's PT 100k checkpoint.
warm_start:
  vsa_checkpoint: {run: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_fov_new_UV_Bspline_skill_denoising_none_wovis_nouv_vlast9_dinoS_lab, checkpoint: "100000"}
