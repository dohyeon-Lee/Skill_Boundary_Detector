# FT 2k XYZ/UV comparison on the same recorded episode-first skill starts.
# No simulator: saved agentview calibration restores grounded XYZ for projection.
output_name: predictor_FT2k_XYZ_mode1_vs_UV_mode3_preskill_firstskill_pixels
resume: true
input_mode: dataset
preskill_source: predicted  # First skill only: BOS=-1 for BOTH models.
projected_pixel_metrics: true

models:
  - label: XYZ_mode1_preskill_fullvlm
    predictor_dir: bs16_FSQ333_contrastive_2000_ft_own_grounded_fov_rand_libero_90_full_full_libero_10_full_1_predictor_xyz_fullvlm_mode1_preskill_base_ptstats
    predictor_checkpoint: "002000"
  - label: UV_mode3_preskill_fullvlm
    predictor_dir: bs16_FSQ333_contrastive_2000_ft_own_grounded_fov_rand_libero_90_full_full_libero_10_full_1_predictor_uv_fullvlm_mode3_preskill_uvclip_lab
    predictor_checkpoint: "002000"

dataset:
  source: libero_10_full_full
  run: FSQ333_contrastive_2000_ft_own_grounded_fov_rand
  training_sources: [libero_10_full_1]  # Included, but reported separately from held-out demos.
  task_ids: []
  episodes_per_task: 0  # Every available episode; no resampling/repetition.
  first_skill_only: true  # Skill order 0, NOT FSQ code 0.
  seed: 1000

device: cuda
eval_num_gpus: 2
batch_size: 1
cpu_threads: 8
visualization:
  enabled: true
  max_samples: 0

slurm: {cpus: 8, memory: 64G, time: "4:00:00"}
train_qos: base_qos
train_partition:
  - suma_rtx4090
  - base_suma_rtx3090
  - dell_rtx3090
  - gigabyte_a5000
  - gigabyte_a6000
  - suma_a6000
  - asus_6000ada
train_exclude_nodes: [node05, node02, node24, node14, node17, node23, node54]
