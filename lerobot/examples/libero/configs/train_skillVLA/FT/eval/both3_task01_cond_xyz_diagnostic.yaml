# Paired, evaluation-only diagnostic. Not a random-scene benchmark.
# Two independent one-GPU Slurm array elements: Task0 and Task1 in parallel.
# STAGE1_EVAL_CONFIG="$PWD/both3_task01_cond_xyz_diagnostic.yaml" ./submit_eval.sh
models:
  - &both3
    label: both3_normal
    vsa_dir: bs32_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_fov_new_both_3_dinoS_lab_100k_libero_10_full_1_ft_bs16_own
    vsa_checkpoint: "050000"
    predictor_dir: gt
    predictor_checkpoint: ""
    terminator_dir: bs32_FSQ333_contrastive_2000_ft_own_grounded_fov_rand_libero_90_full_full_libero_10_full_1_terminator_none_both_own
    terminator_checkpoint: "010000"
    gt_dataset: {source: libero_10_full_1, run: FSQ333_contrastive_2000_ft_own_grounded_fov_rand}
  - <<: *both3
    label: both4_normal
    vsa_dir: bs32_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_fov_new_both_4_dinoS_lab_100k_libero_10_full_1_ft_bs16_own
  - <<: *both3
    label: both3_cond_xyz_plus5cm_x
    cond_goal_mode: offset
    # Cond ONLY. Projection/bias retained; Expert/Terminator keep exact GT XYZ.
    cond_goal_offset_m: [0.05, 0.0, 0.0]
output_name: both3_both4_task01_cond_xyz_diagnostic_50k
resume: true
target_task: libero_10
task_ids: [0, 1]
n_episodes: 10
eval_batch_size: 1
eval_num_gpus: 2
eval_max_workers_per_gpu: 1
max_parallel_tasks: 1
n_action_steps: 5
partial_success: true
oracle:
  episode_exact: true
  repeat_episodes: true
  broadcast_single_episode: false
terminator:
  end_mode: termination
  end_threshold: 0.3
  gt_termination_min_fraction: 0.5
  immediate_replan_on_skill_end: true
  min_skill_steps: 5
  reject_same_skill_transition: true
  max_skill_length: 200
video: {max_per_task: 10, frame_stride: 4, fps: 10, grid_columns: 3}
skill_html: true
skill_html_train_samples: 0
logging:
  wandb: {enable: true, project: VLA_NewTask_FT_eval}
slurm: {gres: "gpu:1", cpus: 8, memory: 64G, time: "6:00:00"}
