# NewTask FT closed-loop eval. Same schema and engine as PT/eval/stage1_eval_config.yaml;
# only this YAML, logs/ and outputs/ live in this folder.
#
# Each models[] entry selects three RUN NAMES. They are searched in
#   outputs_root/skillVLA_FT/{VSA,Predictor,Terminator}   (separate FT runs)
#   outputs_root/skillVLA_FT/Joint                        (Joint FT runs)
#   outputs_root/skillVLA_PT/{VSA,Predictor,Terminator}            (original PT runs)
# Set its three dirs to one Joint run to evaluate it as a system, or select
# different runs to compose separately trained components. Multiple entries
# evaluate multiple systems/checkpoint combinations together.
# Architecture, foveation, grounding and normalization are read from each checkpoint.

# ── Systems to evaluate ──────────────────────────────────────────────────────
# `predictor_dir: gt` or `terminator_dir: gt` selects GT for that role; leave
# its checkpoint as "". `terminator_dir: original` with a blank checkpoint loads
# the Terminator embedded in the FSQ checkpoint recorded by the selected VSA.
# `predictor_dir: joint` with a blank checkpoint uses the VSA checkpoint's own
# co-trained Predictor. A VSA checkpoint list then sweeps both together.
# VSA must always name a real run. `vsa_checkpoint` accepts either one quoted
# checkpoint or an ordered YAML list; a list expands into one panel per step.
# `predictor_checkpoint` also accepts a list: hold VSA fixed and sweep Predictor.
# Lists in both fields evaluate every VSA/Predictor checkpoint combination.
# Use [] rather than {} because YAML braces denote a mapping, not a list.
# Sweeps automatically save checkpoint_success_rates.png (overall SR, all models)
# and checkpoint_task_success_rates/*.png (one chart per model, one line per task).
# Add "000000" to evaluate the VSA's recorded warm-start checkpoint before FT
# (0k). Predictor/Terminator selectors and the new-task GT dataset stay the same.
# Previous experiment: both_3 FT 50k, GT predictor, external Terminator comparison.
