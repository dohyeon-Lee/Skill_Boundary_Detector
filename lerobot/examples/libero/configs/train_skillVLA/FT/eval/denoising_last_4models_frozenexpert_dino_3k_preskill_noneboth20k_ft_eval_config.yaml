# Last-layer-only vision PT models; evaluate their frozen-Expert/trainable-DINO FT snapshots.
# VSA FT 3k: ALL Expert layers frozen, DINO trainable, visual auxiliary ON.
# Use the best observed FT combination: full-VLM preskill UV Predictor FT 2k
# and the previous none_both Terminator FT 20k (not Term_Token_3_both_proprio).
# Evaluate saved 3k snapshots only; all ongoing training jobs are untouched.
model_defaults:
  focus_source: predictor
  expert_xyz_source: auto

models:
  - label: denoising_none_last
    vsa_dir: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_fov_new_UV_Bspline_skill_denoising_none_last_vlast9_dinoS_base_100k_libero_10_full_1_ft_bs16_frozenexpert_skillbspline_dino_own_fullloss
    vsa_checkpoint: "003000"
    predictor_dir: bs16_FSQ333_contrastive_2000_ft_own_grounded_fov_rand_libero_90_full_full_libero_10_full_1_predictor_uv_fullvlm_mode3_preskill_uvclip_lab
    predictor_checkpoint: "002000"
    pose_source: auto
    terminator_dir: bs32_FSQ333_contrastive_2000_ft_own_grounded_fov_rand_libero_90_full_full_libero_10_full_1_terminator_none_both_own
    terminator_checkpoint: "020000"
    gt_dataset: {source: libero_10_full_full, run: FSQ333_contrastive_2000_ft_own_grounded_fov_rand}

  - label: denoising_none_wovis_last
    vsa_dir: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_fov_new_UV_Bspline_skill_denoising_none_wovis_last_vlast9_dinoS_base_100k_libero_10_full_1_ft_bs16_frozenexpert_dino_own_fullloss
    vsa_checkpoint: "003000"
    predictor_dir: bs16_FSQ333_contrastive_2000_ft_own_grounded_fov_rand_libero_90_full_full_libero_10_full_1_predictor_uv_fullvlm_mode3_preskill_uvclip_lab
    predictor_checkpoint: "002000"
    pose_source: auto
    terminator_dir: bs32_FSQ333_contrastive_2000_ft_own_grounded_fov_rand_libero_90_full_full_libero_10_full_1_terminator_none_both_own
    terminator_checkpoint: "020000"
    gt_dataset: {source: libero_10_full_full, run: FSQ333_contrastive_2000_ft_own_grounded_fov_rand}

  - label: denoising_none_nouv_last
    vsa_dir: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_fov_new_UV_Bspline_skill_denoising_none_nouv_last_vlast9_dinoS_base_100k_libero_10_full_1_ft_bs16_frozenexpert_skillbspline_dino_own_fullloss
    vsa_checkpoint: "003000"
    predictor_dir: bs16_FSQ333_contrastive_2000_ft_own_grounded_fov_rand_libero_90_full_full_libero_10_full_1_predictor_uv_fullvlm_mode3_preskill_uvclip_lab
    predictor_checkpoint: "002000"
    pose_source: auto
    terminator_dir: bs32_FSQ333_contrastive_2000_ft_own_grounded_fov_rand_libero_90_full_full_libero_10_full_1_terminator_none_both_own
    terminator_checkpoint: "020000"
    gt_dataset: {source: libero_10_full_full, run: FSQ333_contrastive_2000_ft_own_grounded_fov_rand}

  - label: denoising_none_wovis_nouv_last
    vsa_dir: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_fov_new_UV_Bspline_skill_denoising_none_wovis_nouv_last_vlast9_dinoS_base_100k_libero_10_full_1_ft_bs16_frozenexpert_dino_own_fullloss
