newtask_ft_common: true
newtask_ft: true
stage1_component: Joint

run: {suffix: "joint"}

# Both checkpoints are selected in ../newtask_ft_common_config.yaml.
# The VSA action head and complete skill-only route stay frozen. The Predictor
# VLM also stays frozen; its readers, heads, and zero-init start-proprio
# adapters train jointly with the VSA's NewTask action-side modules.
adaptation:
  train_dino: true
  dino_lr_scale: 1.0

predictor:
  freeze_vlm: true
  vlm_lr_scale: 0.1       # used only when freeze_vlm: false

# Co-train the selected Stage-1 Terminator on the same dataset. Its Predictor
# inputs are detached and its optimizer/gradient clipping are isolated from
# the Predictor/VSA graph.
terminator:
  enabled: true
  loss_weight: 1.0
  lr_scale: 1.0

loss:
  gt_skill_weight: 1.0
  gt_xyz_weight: 1.0
  route_hard_weight: 1.0
  route_ste_weight: 0.1
  route_timesteps: 2
  action_to_predictor: false
  xyz_to_skill: false

transition_randomization: {enabled: true}

training:
  dataloader: {batch_size: 16, workers: 24, gpus: 1, prefetch_factor: 2, pin_memory: true, persistent_workers: true}
  optimizer: {base_lr: 2.5e-05, predictor_lr_scale: 1.0}
  gradient_checkpointing: false
  schedule: {steps: 100000, lr_mode: warmup_constant, warmup_steps: 500, log_every: 100, save_every: 5000}
  vsa_debug: {every: 2000, initial: [1, 100]}

logging:
  wandb: {enable: true, project: VLA_NewTask_FT}
slurm: {gres: "gpu:1", cpus: 32, memory: 160G, time: "72:00:00"}
