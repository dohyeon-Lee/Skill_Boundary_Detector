stage1_common: true
stage1_component: VSA

run: {suffix: "dinoS_base"}
warm_start:
  predictor_checkpoint: ""

vision:
  dino_model: models/dinov3-vits16
  image_size: 224
  freeze: false

  foveation:
    enabled: false                   # arch8/arch13: false for the original agent view
    mode: partial_fov
    crop_size: 128
    output_size: 224
    inner_box: {enabled: true, mode: blur, size: 32, line_width: 3}
    shape: square
    sharp_size: 48
    feather: 20
    peripheral_mode: blur              # blur | black (partial_fov only); black uses a hard sharp_size boundary
    blur_radius: 8.0
    randomization:
      enabled: false
      color:
        enabled: false
        brightness: [0.8, 1.2]
        contrast: [0.8, 1.2]
        saturation: [0.8, 1.2]
        hue: [-0.3, 0.3]
      crop:
        enabled: true
        offset_px: [-24, 24]
        inner_box_offset_px: [-4, 4]
      blur:
        enabled: false
        blur_radius: [0.0, 4.0]

architecture:
  # Available: arch0/1/2/3/4/5/6/7/8_1/8_2/9_1/9_2/10_1/10_2/11_1/11_2/12_1/12_2/13/14/15/16/17/18
  # and their _skill/_skill_chunk variants.
  # Arch8_1: Arch7 XYZ head + skill-end UV fed to Cond AdaRMS; requires foveation.enabled=false.
  # Arch8_2 adds an independent termination head on the final Cond-Gemma hidden.
  # Arch9_1: wrist-only VSA; Cond skill AdaRMS + Expert skill-end EEF AdaRMS.
  # Arch9_2 adds the Arch8_2-style final-Cond termination head to Arch9_1.
  # Arch10_1 is Arch9_1 without skill conditioning on Cond: Cond gets proprio
  # only; Expert still gets skill broadcast + skill-end EEF AdaRMS.
  # Arch10_2 adds the same final-Cond termination head to Arch10_1.
  # Arch11_1: Cond gets proprio + skill + end pose; Expert gets skill + end pose.
  # Arch11_2 adds the final-Cond termination head.
  # Arch12_1: Cond matches Arch11, but Expert gets skill only (no end pose).
  # Arch12_2 adds the final-Cond termination head.
  # Arch13 reverses Arch8_1's spatial direction: skill-end EEF XYZ enters
  # Cond AdaRMS and the final recurrent bottleneck predicts focus UV.
  # Arch14 = Arch13 + the same skill-end EEF pose in the Action Expert AdaRMS (Arch11-style),
  # so it conditions BOTH the deployed route and the skill-only route. Same data/vision rules as
  # Arch13 (agent view, foveation.enabled=false, UV aux via spatial_loss_weight);
  # end_pose_mode: xyz|pose applies to the Cond and Expert inputs alike.
  # Arch15 = Arch14 + the skill in the Cond-Gemma AdaRMS (same projection as Arch9/Arch11), so the
  # visual reader is skill-aware. Expert side and skill-only route are identical to Arch14.
  # Arch16 = Arch11_1 whose Expert goal is the SKILL DISPLACEMENT (skill-end xyz - skill-start xyz)
  # instead of the absolute skill-end xyz; Cond-Gemma still gets the absolute goal. No UV head.
  # The start xyz is the jitter-consistent skill_start_state at training and the proprio latched
  # at the skill switch at eval (never predicted). Reaches both the deployed and skill-only route.
  # Arch17 = Arch16 + current proprio in the AdaRMS of the terminal bridge Expert layer(s) only,
  # so the skill-only route (which exits before them) is unaffected.
  # Arch18 = Arch17 whose Expert gets skill-start xyz and skill-end xyz as TWO absolute inputs
  # (instead of their difference), so the bridge-layer proprio can interact with both.
  # Arch16--Arch18: wrist-only, foveation.enabled=false, end_pose_mode: xyz only, spatial_loss_weight ignored.
  # Arch19 = Arch15 whose Expert goal is the SKILL DISPLACEMENT (Arch16-style); Cond keeps Arch15's
  # proprio + absolute skill-end xyz + skill, and the UV head stays.
  # Arch20 = Arch15 without any Expert goal (Expert: skill only) = Arch13 + skill in Cond.
  # Arch19/Arch20 follow the Arch13 rules (agent view, foveation.enabled=false, UV aux via
  # spatial_loss_weight); end_pose_mode: xyz only.
  # For Arch9--Arch12 set foveation.enabled=false and
  # set end_pose_mode: xyz|pose (XYZ+axis-angle, no gripper).
  # spatial_loss_weight below is ignored by Arch9--Arch12; termination_loss is
  # accepted only by the _2 variants.
  name: arch20_skill
  end_pose_mode: xyz
  expert_variant: gemma_300m
  max_state_dim: 32
  max_action_dim: 32
  chunk_size: 10
  visual_bottleneck_tokens: 100
  visual_bridge_last_n_layers: 1
  spatial_loss_weight: 0.1         # Arch5/6/13 UV or Arch7/8_1/8_2 episode-grounded XYZ

# For arch8_2/arch9_2/arch10_2/arch11_2/arch12_2 (recommended values shown):
# termination_loss: {loss_weight: 0.1, target_sigma: 2.0, positive_weight: 2.0}

mask_actions_after_skill_end: true
cumulative_xyz_loss: {enabled: false, weight: 0.5}
skill_flow:
  weight: 1.0
  chunk_multiplier: 3
  latent_best_of_n: {enabled: false, candidates: 5, top_k: 1, timesteps: 2, ranking: main, fp32: true}
action_conditioning: {training_skill_source: gt}
execution: {action_steps: 5}
transition_randomization: {enabled: true}

training:
  dataloader: {batch_size: 32, workers: 8, gpus: 1}
  optimizer: {base_lr: 2.5e-05, dino_lr_scale: 1.0, muon: false}
  gradient_checkpointing: false
  schedule: {steps: 500000, lr_mode: warmup_constant, warmup_steps: 1000, log_every: 100, save_every: 10000}
  vsa_debug: {every: 5000, initial: [1, 100, 1000]}

logging:
  wandb: {enable: true, project: VLA_stage1}
slurm: {gres: "gpu:1", cpus: 12, memory: 128G, time: "24:00:00"}
