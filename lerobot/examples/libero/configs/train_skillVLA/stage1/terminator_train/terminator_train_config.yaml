# Standalone FSQ-terminator trainer (Stage-1 sibling). Co-trains ONLY the FSQ terminator
# (progress + termination) on the skillvla dataset's GT signals, warm-started from {run_dir}/FSQ.pt.
# Disjoint from any policy — a dedicated post-FSQ terminator (idea: cleaner than the FSQ-jointly-trained
# one). Output is an FSQ.pt-format ckpt → drop-in terminator for eval.
#
# Output: {project_root}/{outputs_root}/skillVLA_stage1/terminator/{run_name}/checkpoints/{step}/FSQ.pt
# (project_root / dataset_root / outputs_root come from configs/global_config.yaml)

# ── Which skillvla run to train on (same {run_dir} that holds FSQ.pt + dino.npz + skillvla/) ──
skillvla_dataset_root: skillvla_dataset
source_dataset: libero_90_full_full
run_tag: FSQ555_dino8_wow_imgX_500     # FSQ levels parsed from the FSQ<digits> tag

# ── Architecture: "fsq" (refine/from-scratch the FSQ terminator, lean precomputed 3rd tokens) or
#    "custom" (a NEW arch: raw images → frozen DINO → full-token transformer + AdaRMS, built from toggles).
terminator_arch: custom          # fsq | custom
#  custom-arch knobs (ignored when fsq):
use_third: false               # 3rd-person camera as input
use_wrist: true               # wrist camera as input  (≥1 image required)
use_state: false               # feed state into the AdaRMS conditioning (skill is always conditioned)
custom_dino: s                # frozen DINO size: s(vits16) | b(vitb16) | l(vitl16)
custom_pool_8x8: false         # true = 8×8 patch pool (FSQ-style); false = full patch grid (more tokens)
custom_dim: 256               # transformer width
custom_layers: 3
custom_heads: 4

# ── Init: warm-start the terminator from the run's FSQ.pt, or train it FROM SCRATCH (fsq arch only) ──
# true  = refine the FSQ terminator (starts at FSQ quality → loss barely moves; ≈ the FSQ terminator).
# false = random-init the terminator on the FROZEN codebook (a genuinely dedicated terminator) — this is
#         the real test of "dedicated > FSQ-jointly-trained". run-name gets a _scratch tag.
warm_start: false

# ── Terminator targets (mirror the FSQ terminator's training) ──
terminator_end_target_sigma: 1.0       # soft termination target std in FRAMES: exp(-de²/2σ²) (0 = hard spike at last frame)
terminator_end_pos_weight: 1.0         # BCE positive-class weight for the termination head

# ── Loss mix: total = progress_loss_weight·smooth_l1(progress) + termination_loss_weight·BCE(termination) ──
# (mirrors FSQ's progress_loss_weight / end_loss_weight). Default 1:1. Raise termination_loss_weight to
# prioritize *when the skill ends*, progress_loss_weight to prioritize *how far along* it is.
progress_loss_weight: 1.0
termination_loss_weight: 10.0

# ── Optimization ──
batch_size: 256
lr: 1.0e-4
num_workers: 2
steps: 10000
save_freq: 5000
log_freq: 50

exp: ""                                # optional extra run-name suffix

# ── wandb ──
wandb_enable: true
wandb_project: VLA_terminator

# ── Slurm (partition/qos/nodelist/exclude_nodes come from configs/global_config.yaml) ──
train_gres: gpu:1
train_cpus_per_task: 16
train_mem: 64G
train_time: "12:00:00"
