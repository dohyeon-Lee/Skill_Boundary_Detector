# Shared Stage-1 dataset and model inputs. VSA, Predictor, and Terminator
# configs may override individual fields. Each submission snapshots this file
# alongside its component config and global_config.yaml.
dataset:
  skillvla_root: skillvla_dataset
  source: libero_90_full_full
  run: FSQ333_contrastive_2000_pt_grounded_fov_rand
  relabeled: ""

transition_randomization:
  enabled: true
  early_start_pmax: 15
  late_start_pmax: 15
  early_end_pmax: 15
  late_end_pmax: 15
  distribution: uniform

