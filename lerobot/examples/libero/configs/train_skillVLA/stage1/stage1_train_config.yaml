dataset:
  skillvla_root: skillvla_dataset
  source: libero_90_full_firsthalf_scene # langgap_56_full_firsthalf | libero_90_full_firsthalf_scene
  run: FSQ333_fast_500_std_pt_episodemean_80p_snap10_pmax15_halfnormal
  # run: FSQ345_fast_500_std_pt_episodemean_80p_snap10_pmax15_halfnormal

# Optional user label. It is appended at the very end of the automatic output
# and W&B run name. Empty keeps the standard ablation naming unchanged.
run: {suffix: ""}

warm_start:
  pi_base: models/pi05_base
  tokenizer: models/paligemma-3b-pt-224-tokenizer
  # Empty = use the FSQ.pt beside this dataset run. Used only for the terminator.
  fsq: ""
  # Used only when action_conditioning.training_skill_source=predictor.
  # The new VSA still starts from pi_base; only model.skill_predictor.* is read here.
  # predictor_checkpoint: outputs_filtered/skillVLA_stage1/<predictor_run>/checkpoints/030000/pretrained_model
  predictor_checkpoint: ""
vision:
  dino_model: models/dinov3-vitl16
  image_size: 224
  # Arch0--0_3/Arch1_1/Arch1_2 may be frozen; Arch1_3--4 require false.
  freeze: false

architecture:
  # Select with this value or
  # `./submit_train.sh arch0|arch0_1|arch0_2|arch0_2_sep|arch0_3|arch1_1|arch1_2|arch1_3|arch2_1|arch2_2|arch3|arch4`.
  #
  # Reference map (idea-level references, not exact paper reproductions):
  # - Shared visual compressor:
  #   Flamingo (arXiv:2204.14198): learned Perceiver Resampler latents.
  #   Dita (arXiv:2503.19757): DINOv2 + Q-Former -> 32 tokens/image.
  #   Ours uses shared DINOv3 + separate top/wrist Perceiver Resamplers.
  # - arch0: DINO tokens enter Cond-Gemma and state uses Cond-Gemma AdaRMS;
  #   motion-level skill bypasses Cond-Gemma and is broadcast to the action
  #   expert at every layer. Historical skillVLA_real checkpoints keep their
  #   saved Cond-Gemma skill broadcast when evaluated.
  # - arch0_1: Arch0 visual/skill paths, but state leaves Cond-Gemma and joins
  #   timestep conditioning in the action Expert AdaRMS at every layer.
  # - arch0_2: the same projected state conditions both all Cond-Gemma tokens
  #   and the action Expert AdaRMS; no second state projection is introduced.
  # - arch0_2_sep: Arch0_2 with independent Cond and Expert state projections;
  #   all downstream conditioning paths, masks, and transformer weights match.
  # - arch0_3: Arch0_2, except direct Cond-Gemma state AdaRMS is masked to wrist
  #   tokens. Top/wrist self-attention can still propagate state indirectly.
  # - arch1_1: same uncompressed DINO -> Cond-Gemma visual path as Arch0, but
  #   state/skill are expert in-context tokens as in Arch2--4.
  # - arch1_2: same expert state/skill tokens and mask as Arch1_1, but compresses
  #   each camera with the same 32-token Perceiver used by Arch2--4 first.
  # - arch1_3: no Perceiver compression. The same top/wrist DINO final-layer
  #   tokens are fixed visual KV in all 18 expert self-attention layers.
  # - arch2_1: camera-specific 32-token Perceiver compression, then the same
  #   all-layer fixed-visual-KV self-attention used by Arch1_3.
  # - arch2_2: GR00T N1 (arXiv:2503.14734), alternating self-attention and
  #   visual cross-attention. Ours uses even Gemma SA / odd visual CA and adds skill.
  # - arch3: Dita in-context visual/action tokens + pi0 (arXiv:2410.24164)
  #   blockwise attention. Ours uses [visual, state, skill, noisy actions].
  # - arch4: DiT adaLN-Zero (arXiv:2212.09748) and DiT-Block Policy
  #   (arXiv:2410.10088). Ours adds pooled camera vision to timestep AdaRMS.
  #
  # Historical checkpoints with the same arch2_1/arch2_2 labels remain
  # evaluation-only under previous/ and are distinguished by revision metadata.

  # arch0 arch0_1 arch0_2 arch0_2_sep arch0_3 arch1_1 arch1_2 arch1_3 arch2_1 arch2_2 arch3 arch4
  name: arch0_2_sep

  # Shared by Arch0--4.
  expert_variant: gemma_300m
  max_state_dim: 32
  max_action_dim: 32
  chunk_size: 10

  # Read when name=arch1_2, arch2_1, arch2_2, arch3, or arch4.
  vsa:
    # DINO CLS+196 patches -> this many latents for each top/wrist camera.
    visual_latents_per_camera: 32

# flow | flow_endpoint_xyz (the latter is 0.5 flow + 0.5 accumulated-XYZ endpoint MSE)
loss: flow

# false: supervise the full real action chunk (current behavior).
# true: exclude offsets after the effective skill end from action loss. When
# transition randomization changes k -> k±1, its shifted virtual boundary is used.
mask_actions_after_skill_end: true

# Optional relative-trajectory auxiliary. The existing flow loss keeps weight
# 1.0; this adds weight * prefix cumulative clean-action XYZ MSE after one
# per-sample horizon normalization ((valid_steps + 1) / 2).
cumulative_xyz_loss:
  enabled: false
  weight: 0.5

# gt: teacher-forced jittered GT code.
# predictor: frozen checkpoint predictor(jittered skill-start input) -> hard code -> VSA.
action_conditioning:
  training_skill_source: gt

# Stage3-A predictor contract: frozen pi0.5 VLM base + Q/K/V/O skill LoRA.
skill_predictor:
  train: false
  weight: 0.5
  lr_scale: 1.0
  all_layers: true
  lora: {enabled: true, targets: "q,k,v,o", rank: 8, alpha: 16.0, dropout: 0.0, lr_scale: 10.0}
  reader: {tokens: 4, depth: 2, heads: 8, deadzone_frac: 0.8}
  token_access: {image: true, language: true}

# Separate FSQ terminator instance; never shares parameters with the VSA path.
terminator:
  train: false
  freeze_vision: true
  end_target_sigma: 2.0
  end_pos_weight: 1.0

execution: {action_steps: 5}
transition_randomization: {enabled: true}

# false: ordinary random batches used by the architecture ablations.
# true: guarantee early/late original-skill frames in each batch. Transition
# randomization is still applied independently after the sample index is chosen.
# focused_fraction is the guaranteed early+late share of a batch;
# early_fraction is the early share inside that focused portion.
batch_sampling:
  enabled: false
  focused_fraction: 0.75
  early_fraction: 0.5
  early_threshold: 0.20
  late_threshold: 0.80

training:
  dataloader: {batch_size: 32, workers: 4, gpus: 1}
  # Output names always start with the actual batch size, e.g. `bs96_...`.
  # dataloader: {batch_size: 32, workers: 8, gpus: 1}
  # DINO LR = base_lr * dino_lr_scale for every architecture.
  optimizer: {base_lr: 2.5e-05, dino_lr_scale: 0.1, terminator_lr_scale: 1.0}
  # optimizer: {base_lr: 2.5e-05, dino_lr_scale: 1.0, terminator_lr_scale: 1.0}

  gradient_checkpointing: false
  schedule: {steps: 100000, lr_mode: warmup_constant, warmup_steps: 1000, log_every: 100, save_every: 5000}
  vsa_debug: {every: 5000, initial: [1, 100, 1000]}

logging:
  wandb: {enable: true, project: VLA_stage1}

slurm: {gres: "gpu:1", cpus: 10, memory: 128G, time: "48:00:00"}
# slurm: {gres: "gpu:1", cpus: 12, memory: 128G, time: "48:00:00"}
