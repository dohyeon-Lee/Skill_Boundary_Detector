dataset:
  skillvla_root: skillvla_dataset
  source: libero_90_full_full # langgap_56_full_firsthalf | libero_90_full_firsthalf_scene
  # run: FSQ333_norm_action01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal
  # run: FSQ3333_termRES_contrastive_1750_pt
  # run: FSQ333_termRES_contrastive_2000_pt_grounded
  # Empty uses the original. `relabeled_85k` selects
  # `<run>_relabeled_85k`, generated by build_data/submit_relabel.sh.
  relabeled: ""
  run: FSQ333_contrastive_2000_pt_grounded_fov



# Optional user label. It is appended at the very end of the automatic output
# and W&B run name. Empty keeps the standard ablation naming unchanged.
run: {suffix: "dinoS_base"}

warm_start:
  pi_base: models/pi05_base
  tokenizer: models/paligemma-3b-pt-224-tokenizer
  # predictor_checkpoint: outputs_filtered/skillVLA_stage1/<predictor_run>/checkpoints/030000/pretrained_model
  predictor_checkpoint: ""
vision:
  dino_model: models/dinov3-vits16
  image_size: 224
  freeze: false
  # Requires skill_focus_uv.npz in the selected SkillVLA run. The canonical
  # focus follows the same k -> k' transition jitter as the selected skill.
  # Randomization is resampled per training item. Color/input blur use one
  # shared draw for top+wrist; crop/inner-focus jitter affect top view only.
  # Crop preset (inactive).
  
  # foveation:
  #   enabled: true
  #   mode: crop                    # crop | partial_fov
  #   crop_size: 128                # source-image pixels, then resized below
  #   output_size: 224
  #   inner_box:
  #     enabled: true
  #     mode: blur                  # blur | box
  #     size: 35                    # source-image pixels inside the outer crop
  #     line_width: 3               # box mode only
  
  #   # Shared by partial_fov and crop+inner-blur. In crop mode,
  #   # inner_box.size replaces sharp_size while shape/feather/blur_radius
  #   # remain active.
  #   shape: square                 # square | circle
  #   sharp_size: 96
  #   feather: 20
  #   blur_radius: 3.0              # top-view peripheral blur
  #   randomization:
  #     enabled: true
  #     color:
  #       enabled: false
  #       brightness: [0.8, 1.2]
  #       contrast: [0.8, 1.2]
  #       saturation: [0.8, 1.2]
  #       hue: [-0.3, 0.3]
  #     crop:
  #       enabled: true
  #       offset_px: [-25, 25]      # outer crop center
  #       inner_box_offset_px: [-4, 4]
  #     blur:
  #       enabled: false
  #       blur_radius: [0.0, 1.0]   # full top+wrist before foveation

  # Partial-FOV preset (active). This reproduces the randomized geometry and
  # augmentation ranges used by the running partial_fov_rand model.
  
  foveation:
    enabled: true
    mode: partial_fov               # crop | partial_fov
    crop_size: 128                  # unused by partial_fov
    output_size: 224                # unused by partial_fov
    inner_box:
      enabled: true                 # inner-box fields are unused by partial_fov
      mode: blur                    # blur | box
      size: 32
      line_width: 3

    shape: square                   # square | circle
    sharp_size: 48  # 96                # diameter/width of the sharp focus region
    feather: 20
    blur_radius: 8.0                # top-view peripheral blur
    randomization:
      # Set only this master switch false to reproduce the non-randomized
      # partial_fov comparison model; child values then remain inactive.
      enabled: false
      color:
        enabled: false
        brightness: [0.8, 1.2]
        contrast: [0.8, 1.2]
        saturation: [0.8, 1.2]
        hue: [-0.3, 0.3]
      crop:
        enabled: true
        offset_px: [-24, 24]        # top-view sharp-focus center
        inner_box_offset_px: [-4, 4] # unused by partial_fov
      blur:
        enabled: false
        blur_radius: [0.0, 4.0]     # full top+wrist before foveation

architecture:
  # Stage-1 architecture families:
  # - arch0: DINO tokens enter Cond-Gemma and state uses Cond-Gemma AdaRMS;
  #   skill bypasses Cond-Gemma and is broadcast to the Action Expert.
  # - arch0_skill: the exact Arch0 inference architecture, jointly trained with
  #   an image/state-free canonical full-skill flow auxiliary.
  # - arch0_skill_chunk: the exact Arch0 inference architecture, plus a
  #   training-only extended action-chunk flow auxiliary.
  # - arch1: no Cond-Gemma. Independent top/wrist queries produce an equal
  #   number of visual tokens per camera; proprio FiLM-modulates those tokens, then one
  #   shared cross-attention bridge exposes them to every Action-Expert layer.
  #   Skill remains exclusively on the Expert broadcast path, as in Arch0.
  # - arch1_skill / arch1_skill_chunk: Arch1 with the same canonical or
  #   extended-chunk training-only skill-flow auxiliaries as the Arch0 pair.
  # - arch2: the Arch1 bottleneck is exposed only to the final N Expert layers;
  #   earlier layers are a pure noise+timestep+skill motion core.
  # - arch2_skill / arch2_skill_chunk: the auxiliary route exits immediately
  #   before the first visual bridge layer, then uses the shared final norm and
  #   action head. This directly supervises the reusable pure motion core.
  # - arch3: DINO tokens enter Cond-Gemma as in Arch0. A recurrent narrow token
  #   set reads Cond layers 1..18 in sequence; only the final N Expert layers
  #   read their matching updated token set. State stays on Cond AdaRMS and
  #   skill stays on the Expert broadcast path.
  # - arch3_skill / arch3_skill_chunk: the same deployed Arch3 path plus the
  #   image/state-free canonical or extended-chunk auxiliary used by Arch0.
  # Override without editing YAML: ./submit_train.sh <mode>
  name: arch3_skill

  expert_variant: gemma_300m
  max_state_dim: 32
  max_action_dim: 32
  chunk_size: 10
  # Arch1/Arch2 split this evenly across top/wrist. Arch3 uses this many
  # recurrent tokens to read every Cond-Gemma layer. Arch0 ignores it.
  visual_bottleneck_tokens: 24
  # Arch2/Arch3 only. 1 means only Expert layer 18 reads the bottleneck;
  # 18 means Expert layer i reads the token state updated by Cond layer i.
  visual_bridge_last_n_layers: 1

# false: supervise the full real action chunk (current behavior).
# true: exclude offsets after the effective skill end from action loss. When
# transition randomization changes k -> k±1, its shifted virtual boundary is used.
mask_actions_after_skill_end: true

# Optional relative-trajectory auxiliary. The fixed flow loss keeps weight
# 1.0; this adds weight * prefix cumulative clean-action XYZ MSE after one
# per-sample horizon normalization ((valid_steps + 1) / 2).
cumulative_xyz_loss:
  enabled: false
  weight: 0.5

# Used by arch0_skill and the *_skill_chunk probes. The optional latent probe
# samples N two-dimensional square-uniform mode codes, scores each at M shared
# FM timesteps, and trains the best K on both routes. "main" ranks with the
# deployed vision+state+skill action chunk; "skill_only" restores the original
# auxiliary full-skill/extended-chunk ranking. fp32 keeps only the small mode-z
# projection/gain and their optimizer state in FP32; the Action Expert stays BF16.
# It is supported by the arch0/arch1/arch2 *_skill and *_skill_chunk modes.
skill_flow:
  weight: 1.0
  chunk_multiplier: 3
  latent_best_of_n: {enabled: false, candidates: 5, top_k: 1, timesteps: 2, ranking: main, fp32: true}

# gt: teacher-forced jittered GT code.
# predictor: frozen checkpoint predictor(jittered skill-start input) -> hard code -> VSA.
action_conditioning:
  training_skill_source: gt

execution: {action_steps: 5}
transition_randomization: {enabled: true}

training:
  # dataloader: {batch_size: 32, workers: 4, gpus: 1}
  # Output names always start with the actual batch size, e.g. `bs96_...`.
  dataloader: {batch_size: 32, workers: 8, gpus: 1}
  # DINO LR = base_lr * dino_lr_scale for every architecture.
  # muon: true routes 2D hidden matrices to Muon (AdamW keeps norms/biases/
  # embeddings/IO projections); base_lr is reused via match_rms_adamw scaling.
  # Run names gain a `_muon` tag so A/B outputs never collide.
  optimizer: {base_lr: 2.5e-05, dino_lr_scale: 1.0, muon: false}
  # optimizer: {base_lr: 2.5e-05, dino_lr_scale: 1.0}

  gradient_checkpointing: false
  schedule: {steps: 500000, lr_mode: warmup_constant, warmup_steps: 1000, log_every: 100, save_every: 10000}
  vsa_debug: {every: 5000, initial: [1, 100, 1000]}

logging:
  wandb: {enable: true, project: VLA_stage1}

# slurm: {gres: "gpu:1", cpus: 10, memory: 128G, time: "12:00:00"}
slurm: {gres: "gpu:1", cpus: 12, memory: 128G, time: "48:00:00"}
