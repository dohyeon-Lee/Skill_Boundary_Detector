dataset:
  skillvla_root: skillvla_dataset
  source: libero_90_full_full # langgap_56_full_firsthalf | libero_90_full_firsthalf_scene
  # run: FSQ333_norm_action01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal
  # run: FSQ3333_termRES_contrastive_1750_pt
  # run: FSQ333_termRES_contrastive_2000_pt_grounded
  # Empty uses the original. `relabeled_85k` selects
  # `<run>_relabeled_85k`, generated by build_data/submit_relabel.sh.
  relabeled: "relabeled_85k"
  run: FSQ333_contrastive_2000_pt_grounded



# Optional user label. It is appended at the very end of the automatic output
# and W&B run name. Empty keeps the standard ablation naming unchanged.
run: {suffix: "visunfreeze"}

warm_start:
  pi_base: models/pi05_base
  tokenizer: models/paligemma-3b-pt-224-tokenizer
  # predictor_checkpoint: outputs_filtered/skillVLA_stage1/<predictor_run>/checkpoints/030000/pretrained_model
  predictor_checkpoint: ""
vision:
  dino_model: models/dinov3-vitl16
  image_size: 224
  freeze: false

architecture:
  # Select with this value or
  # `./submit_train.sh arch0|arch0_skill|arch0_skill_chunk|arch0_1|arch0_2|arch0_2_skill_chunk|arch0_2_sep|arch0_3|arch0_adaRMS|arch0_adaRMS_zero|arch0_token|arch0_token_iso|arch0_cond|arch0_both|arch1_1|arch1_2|arch1_3|arch2_1|arch2_2|arch3|arch4`.
  #
  # Reference map (idea-level references, not exact paper reproductions):
  # - Shared visual compressor:
  #   Flamingo (arXiv:2204.14198): learned Perceiver Resampler latents.
  #   Dita (arXiv:2503.19757): DINOv2 + Q-Former -> 32 tokens/image.
  #   Ours uses shared DINOv3 + separate top/wrist Perceiver Resamplers.
  # - arch0: DINO tokens enter Cond-Gemma and state uses Cond-Gemma AdaRMS;
  #   motion-level skill bypasses Cond-Gemma and is broadcast to the action
  #   expert at every layer. Historical skillVLA_real checkpoints keep their
  #   saved Cond-Gemma skill broadcast when evaluated.
  # - arch0_skill: the exact Arch0 inference architecture, jointly trained with
  #   a second image/state-free flow path. That path uses the same jittered GT
  #   code and shared Action Expert to reconstruct the code's complete original
  #   (canonical) action trajectory; it is absent during rollout.
  # - arch0_skill_chunk: the exact Arch0 inference architecture, plus a
  #   training-only image/state/Cond-Gemma-free route. Given only the skill and
  #   flow timestep, the shared Expert predicts the current action chunk with
  #   chunk_size * skill_flow.chunk_multiplier steps.
  # - arch0_1: Arch0 visual/skill paths, but state leaves Cond-Gemma and joins
  #   timestep conditioning in the action Expert AdaRMS at every layer.
  # - arch0_2: the same projected state conditions both all Cond-Gemma tokens
  #   and the action Expert AdaRMS; no second state projection is introduced.
  # - arch0_2_skill_chunk: the exact Arch0_2 inference architecture and the
  #   same extended-chunk auxiliary, but its Expert-only auxiliary also keeps
  #   the shared current-state projection in Expert AdaRMS.
  # - arch0_2_sep: Arch0_2 with independent Cond and Expert state projections;
  #   all downstream conditioning paths, masks, and transformer weights match.
  # - arch0_3: Arch0_2, except direct Cond-Gemma state AdaRMS is masked to wrist
  #   tokens. Top/wrist self-attention can still propagate state indirectly.
  # - arch0_adaRMS: Arch0 visual/state paths, but the skill stops being an
  #   additive layerwise broadcast and is instead RMS-normalized and summed into
  #   the action Expert AdaRMS condition beside the timestep. Sharing that
  #   AdaRMS dense adds no parameters; a per-signal dense would add ~116M.
  # - arch0_adaRMS_zero: Arch0_adaRMS with a zero-init scalar gain on the skill
  #   term. The trained Arch0_adaRMS put skill into the shared AdaRMS channel at
  #   ~8x the timestep embedding's RMS, which degrades flow-time conditioning;
  #   here skill starts silent and training chooses its level.
  # - arch0_token: Arch0 visual/state paths, but the skill becomes a single
  #   in-context expert token that the action tokens attend to, instead of the
  #   layerwise broadcast. Differs from Arch1_1 in that state stays on the
  #   Cond-Gemma AdaRMS path rather than becoming a second expert token. The
  #   skill token reads the visual prefix but never the action tokens.
  # - arch0_token_iso: Arch0_token with the skill token also cut off from the
  #   visual prefix, so it stays a static per-code embedding that the action
  #   tokens attend to. Isolates skill conditioning from scene context.
  # - arch0_cond: Arch0's broadcast mechanism, retargeted to Cond-Gemma only.
  #   The expert sees skill only through the condition stream it attends to.
  # - arch0_both: the same broadcast applied to Cond-Gemma and the expert.
  # - arch1_1: same uncompressed DINO -> Cond-Gemma visual path as Arch0, but
  #   state/skill are expert in-context tokens as in Arch2--4.
  # - arch1_2: same expert state/skill tokens and mask as Arch1_1, but compresses
  #   each camera with the same 32-token Perceiver used by Arch2--4 first.
  # - arch1_3: no Perceiver compression. The same top/wrist DINO final-layer
  #   tokens are fixed visual KV in all 18 expert self-attention layers.
  # - arch2_1: camera-specific 32-token Perceiver compression, then the same
  #   all-layer fixed-visual-KV self-attention used by Arch1_3.
  # - arch2_2: GR00T N1 (arXiv:2503.14734), alternating self-attention and
  #   visual cross-attention. Ours uses even Gemma SA / odd visual CA and adds skill.
  # - arch3: Dita in-context visual/action tokens + pi0 (arXiv:2410.24164)
  #   blockwise attention. Ours uses [visual, state, skill, noisy actions].
  # - arch4: DiT adaLN-Zero (arXiv:2212.09748) and DiT-Block Policy
  #   (arXiv:2410.10088). Ours adds pooled camera vision to timestep AdaRMS.
  #
  # Historical checkpoints with the same arch2_1/arch2_2 labels remain
  # evaluation-only under previous/ and are distinguished by revision metadata.

  # arch0 arch0_skill arch0_skill_chunk arch0_1 arch0_2 arch0_2_skill_chunk arch0_2_sep arch0_3 arch0_adaRMS arch0_adaRMS_zero arch0_token arch0_token_iso arch0_cond arch0_both arch1_1 arch1_2 arch1_3 arch2_1 arch2_2 arch3 arch4
  # arch0 arch0_adaRMS arch0_adaRMS_zero arch0_token arch0_token_iso
  name: arch0_skill

  # Shared by Arch0--4.
  expert_variant: gemma_300m
  max_state_dim: 32
  max_action_dim: 32
  chunk_size: 10

  # Read when name=arch1_2, arch2_1, arch2_2, arch3, or arch4.
  vsa:
    # DINO CLS+196 patches -> this many latents for each top/wrist camera.
    visual_latents_per_camera: 32

# false: supervise the full real action chunk (current behavior).
# true: exclude offsets after the effective skill end from action loss. When
# transition randomization changes k -> k±1, its shifted virtual boundary is used.
mask_actions_after_skill_end: true

# Optional relative-trajectory auxiliary. The fixed flow loss keeps weight
# 1.0; this adds weight * prefix cumulative clean-action XYZ MSE after one
# per-sample horizon normalization ((valid_steps + 1) / 2).
cumulative_xyz_loss:
  enabled: false
  weight: 0.5

# Used by arch0_skill and the *_skill_chunk probes. The optional latent probe
# samples N two-dimensional square-uniform mode codes, scores each at M shared
# FM timesteps, and trains the best K on both routes. "main" ranks with the
# deployed vision+state+skill action chunk; "skill_only" restores the original
# auxiliary full-skill/extended-chunk ranking. fp32 keeps only the small mode-z
# projection/gain and their optimizer state in FP32; the Action Expert stays BF16.
# It is supported by arch0_skill, arch0_skill_chunk, and arch0_2_skill_chunk.
skill_flow:
  weight: 1.0
  chunk_multiplier: 3
  latent_best_of_n: {enabled: true, candidates: 5, top_k: 1, timesteps: 2, ranking: main, fp32: true}

# gt: teacher-forced jittered GT code.
# predictor: frozen checkpoint predictor(jittered skill-start input) -> hard code -> VSA.
action_conditioning:
  training_skill_source: gt

execution: {action_steps: 5}
transition_randomization: {enabled: true}

training:
  # dataloader: {batch_size: 32, workers: 4, gpus: 1}
  # Output names always start with the actual batch size, e.g. `bs96_...`.
  dataloader: {batch_size: 32, workers: 8, gpus: 1}
  # DINO LR = base_lr * dino_lr_scale for every architecture.
  # muon: true routes 2D hidden matrices to Muon (AdamW keeps norms/biases/
  # embeddings/IO projections); base_lr is reused via match_rms_adamw scaling.
  # Run names gain a `_muon` tag so A/B outputs never collide.
  optimizer: {base_lr: 2.5e-05, dino_lr_scale: 1.0, muon: false}
  # optimizer: {base_lr: 2.5e-05, dino_lr_scale: 1.0}

  gradient_checkpointing: false
  schedule: {steps: 500000, lr_mode: warmup_constant, warmup_steps: 1000, log_every: 100, save_every: 10000}
  vsa_debug: {every: 5000, initial: [1, 100, 1000]}

logging:
  wandb: {enable: true, project: VLA_stage1}

# slurm: {gres: "gpu:1", cpus: 10, memory: 128G, time: "12:00:00"}
slurm: {gres: "gpu:1", cpus: 12, memory: 128G, time: "48:00:00"}
