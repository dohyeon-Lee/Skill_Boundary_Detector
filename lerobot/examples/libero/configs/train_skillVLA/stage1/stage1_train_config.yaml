skillvla_dataset_root: skillvla_dataset 

source_dataset: libero_90_full_full
# run_tag: FSQ88_dino8_wow_1000   
run_tag: FSQ555_dino8_both_1000   

# ── Conditioning architecture ──
cond_encoder_variant:          # blank = same gemma variant as the action expert (recommended)
#   state       → AdaRMS = time + state; skill (z) is an attended PREFIX token, then the r-slot → prefix [z, r].
#   state_skill → AdaRMS = time + state + skill(z); NO skill prefix token, only the r-slot → prefix [r].
state_cond_mode: state

# ── Model init ──
pi_base: models/pi05_base   # project_root(global_config) 기준 상대경로 → 서버마다 자동. 절대경로도 허용.

# ── Vision encoder (shared across the 2 cameras) ──
# dino   = trainable DINOv3 (own weights)
# siglip = PaliGemma/SigLIP tower, warm-started from pi_base's vision_tower (robot-adapted);
#          params separate from the Stage-2 VLM. Needs init_from_pi05: true for the warm-start.
vision_backbone: dino           # dino | siglip
dino_model_path: models/dinov3-vitl16   # (dino) project_root 기준 상대경로. vitb16=86M (vits16=21M, vitl16=300M)
freeze_vision_encoder: false    # freeze the SELECTED backbone. dino → false(학습); siglip → 보통 true(pi05 prior 재사용)
# (dino_lr / siglip_lr default to optimizer_lr; siglip_image_size fixed at 224 to match pi05's vision tower —
#  add any of them here only to override.)



# ── Oracle (Stage-1 residual r) ──────────────────────────────────────────────────────
# Encodes the current skill's full state TRAJECTORY (start→end, resampled to N, appearance-invariant)
# + skill z into ONE VAE latent token r (AdaLN by z), fed to the action expert as a prefix token. r
# carries the within-skill motion detail that (skill, current obs) underdetermine. CFG-style dropout
# forces r to be the RESIDUAL beyond z. No dataset rebuild — the trajectory is fetched at runtime.

## SWEEP ##
oracle_n_tokens: 4               # r prefix tokens (= # learned null tokens in 1-1/B; VLM predicts these) — SWEEP
oracle_dropout_p: 0.5            # P(drop r → learned null) per batch (CFG A/B) — SWEEP
oracle_r_dim: 8                  # per-token VAE dim — SWEEP. TOTAL bottleneck = n_tokens × r_dim = 32
oracle_kl_weight: 1.0e-3         # β on the (free-bits) KL term — SWEEP


oracle_resample_n: 30            # resample skill state-traj to N control points — matched to FSQ n_control (=30)
oracle_spline_degree: 3          # pose-dim spline degree (gripper always degree 1) — matched to FSQ spline_degree
oracle_width: 512                # Perceiver hidden dim
oracle_depth: 3                  # Perceiver blocks
oracle_n_heads: 8
oracle_free_bits: 0.1            # nats/dim reserved (prevents posterior collapse)
r_ablation_every: 200              # diagnostic: every N steps log r_gain (loss without r − with r); 0=off

# ── Stage-1 experiment design. The EXPERIMENT is chosen by WHICH script you submit (not a yaml field):
#   ./submit_staged_1.sh → train VSA base (no Oracle) → staged/1-1
#   ./submit_staged_2.sh → freeze base + Oracle, warm-start from a 1-1 ckpt → staged/1-2_<ws>_<oracle>
#   ./submit_single.sh   → one run, Oracle from scratch (CFG A/B) → single/<oracle>
# Sweeps (oracle_n_tokens/r_dim/kl/dropout) tag the 1-2/single folder; the shared 1-1 is reused across them. ──
boundary_mode: hold              # cross-skill chunk tail: hold (stop+hold, clean skill end) | keep_demo
staged_phase2_warmstart: last    # 1-1 ckpt that inits 1-2: "last" | step number | path → folder 1-2_<tag>_<oracle>
# Applies to BOTH 1-2 and single (anchor skill_proj+null is always frozen/A-frozen; this only gates VISION):
#   1-2 (whole-phase):  true → vision frozen all phase (clean residual) | false → vision keeps adapting.
#   single (per-batch): true → vision A-frozen(r)/B-trained(null) with the anchor | false → vision always trains.
freeze_vsa_vision: false
# Terminator co-train (isolated skill-end-timing head, gradient-disjoint; orthogonal to the Oracle).
# fsq_path + dino tokens are AUTO-derived from run_tag (run_dir/FSQ.pt + run_dir/dino.npz) — leave blank.
train_terminator: true
terminator_end_target_sigma: 1.0  # termination target = Gaussian bump exp(-de²/2σ²) at skill end
terminator_end_pos_weight: 1.0    # BCE pos_weight (skill-end frames are rare positives)
terminator_lr_scale: 1.0          # LR × optimizer_lr for the terminator's own param group
# Terminator FSQ-grid DINO tokens are AUTO-derived from run_tag: {run_dir}/dino.npz (+ dino_wrist.npz for
# a "both" FSQ, attached only if it exists). To override, add skill_decoder_dino[_wrist]_tokens_path here.

# ── Action chunk horizon ──
chunk_size: 10
n_action_steps:                 # blank = chunk_size (must be <= chunk_size)

# ── Optimization ──
batch_size: 256
num_workers: 8                  # data loader workers (was 2; raised to clear GPU starvation — data_s≈updt_s)
num_gpus: 1
lr_base: 2.5e-05                # effective LR = lr_base * num_gpus
steps: 15000
save_freq: 2500

exp: ""         # optional EXTRA run-name suffix (variant tag _ae/_cond is now auto from skill_inject)

# ── wandb ──
wandb_enable: true
wandb_project: VLA_stage1

# ── Slurm (partition/qos/nodelist/exclude_nodes come from configs/global_config.yaml) ──
train_gres: gpu:1
train_cpus_per_task: 16
train_mem: 128G
train_time: "48:00:00"
