dataset:
  skillvla_root: skillvla_dataset
  source: libero_90_full_full
  run: FSQ333_dino_frozen_small_optimal_vsa_state_skill_125_pt_snap10

# Expert architecture, chunk size, state mode, and flow-time settings come from this run's FSQ.pt.
initialization: {pi05: true}

vision:
  backbone: dino
  freeze: false
  dino_model: models/dinov3-vitl16

expert:
  lora:
    enabled: true
    targets: [q, k, v, o, mlp, action_out]
    rank: 8
    alpha: auto
    dropout: 0.0
    lr_scale: 10.0

regime:
  image_free: {probability: 0, anchor_weight: 1.0}

execution: {action_steps: auto}
loss: {weighted: true, skill_start_weight: 1.0, skill_end_weight: 3.0}

terminator: {train: true, freeze_vision: false, target_sigma: 1.0, end_weight: 1.0, lr_scale: 1.0}

run: {suffix: ""}

training:
  dataloader: {batch_size: 128, workers: 8, gpus: 1}
  optimizer: {base_lr: 2.5e-05}
  schedule: {steps: 20000, log_every: 100, save_every: 5000}

logging:
  wandb: {enable: true, project: VLA_stage1}

slurm: {gres: "gpu:1", cpus: 16, memory: 128G, time: "48:00:00"}
