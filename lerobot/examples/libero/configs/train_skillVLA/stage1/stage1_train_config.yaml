# SkillVLA Stage-1 training — standalone action expert (policy.type=skill_expert).
# Trains the action expert by flow matching on the build_data skillvla dataset
# (raw images + skill code + actions). No VLM, no language, no FSQ/DINO-token artifacts.
# The expert encodes raw images with its own trainable DINOv3.

# ── Paths (project_root/dataset_root come from configs/global_config.yaml) ──
skillvla_dataset_root: skillvla_dataset  # .../{skillvla_dataset_root}/{source_dataset}/{run_tag}/

# ── Which skillvla dataset to train on (built by configs/train_skillVLA/build_data) ──
source_dataset: libero_90_full_full
# run_tag: FSQ555_dino8_both_1000   # sub-folder under {skillvla_dataset_root}/{source}/
# run_tag: FSQ88_dino8_both_1000
# run_tag: FSQ555_dino8_wow_1000
# run_tag: FSQ555_dino8_wot_1000
# run_tag: FSQ555_dino8_weighted_wow_1000
run_tag: FSQ555_dino8_weighted_both_1000

# ── Conditioning architecture (joint only) ──
#   state       → AdaRMS = time + state; skill (z_q) stays as an attended PREFIX token (image-dominant,
#                 leaves room for Stage-2 language to modulate — lighter skill influence).
#   state_skill → AdaRMS = time + state + skill(z_q); NO prefix tokens (strongest skill influence).
state_cond_mode: state

# ── Model init ──
pi_base: models/pi05_base   # project_root(global_config) 기준 상대경로 → 서버마다 자동. 절대경로도 허용.

# ── Vision encoder (shared across the 2 cameras) ──
vision_backbone: siglip           # dino | siglip (params separate from the Stage-2 VLM. Needs init_from_pi05: true for the warm-start.)
freeze_vision_encoder: false    # freeze the SELECTED backbone (dino→false: train own DINOv3; siglip→usually true: reuse pi05 prior)
dino_model_path: models/dinov3-vitl16   # (dino) project_root 기준 상대경로. ViT-B/16 86M (vits16=21M, vitl16=300M)

# ── Action chunk horizon ──
chunk_size: 10 
n_action_steps:                 # blank = chunk_size (must be <= chunk_size)

# ── Loss = action MSE (flow matching). action_weight로 per-sample 가중 여부만 선택. ──
skill_end_loss_weight: 2.0        # R — sw=1+(R-1)·progress; 스킬 END을 더 강조 (1=uniform). action_weight=true일 때만 사용
action_weight: true               # true=가중 / false=균등

# ── Terminator co-train (skill-end timing head, gradient-disjoint from 본체; eval skill 전환용) ──
# fsq_path + dino tokens는 run_tag에서 AUTO 유도 (run_dir/FSQ.pt, run_dir/dino.npz, dino_wrist.npz는 있을 때만) — 비워둠.
train_terminator: true            # false면 terminator 미학습 (DINO 토큰 데이터셋도 안 붙음)
terminator_end_target_sigma: 1.0  # termination 타깃 = exp(-de²/2σ²) (스킬 끝에서 peak)
terminator_end_pos_weight: 1.0    # BCE pos_weight (skill-end 프레임은 희소 positive)
terminator_lr_scale: 1.0          # terminator 전용 param group의 LR 배수 (× optimizer_lr)

# ── Optimization ──
batch_size: 256
num_workers: 8
num_gpus: 1
lr_base: 2.5e-05                # effective LR = lr_base * num_gpus
steps: 15000
save_freq: 2500

exp: ""         # optional EXTRA run-name suffix (variant tag _ae/_cond is now auto from skill_inject)

# ── wandb ──
wandb_enable: true
wandb_project: VLA_stage1

# ── Slurm (partition/qos/nodelist/exclude_nodes come from configs/global_config.yaml) ──
train_gres: gpu:1
train_cpus_per_task: 16
train_mem: 128G
train_time: "48:00:00"
