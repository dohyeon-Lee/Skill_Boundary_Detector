# SkillVLA Stage-1 training — standalone action expert (policy.type=skill_expert).
# Trains the action expert by flow matching on the build_data skillvla dataset
# (raw images + skill code + actions). No VLM, no language, no FSQ/DINO-token artifacts.
# The expert encodes raw images with its own trainable DINOv3.

# ── Paths (project_root/dataset_root come from configs/global_config.yaml) ──
skillvla_dataset_root: skillvla_dataset  # .../{skillvla_dataset_root}/{source_dataset}/{run_tag}/

# ── Which skillvla dataset to train on (built by configs/train_skillVLA/build_data) ──
source_dataset: libero_90_full_full
run_tag: FSQ555_dino8_wow_imgX_500   # sub-folder under {skillvla_dataset_root}/{source}/

# outputs_root comes from configs/global_config.yaml: checkpoints under {project_root}/{outputs_root}/skillVLA_stage1/.

# ── Conditioning architecture (joint only) ──
cond_encoder_variant:          # blank = same gemma variant as the action expert (recommended)
# State conditioning — what rides the ACTION expert's flow-time AdaRMS (cond-encoder is image-ONLY).
# state always goes to the AdaRMS (the cond-stream state token was starved; see stage1_eval/input_probe).
#   state       → AdaRMS = time + state; skill(+progress) stay as attended PREFIX tokens (image-dominant,
#                 leaves room for Stage-2 language to modulate — lighter skill influence).
#   state_skill → AdaRMS = time + state + skill(+progress); NO prefix tokens (strongest skill influence).
# (legacy "adaln"→state, "ae_adaln"→state_skill auto-aliased; "token"/"cond_adaln" removed.)
state_cond_mode: state_skill

# ── Model init ──
pi_base: models/pi05_base   # project_root(global_config) 기준 상대경로 → 서버마다 자동. 절대경로도 허용.

# ── Vision encoder (shared across the 2 cameras) ──
# dino   = trainable DINOv3 (own weights)
# siglip = PaliGemma/SigLIP tower, warm-started from pi_base's vision_tower (robot-adapted);
#          params separate from the Stage-2 VLM. Needs init_from_pi05: true for the warm-start.
vision_backbone: dino           # dino | siglip
# DINO backbone
dino_model_path: models/dinov3-vitl16   # project_root 기준 상대경로. ViT-B/16 86M (vits16=21M, vitl16=300M)
dino_lr: null                   # null = same LR as the rest; set a float to use a separate DINO LR
freeze_dino: false
# SigLIP backbone (used when vision_backbone: siglip)
freeze_siglip: false             # default true: reuse pi05's robot-adapted features (only image_proj trains)
siglip_lr: null                 # separate LR when unfrozen; null = same as the rest
siglip_image_size: 224          # patch 14 → 16×16 = 256 tokens at 224



# ── Action chunk horizon ──
chunk_size: 10 # 10 25 50
n_action_steps:                 # blank = chunk_size (must be <= chunk_size)

# ── Skill progress conditioning ──
# The skill token is [z_q, progress] — progress is GT (skill_ds/(ds+de)) at train time with
# ±jitter noise (robustness to the terminator's estimate used at inference). 0 = clean GT.
progress_jitter: 0.1
use_progress_token: false   # false = progress 토큰 제거(skill z_q만으로 조건화); run-name에 _np 자동 태그

# ── Loss: cumulative-position term (relative actions → endpoint = sum of deltas) ──
# Adds λ·(cumulative-position MSE) to the per-delta flow loss. cumsum the implied per-step action error
# over the chunk (ARM dims only; gripper=absolute, excluded) → penalize the K running positions so the
# whole trajectory + endpoint match, not just per-step deltas. End-weighted per step (R).
cumulative_pos_loss_weight: 0.5   # λ — 0 = OFF (loss identical to per-delta + skill/pad masking)
skill_end_loss_weight: 2.0        # R — weight=1+(R-1)·progress; skill END positions count more (1=uniform)

# ── Optimization ──
batch_size: 256
num_workers: 8
num_gpus: 1
lr_base: 2.5e-05                # effective LR = lr_base * num_gpus
steps: 15000
save_freq: 2500

exp: ""         # optional EXTRA run-name suffix (variant tag _ae/_cond is now auto from skill_inject)

# ── wandb ──
wandb_enable: true
wandb_project: VLA_stage1

# ── Slurm (partition/qos/nodelist/exclude_nodes come from configs/global_config.yaml) ──
train_gres: gpu:1
train_cpus_per_task: 16
train_mem: 128G
train_time: "48:00:00"
