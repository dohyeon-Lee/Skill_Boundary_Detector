stage1_common: true
stage1_component: Predictor
mode: pt  # pt | ft
run: {suffix: "pro"}
warm_start:
  # Used only for mode=ft; leave empty for PT.
  predictor_checkpoint: ""

skill_predictor:
  train: true
  # mode1: original jittered skill-start sampling.
  # mode2: no transition jitter; sample the actual current frame/skill,
  # with 70% near skill boundaries (start or end) and 30% in the interior.
  sampling: {mode: mode2, boundary_fraction: 0.7, boundary_window: 10}
  all_layers: true
  freeze_vlm: false
  lora: {enabled: false, targets: "q,k,v,o", rank: 8, alpha: 16.0, dropout: 0.0}
  reader: {tokens: 4, depth: 2, heads: 8, deadzone_frac: 0.8}
  token_access: {image: true, language: true}
  focus_uv: {enabled: true, loss_weight: 1.0}

training:
  dataloader: {batch_size: 16, workers: 6, gpus: 1}
  optimizer: {base_lr: 2.5e-05, predictor_lr_scale: 1.0, predictor_lora_lr_scale: 10.0, predictor_vlm_lr_scale: 1.0, grad_clip_norm: 1.0}
  gradient_checkpointing: false
  schedule: {steps: 100000, lr_mode: warmup_constant, warmup_steps: 2500, lr_decay_steps: 50000, log_every: 100, save_every: 5000}
logging:
  wandb: {enable: true, project: VLA_auxiliary}
slurm: {gres: "gpu:1", cpus: 8, memory: 96G, time: "48:00:00"}
