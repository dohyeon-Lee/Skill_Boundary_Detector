stage1_common: true
stage1_component: Terminator
mode: pt
run: {suffix: ""}
warm_start: {predictor_checkpoint: "", terminator_checkpoint: ""}

# Term6: termination-only baseline with top view, goal XYZ, and proprio history.
fsq_terminator:
  termination: true
  progress: false
  context: proprio
  cameras: top
  default_arch: fusion
  vision_backbone: DINO
  freeze_vision_encoder: true
  goal_xyz: true
  goal_noise_max_m: 0.01
  skill_skip: false
  proprio_history: {enabled: true, length: 20, dim: 128, layers: 2, heads: 4}
  agent_patch_align_weight: 0.1
  wrist_patch_align_weight: 0.0
  patch_align_target_sigma: 0.7
termination_loss: {target_sigma: 2.0, positive_weight: 2.0}
skill_predictor: {train: false}

training:
  dataloader: {batch_size: 32, workers: 6, gpus: 1}
  optimizer: {base_lr: 2.5e-05, terminator_lr_scale: 1.0, predictor_lr_scale: 1.0, predictor_lora_lr_scale: 10.0, predictor_vlm_lr_scale: 1.0, grad_clip_norm: 1.0}
  gradient_checkpointing: false
  schedule: {steps: 100000, lr_mode: warmup_constant, warmup_steps: 2500, lr_decay_steps: 50000, log_every: 100, save_every: 10000}
logging:
  wandb: {enable: true, project: VLA_auxiliary}
slurm: {gres: "gpu:1", cpus: 8, memory: 96G, time: "48:00:00"}
