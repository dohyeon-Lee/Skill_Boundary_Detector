

# Exp0: 초기 구조. Expert 마지막에 cross-attention 1회, shared gradient, cond:uncond=1:0.5. Alpha 0.01에서 시작했지만 계속 고정. Terminator 동시 학습.

# Exp1: Exp0의 residual 최적화 개선. Wo zero-init, alpha 0.15 시작 및 0.1~0.2 bounded gate, gate weight decay 제외, residual 별도 clipping. Shared gradient, 1:0.5.

# Exp2: Exp1 구조에서 gradient routing만 분리. Conditional은 residual만, unconditional은 base VSA만 업데이트. 가중치는 1:1.

# Exp3: Exp2 설정에서 VLM residual은 language token만 읽고, skill predictor는 image+language를 유지. Same-skill batch 사용.

# Exp4-1: Exp2 설정에서 unconditional은 flow MSE, conditional은 chunk 전체 XYZ 누적 endpoint MSE로 학습.

# Exp4-2: Exp3 설정에 다른 task language negative를 추가. Current-skill 구간의 correct/wrong conditional error에 relative hinge ranking 적용.

# Exp5: Exp3 설정에서 VLM의 LLM과 vision tower를 모두 unfreeze. Skill predictor는 VLM을 read-only로 사용하고 reader/head만 업데이트.


