dataset_root: dataset_filtered
outputs_root: outputs_filtered

dataset:
  skillvla_root: skillvla_dataset
  source: libero_90_full_full
  run: FSQ333_dino_frozen_small_optimal_vsa_broadcast_150_std_pt_snap10_ms1_pmax15_halfnormal

warm_start:
  pi_base: models/pi05_base
  tokenizer: models/paligemma-3b-pt-224-tokenizer
  fsq: ""

cond:
  dino_model: models/dinov3-vitl16
  state_adarms: false

expert:
  source: pi05_base
  skill_cond_mode: broadcast

connections: {vlm_to_cond: false, cond_to_expert: true}
token_access: {image: true, language: true}

vlm_residual: {enabled: true, heads: auto, alpha_min: 0.1, alpha_max: 0.2, init_alpha: 0.15, zero_init_output: true, dropout: 0.0}
skill_predictor: {train: true, weight: 0.5, lr_scale: 1.0, all_layers: false}
freeze: {vlm_llm: true, vlm_vision: true, cond: false, cond_vision: false, expert: false, skill_reader: true, skill_head: true}

loss:
  conditional: {weight: 1.0}
  unconditional: {weight: 0.5, skill_start_weight: 1.0, skill_end_weight: 1.0}

terminator: {train: false, freeze_vision: true}
run: {suffix: "exp1_batchon"}

training:
  dataloader:
    batch_size: 16
    workers: 2
    gpus: 1
    same_skill_different_task: {enabled: true, grouped_fraction: 0.5, progress_temperature: 0.1}
  optimizer: {base_lr: 2.5e-05, cond_lr_scale: 1.0, expert_lr_scale: 1.0, terminator_lr_scale: 1.0}
  gradient_checkpointing: true # false
  schedule: {steps: 50000, save_every: 10000}

logging:
  param_drift: true
  wandb: {enable: true, project: VLA_stage0}

slurm: {gres: "gpu:1", cpus: 16, memory: 256G, time: "48:00:00"}
