# Episode-exact Stage-1 skill rollout:
#   GT actions | exact | exact with different noise | early | late
#
# Every model uses its own FSQ code space and token assignment. The report
# draws one linked codebook per model; clicking either side selects the same
# underlying GT skill occurrences in every space. GT segmentation boundaries
# must match, but numeric codes and FSQ checkpoints may differ.

outputs_root: outputs_filtered

model_defaults:
  previous: false
# Each model owns both its policy checkpoint and the terminator trained for
# that model's FSQ space. There is deliberately no top-level default.
models:
  - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_norm_action01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_arch0_skillendmask_visunfreeze
    checkpoint: "070000"
    label: action_unfrez_70k
    terminator_model: {label: DINO_unfrez, model_dir: bs32_FSQ333_norm_action01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_libero_90_full_firsthalf_scene_terminator_DINO_unfrez, checkpoint: "100000", end_threshold: 0.5}
  
  - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_norm_action01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_arch0_skillendmask_visfreeze
    checkpoint: "070000"
    label: action_frez_70k
    terminator_model: {label: DINO_unfrez, model_dir: bs32_FSQ333_norm_action01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_libero_90_full_firsthalf_scene_terminator_DINO_unfrez, checkpoint: "100000", end_threshold: 0.5}

  - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_zero01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_arch0_skillendmask_visunfreeze
    checkpoint: "070000"
    label: zero_unfrez_70k
    terminator_model: {label: DINO_unfrez, model_dir: bs32_FSQ333_zero01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_libero_90_full_firsthalf_scene_terminator_DINO_unfrez, checkpoint: "100000", end_threshold: 0.5}

  - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_zero01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_arch0_skillendmask_visfreeze
    checkpoint: "070000"
    label: zero_frez_70k
    terminator_model: {label: DINO_unfrez, model_dir: bs32_FSQ333_zero01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_libero_90_full_firsthalf_scene_terminator_DINO_unfrez, checkpoint: "100000", end_threshold: 0.5}
output_name: "action_zero_70k"


main_terminator:
  max_skill_length_scale: 1.50
  finish_action_chunk_on_end: false

resume: false

target_task: libero_90
task_ids: [3, 4, 5]

# Exact simulator states are mandatory; no approximate LIBERO init-state
# fallback is used.
episode_exact: true
episodes_per_task: 5
episode_selection: first     # first | random
episode_ids: []              # optional exact global dataset episode ids
seed: 42

time_shift_offset: 15
n_action_steps: 5
eval_num_gpus: 10

video: {frame_stride: 2, fps: 10}

original_dataset_dir: libero_original_dataset/libero_90
slurm: {gres: "gpu:1", cpus: 8, memory: 64G, time: "00:30:00"}
