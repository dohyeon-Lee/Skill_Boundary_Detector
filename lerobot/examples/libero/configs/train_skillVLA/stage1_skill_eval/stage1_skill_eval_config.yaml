model_defaults:
  previous: false
  checkpoint: "100000"
models:
  - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_pos_pos_LR6_raw_withEntH_1000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_arch0_skillendmask
    label: skill_broadcast
  - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_pos_pos_LR6_raw_withEntH_1000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_arch0_skillendmask_visfrez
    label: skill_broadcast_DINOfreeze
output_name: "vision_freeze"

main_terminator:
  # Base budget per occurrence: ceil(GT action length L * scale). The early
  # branch additionally receives time_shift_offset steps.
  max_skill_length_scale: 1.50
  finish_action_chunk_on_end: false

terminator_model:
  label: image_only
  variant: image_only      # state_image | image_only
  group: skillVLA_terminator
  model_dir: bs256_libero_90_full_firsthalf_scene_FSQ333_pos_pos_LR6_raw_withEntH_1000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_terminator
  checkpoint: "020000"
  end_mode: termination      # termination | progress | or | and
  end_threshold: 0.5
  progress_threshold: 0.95

resume: false

target_task: libero_90
task_ids: [3,4,5]

# Episode-exact is mandatory for this evaluator and cannot fall back to a
# language-matched or standard LIBERO init state.
episode_exact: true
episodes_per_task: 5
episode_selection: first     # first | random
episode_ids: []              # optional exact global dataset episode ids
seed: 42

# Policy branches start at frame_start-offset, frame_start, frame_start+offset.
time_shift_offset: 15
n_action_steps: 5

# Selected skill occurrences are distributed over this many one-GPU Slurm
# array workers. The resolver caps it to policy count x selected episode count.
eval_num_gpus: 50

video:
  frame_stride: 2
  fps: 10

# Explicit for auditability. The resolver checks that every scene/demo named by
# eval_init_states.npz exists here.
original_dataset_dir: libero_original_dataset/libero_90

slurm: {gres: "gpu:1", cpus: 8, memory: 64G, time: "12:00:00"}


# This trained terminator is display-only unless main_terminator selects it too.
# A direct `path:` is also accepted instead of group/model_dir/checkpoint.
