#   # Optional per model: outputs_root: outputs
#   # Omitted entries use outputs_root from the snapshotted global config.
#   - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_norm_action01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_arch0_skillendmask_visfreeze
#     label: visfreeze
#     external_terminator_model: bs32_FSQ333_norm_action01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_libero_90_full_firsthalf_scene_terminator_DINO_unfrez

#   - model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_norm_action01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_arch0_skillendmask_visunfreeze
#     label: visunfreeze
#     external_terminator_model: bs32_FSQ333_norm_action01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_libero_90_full_firsthalf_scene_terminator_DINO_unfrez

# output_name: "exact_noise_trajectory_overlay_visfreez_vs_visunfreez_all_code"

model_defaults:
  previous: false
  checkpoint: "100000"
  advance_mode: gt           # external | original | own | gt

models:
  - model_dir: bs32_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_relabeled_85k_arch0_skill_chunk_skillendmask_visfreeze
    label: arch0_skill_chunk

  - model_dir: bs32_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_relabeled_85k_arch0_skill_skillendmask_visfreeze
    label: arch0_skill

episode_exact: true
# LIBERO: restore the source-demo world/frame directly.
# LangGap: use eval_init_states.npz, reset to the matched episode init state,
# then replay dataset actions up to each selected skill start.
output_name: "FSQ333_contrastive_relabeled"
neighbor_code_probe: neighbor_and_opposite      # off | neighbor | neighbor_and_opposite | all
# true: additionally evaluate the trained auxiliary skill-flow path and write
# skill_only.html beside the ordinary main-path index.html. Supported by
# arch0_skill, arch0_skill_chunk, and arch0_2_skill_chunk checkpoints.
skill_only_rollout_probe: true


