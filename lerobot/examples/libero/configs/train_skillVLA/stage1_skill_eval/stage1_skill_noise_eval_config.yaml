model_defaults:
  previous: false
  checkpoint: "100000"
  advance_mode: gt           # external | original | own | gt

models:
  - model_dir: bs32_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_relabeled_85k_arch0_skill_skillendmask_visfreeze
    label: arch0_skill
  
  - model_dir: bs32_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_relabeled_85k_arch0_skill_chunk_skillendmask_visfreeze
    label: arch0_skill_chunk

  - model_dir: bs32_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_relabeled_85k_arch0_2_skill_chunk_skillendmask_zbest5k1m2_visfreeze_lab
    label: arch0_2_skill_chunk_z

  - model_dir: bs32_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_relabeled_85k_arch0_skill_chunk_skillendmask_zbest5k1m2_visfreeze_lab
    label: arch0_skill_chunk_z

  - model_dir: bs32_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_relabeled_85k_arch0_skill_skillendmask_zbest5k1m2_visfreeze_lab
    label: arch0_skill_z

episode_exact: true
# LIBERO: restore the source-demo world/frame directly.
# LangGap: use eval_init_states.npz, reset to the matched episode init state,
# then replay dataset actions up to each selected skill start.
output_name: "FSQ333_relabeled_zbestofN_and_normal"
neighbor_code_probe: off      # off | neighbor | neighbor_and_opposite | all
# true: additionally evaluate the trained auxiliary skill-flow path and write
# skill_only.html beside the ordinary main-path index.html. Supported by
# arch0_skill, arch0_skill_chunk, and arch0_2_skill_chunk checkpoints.
skill_only_rollout_probe: true


eval_num_gpus: 3
eval_max_workers_per_gpu: 4

resume: false

terminator: {end_mode: termination, end_threshold: 0.5, progress_threshold: 0.95}
# advance_mode: gt loads no terminator and stops each rollout only at
# ceil(GT skill length * max_skill_length_scale).
main_terminator: {max_skill_length_scale: 1.30, finish_action_chunk_on_end: false}

target_task: libero_90
# task_ids: [1, 3, 5] #, 7, 9]
task_ids: [3, 4, 5]
# true: source demo XML + exact frame state.
# false: reproducible seed-generated fixture layout + selected frame state.


# Example: 2 exact environments per task x 25 stochastic rollouts for every
# skill occurrence. "both" still means 25 paired samples, not 25 x 25.
envs_per_task: 1
noise_rollouts_per_env: 25
# noise: vary FM initial noise; hold mode z fixed when the checkpoint has z
# latent: hold FM noise fixed; vary mode z
# both: vary FM noise and mode z together once per rollout index
# Checkpoints without mode z automatically use noise for latent/both.
rollout_randomization: both          # noise | latent | both
# off: assigned code only
# neighbor: assigned + every Manhattan-distance-1 code (FSQ333: 4--7 total)
# neighbor_and_opposite: assigned + local neighbors + the antipodal code and
#   its one-hop shell (FSQ333 corner: 1+3+4; exact center uses all
#   8 equally farthest corners because no symmetric subset of 6 exists)
# all: every code in the model's codebook (FSQ333: 27 total)
# Legacy true/false remain accepted as neighbor/off.
episode_selection: first           # first | random
episode_ids: []                    # optional exact global dataset episode ids
seed: 42

n_action_steps: 10
trajectory_stride: 1               # keep every Nth projected trajectory point


original_dataset_dir: libero_original_dataset/libero_90
slurm: {gres: "gpu:1", cpus: 8, memory: 64G, time: "12:00:00"}
