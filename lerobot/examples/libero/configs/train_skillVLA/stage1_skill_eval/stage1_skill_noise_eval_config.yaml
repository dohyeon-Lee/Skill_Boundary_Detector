# Exact-start noise robustness visualization.
#
# For every selected task/environment/GT skill, run the same policy skill code
# repeatedly with independent policy noise. No MP4 is written: the report draws
# all end-effector trajectories over the exact skill-start camera image.
# Relabeled skill metadata is inherited from each model checkpoint exactly as
# in stage1_skill_eval_config; no separate dataset selector is needed here.

# model_defaults:
