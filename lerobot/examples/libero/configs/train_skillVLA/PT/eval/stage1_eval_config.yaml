
model_defaults:
  # Multiple checkpoints: [10000, 20000, 50000] or ["010000", "020000", "050000"].
  # Applies to every model; models[].checkpoint can override the same ordered list.
  # Sweep lines: checkpoint_success_rates.png + checkpoint_task_success_rates/<model>.png.
  # Previous Direct layer9 sweep:
  # checkpoint: [10000,20000,30000,40000,50000,60000,70000,80000,90000,100000]
  # checkpoint: "100000"  # Bspline 3 first/last: PT 100k ONLY
  checkpoint: "100000"  # All four UV Bspline models: PT 100k ONLY
  skill_source: gt           # gt | own | external
  # auto uses a trained UV head whenever own/external predictor has one;
  # otherwise it retains the exact demonstration focus used historically.
  focus_source: gt                 # auto | gt | predictor
  # No Predictor: VSA uses GT skill/UV; Newterm7 separately uses GT skill-end XYZ.
  pose_source: gt           # auto | gt | predictor
  advance_mode: external           # gt | own | external | original
  terminator_variant: state_image  # state_image | image_only
  end_mode: ""                     # termination | progress | or | and; blank => terminator.end_mode
  # All models below use the same external Newterm7 Terminator at 100k.
  external_terminator_checkpoint: "100000"
  # Random samples one z per skill. Oracle selects hindsight z from the exact
  # demonstration at its first chunk, over the full skill, or per action chunk.
  # Previous sweep used latent_source: oracle (canonical models use random).
  latent_source: random             # random | oracle
  oracle_latent_target: full_skill  # start_chunk | full_skill | per_chunk
  oracle_latent_grid_size: 5        # sampled z + a grid_size x grid_size grid
  oracle_latent_timesteps: 2        # fixed FM scoring points per candidate

models:

  # UV Fullskill Bspline: shared lastlayer + lastvis routing, all at PT 100k.
  - model_dir: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_fov_new_UV_fullskill_bspline_3_lastlayer_lastvis_current_vlast9_dinoS_lab
    label: UV_bspline_3_current
    external_terminator_model: bs32_FSQ333_contrastive_2000_pt_grounded_fov_new_libero_90_full_full_terminator_Term_Token_6
    end_threshold: 0.5

  - model_dir: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_fov_new_UV_fullskill_bspline_3_lastlayer_lastvis_current_preskill_vlast9_dinoS_lab
    label: UV_bspline_3_current_preskill
    external_terminator_model: bs32_FSQ333_contrastive_2000_pt_grounded_fov_new_libero_90_full_full_terminator_Term_Token_6
    end_threshold: 0.5

  - model_dir: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_fov_new_UV_fullskill_bspline_3_lastlayer_lastvis_current_diffaux_vlast9_dinoS_lab
    label: UV_bspline_3_current_diffaux
    external_terminator_model: bs32_FSQ333_contrastive_2000_pt_grounded_fov_new_libero_90_full_full_terminator_Term_Token_6
    end_threshold: 0.5

  - model_dir: bs16_libero_90_full_full_FSQ333_contrastive_2000_pt_grounded_fov_new_UV_fullskill_bspline_3_lastlayer_lastvis_current_preskill_diffaux_vlast9_dinoS_lab
    label: UV_bspline_3_current_preskill_diffaux
    external_terminator_model: bs32_FSQ333_contrastive_2000_pt_grounded_fov_new_libero_90_full_full_terminator_Term_Token_6
