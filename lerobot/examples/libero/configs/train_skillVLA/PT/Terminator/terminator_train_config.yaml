stage1_common: true
stage1_component: Terminator
mode: pt  # pt | ft
run: {suffix: ""}
warm_start:
  # PT only: initialize the standalone Terminator from the Terminator embedded
  # in the FSQ.pt selected by stage1_common_config.yaml's dataset.run.
  fsq_terminator: false
  # FT only: resume the corresponding standalone Stage-1 component checkpoint.
  predictor_checkpoint: ""
  terminator_checkpoint: ""
fsq_terminator:
  # Newterm1: skill only; Newterm2: + current proprio; Newterm3: + proprio history (20).
  # Newterm4: current proprio + skill-start proprio tokens (no history or start jitter).
  # Newterm5: current proprio + skill-end XYZ (uniform +/-0.01 m goal noise).
  # Newterm6: Newterm5 + skill-start proprio token.
  # Newterm7: skill-start proprio + end XYZ; no current proprio token.
  # Newterm8: skill-start proprio only; no current proprio or end XYZ.
  # Newterm9: skill-end XYZ only (+/-0.01 m goal noise); no current/start proprio.
  # Term_Token_1 = Newterm8; Term_Token_2 = Newterm9 (identical contracts, separate run names).
  # Term_Token_3: skill + start proprio + Top UV; Term_Token_4: skill + Top UV.
  # Term_Token_5 = Newterm1 (skill only); Term_Token_6 = Newterm7 (start proprio + XYZ).
  # Append _both to any Term_Token_1~6 for Top + Wrist instead of Top only.
  # UV goals: uniform +/-0.01 m per XYZ axis FIRST, then recorded Top-camera projection.
  # No UV-space jitter; current/past-skill conditions use their own canonical endpoint XYZ.
  # Newterm3_masked: Newterm3 + padding masks; reset history on every skill transition.
  # All: frozen top DINO, skill skip ON, no start jitter / visual auxiliary.
  # Original term1~24 and term22_skip remain selectable.
  # architecture: Term_Token_2  # Term_Token_1~6[_both]; historical Newterm names remain valid.
  # To train independently/concurrently on ONE GPU, replace the scalar above:
  architecture: [Term_Token_5_both, Term_Token_6_both]
  # Batch size/workers apply PER MODEL. Slurm cpus/memory are TOTALS (not auto-multiplied).
termination_loss: {target_sigma: 1.0, positive_weight: 2.0, post_end_steps: 10}
# Previous experiments: termination_loss: {target_sigma: 2.0, positive_weight: 2.0}
skill_predictor: {train: false}

training:
  dataloader: {batch_size: 32, workers: 24, gpus: 1, prefetch_factor: 2, pin_memory: true, persistent_workers: true}
  optimizer: {base_lr: 2.5e-05, terminator_lr_scale: 1.0, predictor_lr_scale: 1.0, predictor_lora_lr_scale: 10.0, predictor_vlm_lr_scale: 1.0, grad_clip_norm: 1.0}
  gradient_checkpointing: false
  schedule: {steps: 100000, lr_mode: warmup_constant, warmup_steps: 2500, lr_decay_steps: 50000, log_every: 100, save_every: 10000}
logging:
  wandb: {enable: true, project: VLA_auxiliary}
slurm: {gres: "gpu:1", cpus: 32, memory: 96G, time: "24:00:00"}
