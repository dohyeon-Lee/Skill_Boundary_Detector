stage1_common: true
stage1_component: VSA
run:
  suffix: base
vision:
  dino_model: models/dinov3-vits16
  image_size: 224
  freeze: false
architecture:
  name: UV_Bspline_denoising_dualbottleneck_pi05vlm_9_9_last
  end_pose_mode: xyz
  expert_variant: gemma_300m
  attention_backend: eager
  max_state_dim: 32
  max_action_dim: 32
  chunk_size: 10
  visual_bottleneck_tokens: 100
  visual_bridge_last_n_layers: 9
  spatial_loss_weight: 0.1
mask_actions_after_skill_end: true
cumulative_xyz_loss:
  enabled: false
  weight: 0.5
skill_flow:
  weight: 1.0
  chunk_multiplier: 3
  latent_best_of_n:
    enabled: false
    candidates: 5
    top_k: 1
    timesteps: 2
    ranking: main
    fp32: true
action_conditioning:
  training_skill_source: gt
bspline:
  tokens: 30
  weight: 1.0
execution:
  action_steps: 5
training:
  keep_checkpoints: 2
  protect_checkpoints:
  - 50000
  - 100000
  dataloader:
    batch_size: 16
    workers: 8
    prefetch_factor: 4
    gpus: 1
  optimizer:
    base_lr: 2.5e-05
    dino_lr_scale: 1.0
    muon: false
  gradient_checkpointing:
    action_expert: false
    skill_planner: false
    vlm: false
    vision: false
  schedule:
    steps: 100000
    lr_mode: warmup_constant
    warmup_steps: 1000
    log_every: 100
    save_every: 10000
  vsa_debug:
    every: 0
    initial: []
logging:
  wandb:
    enable: true
    project: VLA_stage1
slurm:
  gres: gpu:1
  cpus: 16
  memory: 256G
  time: '48:00:00'

# Last-only visual bridges at Expert L9/L18; keep the 9+9 split.
# Per-job resource override, independent of the global training profile.
train_qos: pro6000_qos
train_partition:
  - asus_pro6000
  - gigabyte_pro6000
