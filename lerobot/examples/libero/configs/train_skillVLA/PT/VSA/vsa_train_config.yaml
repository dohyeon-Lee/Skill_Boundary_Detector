stage1_common: true
stage1_component: VSA

run: {suffix: "dinoS_base"}
warm_start:
  predictor_checkpoint: ""

vision:
  dino_model: models/dinov3-vits16
  image_size: 224
  freeze: false

  foveation:
    enabled: false                   # arch8/arch13: false for the original agent view
    mode: partial_fov
    crop_size: 128
    output_size: 224
    inner_box: {enabled: true, mode: blur, size: 32, line_width: 3}
    shape: square
    sharp_size: 48
    feather: 20
    peripheral_mode: blur              # blur | black (partial_fov only); black uses a hard sharp_size boundary
    blur_radius: 8.0
    randomization:
      enabled: false
      color:
        enabled: false
        brightness: [0.8, 1.2]
        contrast: [0.8, 1.2]
        saturation: [0.8, 1.2]
        hue: [-0.3, 0.3]
      crop:
        enabled: true
        offset_px: [-24, 24]
        inner_box_offset_px: [-4, 4]
      blur:
        enabled: false
        blur_radius: [0.0, 4.0]

architecture:
  # Available: arch0/1/2/3/4/5/6/7/8_1/8_2/9_1/9_2/10_1/10_2/11_1/11_2/12_1/12_2/13/14/15/16/17/18
  # (+ arch16_align/17_align/18_align, arch18_align_norm) and their _skill/_skill_chunk variants;
  # plus wristonly_1/wristonly_2/both_1/both_2/both_3/both_4/both_5 and
  # wristonly_lit_1/2/3/4/5, both_lit_1/2/3/4/4_dedicated/5/6/7.
  # Arch8_1: Arch7 XYZ head + skill-end UV fed to Cond AdaRMS; requires foveation.enabled=false.
  # Arch8_2 adds an independent termination head on the final Cond-Gemma hidden.
  # Arch9_1: wrist-only VSA; Cond skill AdaRMS + Expert skill-end EEF AdaRMS.
  # Arch9_2 adds the Arch8_2-style final-Cond termination head to Arch9_1.
  # Arch10_1 is Arch9_1 without skill conditioning on Cond: Cond gets proprio
  # only; Expert still gets skill broadcast + skill-end EEF AdaRMS.
  # Arch10_2 adds the same final-Cond termination head to Arch10_1.
  # Arch11_1: Cond gets proprio + skill + end pose; Expert gets skill + end pose.
  # Arch11_2 adds the final-Cond termination head.
  # Arch12_1: Cond matches Arch11, but Expert gets skill only (no end pose).
  # Arch12_2 adds the final-Cond termination head.
  # Arch13 reverses Arch8_1's spatial direction: skill-end EEF XYZ enters
  # Cond AdaRMS and the final recurrent bottleneck predicts focus UV.
  # Arch14 = Arch13 + the same skill-end EEF pose in the Action Expert AdaRMS (Arch11-style),
  # so it conditions BOTH the deployed route and the skill-only route. Same data/vision rules as
  # Arch13 (agent view, foveation.enabled=false, UV aux via spatial_loss_weight);
  # end_pose_mode: xyz|pose applies to the Cond and Expert inputs alike.
  # Arch15 = Arch14 + the skill in the Cond-Gemma AdaRMS (same projection as Arch9/Arch11), so the
  # visual reader is skill-aware. Expert side and skill-only route are identical to Arch14.
  # Arch16 = Arch11_1 whose Expert goal is the SKILL DISPLACEMENT (skill-end xyz - skill-start xyz)
  # instead of the absolute skill-end xyz; Cond-Gemma still gets the absolute goal. No UV head.
  # The start xyz is the jitter-consistent skill_start_state at training and the proprio latched
  # at the skill switch at eval (never predicted). Reaches both the deployed and skill-only route.
  # Arch17 = Arch16 + current proprio in the AdaRMS of the terminal bridge Expert layer(s) only,
  # so the skill-only route (which exits before them) is unaffected.
  # Arch18 = Arch17 whose Expert gets skill-start xyz and skill-end xyz as TWO absolute inputs
  # (instead of their difference), so the bridge-layer proprio can interact with both.
  # Arch16--Arch18: wrist-only, foveation.enabled=false, end_pose_mode: xyz only, spatial_loss_weight ignored.
  # Arch16_align/Arch17_align/Arch18_align = the same three plus a TRAINING-ONLY head that must
  # name which of the 14x14 wrist patches holds the skill-end EEF, to keep the vision encoder
  # spatially grounded. The target is geometry (the camera is bolted to the gripper), so no data
  # regeneration is needed, and frames whose goal is out of view, behind the camera or inside the
  # gripper's own patch carry no loss. Inference is identical to the base label; only the
  # checkpoint differs, hence their own revision. These DO read spatial_loss_weight (as the head's
  # weight, default 0.1); the loss is divided by ln(196), so ~1.0 means "not learned yet".
  # Arch18_align_norm = Arch18_align whose goal xyz (the absolute skill-start and skill-end xyz
  # the Expert reads, and the skill-end xyz in Cond) is quantile-normalized with observation.state's
  # OWN q01/q99, so the conditioning stops mixing raw metres with normalized proprio. The bounds
  # are read from the dataset's meta/stats.json and stored in the policy config, so evaluation --
  # including a predictor supplying the goal in metres -- applies the same conversion with no extra
  # setup. The wrist patch target still uses raw metres: it is camera geometry.
  # Arch19 = Arch15 whose Expert goal is the SKILL DISPLACEMENT (Arch16-style); Cond keeps Arch15's
  # proprio + absolute skill-end xyz + skill, and the UV head stays.
  # Arch20 = Arch15 without any Expert goal (Expert: skill only) = Arch13 + skill in Cond.
  # WristOnly_2 reserves 1/100 bottleneck query for wrist patch alignment and uses the other 99
  # for action vision. Both_2 reserves one camera-specific query per top/wrist target and uses 98
  # action queries. The partitions never self-attend together; each align route reaches the Expert
  # only through its own zero-initialized gate. Notion's 0.01 denotes one query out of 100,
  # not the spatial-loss weight.
  # Both_3 keeps Both_2's dedicated 1+1+98 split, but uses skill-start/end XYZ and current
  # proprio in the Action Expert terminal bridge; Cond-Gemma also receives skill-end XYZ.
  # Fullskill_1 = Both_3, but both dedicated patch heads target the CURRENT chunk-end EEF
  # projected into the CURRENT camera frames (new target every timestep), not the skill end.
  # It retains canonical full-skill flow, skill-start/end XYZ inputs and the shared action head.
  # Fullskill_2 keeps the same 1+1+98 interface but has NO visual auxiliary loss/readout computation.
  # Both_4 = Both_3 without skill-end XYZ in Cond-Gemma (Expert conditioning is unchanged).
  # Both_5 = Both_3 conditioning with Both_1-style shared alignment: all 100 bottleneck queries
  # drive the action route and the training-only top/wrist patch heads pool those same queries.
  # *_lit_* uses the final 100 bottleneck latents alone to predict the normalized grounded
  # chunk-end state [EEF XYZ3, axis-angle3, gripper2] with fixed MSE weight 0.3. Expert inputs are:
  #   _lit_1 = skill + start/end XYZ + terminal-bridge proprio
  #   _lit_2 = skill + start/end XYZ
  #   _lit_3 = skill + end XYZ
  #   _lit_4 = _lit_1 + skill-end XYZ in Cond-Gemma AdaRMS
  #   _lit_5 = _lit_4 without terminal-bridge proprio (LIT_2 + Cond-Gemma end XYZ)
  #   both_lit_6 = both_lit_5 with current proprio only in Cond-Gemma
  #                (skill + start/end XYZ remain Action-Expert inputs)
  #   both_lit_7 = both_lit_5 with the chunk-end state decoder replaced by two
  #                dedicated skill-end patch queries (top 1/100 + wrist 1/100);
  #                the remaining 98/100 queries drive the action route.
  #   both_lit_4_dedicated = both_lit_4 with its 8D chunk-end state head restricted to two
  #                dedicated top/wrist queries (1+1+98 split); the dedicated
  #                queries reach the Expert through a zero-initialized gate.
  # Cond-Gemma AdaRMS: LIT1--3 = proprio+skill, LIT4--5/LIT7/LIT4_dedicated =
  # proprio+skill+end XYZ, LIT6 = proprio only.
  # WristOnly reads wrist; Both reads top+wrist. Auxiliary heads are unused at inference.
  # Arch19/Arch20 follow the Arch13 rules (agent view, foveation.enabled=false, UV aux via
  # spatial_loss_weight); end_pose_mode: xyz only.
  # For Arch9--Arch12 set foveation.enabled=false and
  # set end_pose_mode: xyz|pose (XYZ+axis-angle, no gripper).
  # spatial_loss_weight below is ignored by Arch9--Arch12; termination_loss is
  # accepted only by the _2 variants.
  name: fullskill_bspline_2_firstlayer
  # name: fullskill_bspline_2_firstlayer  # late: skill + start/end XYZ + current proprio
  # name: fullskill_bspline_3_firstlayer  # late: current proprio only (plus vision/plan)
  # name: fullskill_bspline_4_firstlayer  # late: vision/plan only
  # name: fullskill_bspline_2_lastlayer   # same as 2_firstlayer; start vision at last prefix layer
  # name: fullskill_bspline_3_lastlayer   # same as 3_firstlayer; start vision at last prefix layer
  # name: fullskill_bspline_4_lastlayer   # same as 4_firstlayer; start vision at last prefix layer
  # Bspline: firstlayer=L1; lastlayer=L(18-visual_bridge_last_n_layers), e.g. L9 for 9+9.
  # name: fullskill_vis_1_lastlayer
  # name: fullskill_vis_2_firstlayer
  # name: fullskill_vis_2_lastlayer
  # The following notes describe fullskill_vis_* (not the Bspline variants above).
  # vis_1 = Both_LIT_7 (no direct current proprio in Expert).
  # vis_2 = Both3 (direct current proprio enters ONLY Expert L18).
  # firstlayer / lastlayer places the separate Start bridge at Expert L1 / L17.
  # Shared DINO/Cond/bottleneck generator; fixed skill-start final bottleneck
  # is read by that one prefix layer; live current vision enters L18 as before.
  # Start observations use the same causal jitter draw as skill-start XYZ.
  # Canonical full-skill loss + shared norm/action head for all four models.
  # Start/Current bridges both read action 98 + separately gated patch 2 tokens.
  # Separate reader/gate weights; shared patch heads supervise BOTH observations.
  # Patch objective = 0.5 * (current top+wrist loss + start top+wrist loss).
  # Start wrist targets use raw start EEF pose; invalid/out-of-view targets are masked.
  # name: fullskill_1  # Fullskill_1 in Notion; also accepts ./submit_train.sh fullskill_1
  # name: fullskill_2  # Same full-skill model without visual auxiliary loss
  # Residual experiments: residual_patch_1 / 2 / 3 / 4 / 5 / 6.
  # Or keep this config unchanged and submit: ./submit_train.sh residual_patch_1
  # Direct experiments: direct_patch_1 / 2 / 3 / 4 / 5 / 6 (shared action head).
  # Or keep this config unchanged and submit: ./submit_train.sh direct_patch_1
  # Append _dGD to any of the 12 variants to block action gradients into the
  # 4H base/shared norm/head: direct_patch_1_dGD / residual_patch_1_dGD, ... 6_dGD.
  # The existing names keep attached gradients; no separate YAML toggle needed.
  # They fix the base horizon to past H + current H + future 2H (4H total),
  # use loss-only skill-boundary masking. Residual uses a separate zero-init head;
  # Direct reuses the same action head for base and last-layer predictions.
  end_pose_mode: xyz
  expert_variant: gemma_300m
  attention_backend: eager  # eager | sdpa; Cond (start + current) AND Expert; sdpa adds _sdpa to run name
  max_state_dim: 32
  max_action_dim: 32
  chunk_size: 10
  visual_bottleneck_tokens: 100
  visual_bridge_last_n_layers: 9  # Direct/Residual/Bspline: 1=17+1, 9=9+9; range 1..17.
  # Bspline plans are made after the prefix (18-N) layers and read once before the first late layer.
  # Non-1 adds _layerN for Direct/Residual, _vlastN for Bspline. Start vision still enters L1 only.
  spatial_loss_weight: 0.1         # Patch-alignment loss weight (shared or dedicated Both/Wrist variants)

# For arch8_2/arch9_2/arch10_2/arch11_2/arch12_2 (recommended values shown):
# termination_loss: {loss_weight: 0.1, target_sigma: 2.0, positive_weight: 2.0}

mask_actions_after_skill_end: true
cumulative_xyz_loss: {enabled: false, weight: 0.5}
skill_flow:
  weight: 1.0
  chunk_multiplier: 3
  checkpoint_layers: 0  # final N skill-flow/prefix layers; capped at the selected prefix depth
  latent_best_of_n: {enabled: false, candidates: 5, top_k: 1, timesteps: 2, ranking: main, fp32: true}
action_conditioning: {training_skill_source: gt}
# Only fullskill_bspline_*: 30 normalized-time samples of the entire selected
# skill's grounded pose6 + gripper2. Independent of chunk_multiplier above.
# Queries are made at the selected Expert split, supervised by MSE, and read once by the late route.
bspline: {tokens: 30, weight: 1.0}
execution: {action_steps: 5}

training:
  dataloader: {batch_size: 32, workers: 16, gpus: 1}
  optimizer: {base_lr: 2.5e-05, dino_lr_scale: 1.0, muon: false}
  gradient_checkpointing: false
  schedule: {steps: 200000, lr_mode: warmup_constant, warmup_steps: 1000, log_every: 100, save_every: 10000}
  vsa_debug: {every: 5000, initial: [1, 100, 1000]}

logging:
  wandb: {enable: true, project: VLA_stage1}
slurm: {gres: "gpu:1", cpus: 24, memory: 128G, time: "24:00:00"}
