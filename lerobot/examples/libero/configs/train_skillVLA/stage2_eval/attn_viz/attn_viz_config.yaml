# Stage-2 VLM attention heatmap (attn_viz) — PURE attention mask only.
# Renders, per skill-start frame, the VLM's LANGUAGE → 3rd-person IMAGE attention: for each language
# word, the attention over the image patches reshaped to the patch grid and overlaid on the frame.
# (project_root / outputs_root come from configs/global_config.yaml.)

# ── Which trained Stage-2 run to visualize (folder name as created by training) ──
model_dir: libero_90_full_full_FSQ555_dino8_wow_imgX_500_siglip_unfreeze_015000_unfreeze_state_skill_cum_all_ac_actvlm
checkpoint: "050000"        # "last" or a step number

# ── Heatmap ──
n_samples: 3                # skill-start frames to render
attn_layers: last        # "rollout" (end-to-end flow, MOST faithful) | "last" | "all" | "mid" | comma ints
attn_weighting: value       # "value" = value-weighted A·‖V‖ (sharper) | "attn" = raw  (ignored if rollout)
seed: 1000

# ── Slurm (partition/qos/nodelist/exclude come from configs/global_config.yaml) ──
eval_gres: gpu:1
eval_cpus_per_task: 8
eval_mem: 32G
eval_time: "1:00:00"
