# VSA ≡ stage1 open-loop forward-equivalence 테스트 (sbatch 제출).
#
# 같은 obs/state/skill + 같은 noise를 stage2 VSA(skill_vla, VLM 절단 + 어댑터 OFF)와 stage1(skill_expert)
# 두 forward에 주입해 액션 chunk를 수치 비교. weight·input이 같으니 CROSS≈SELF & CROSS≪NOISE-SENS면
# 두 forward는 같은 함수 → 영상 차이는 순전히 노이즈+closed-loop 카오스 탓임이 확정된다.
# 제출: ./submit_verify.sh   (stage1 부모는 아래 체크포인트 config.json의 stage1_checkpoint_path에서 자동)

# ── 평가할 stage2 모델 (skillVLA_stage2 아래 폴더명) ──
model_dir: FSQ555_dino8_both_1000_siglip_015000_state__s2_Lttr8lr10sv50
checkpoint: "020000"

# ── 테스트 입력 ──
source: synthetic          # synthetic(권장; 동일 랜덤텐서 → 순수 forward 동치) | dataset(실제 obs)
raw_dataset_dir: ""        # source=dataset일 때 LeRobotDataset root (빈칸 → ckpt config에서 자동 유도)
codes: "0,31,62,93,124"    # 스윕할 skill 코드 (양쪽에 동일 주입)
num_steps: 10              # flow-matching 적분 스텝 (양쪽 강제 동일)
dtype: fp32 # asis                # asis(체크포인트 dtype) | fp32(양쪽 float32 강제 → bf16 반올림 제거해 구조적 차이 격리)

# ── Slurm (partition/qos/nodelist/exclude는 configs/global_config.yaml에서 자동) ──
verify_gres: gpu:1
verify_cpus_per_task: 8
verify_mem: 32G
verify_time: "0:20:00"
