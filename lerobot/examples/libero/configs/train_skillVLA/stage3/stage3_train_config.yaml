# Stage-3 trains only: skill_lora + skill_reader + skill_head.
# Every component inherited from the parent checkpoint stays frozen.

warm_start:
  stage: stage0 # stage0 | stage2
  run: FSQ333_dino_frozen_small_optimal_vsa_broadcast_150_std_pt_snap10_ms1_pmax15_uniform_exp0_FSQ_statecond
  # run: FSQ865_dino_frozen_small_optimal_vsa_broadcast_150_std_pt_snap10_ms1_pmax15_uniform_exp0_FSQ_statecond
  # run: FSQ333_dino_frozen_small_optimal_vsa_state_skill_125_std_pt_snap10_ms1_pmax15_uniform_exp0_FSQ_statecond
  checkpoint: "030000" # last | step

dataset: {skillvla_root: skillvla_dataset}

objective:
  action_grounding: false # false: skill regression | true: frozen-motor grounding
  skill_loss: {weight: 1, deadzone_frac: 0.8} # null = inherit from parent

skill_path: {lora_lr_scale: 10.0}

terminator: {train: false, lr_scale: 1.0, target_sigma: 1.0, end_weight: 1.0}
run: {name: "", suffix: "bs12"} # blank name = automatic

training:
  dataloader: {batch_size: 12, workers: 4, gpus: 1}
  optimizer: {base_lr: 2.5e-05}
  schedule: {steps: 30000, save_every: 5000}

logging:
  param_drift: true
  wandb: {enable: true, project: VLA_stage3}

slurm: {gres: "gpu:1", cpus: 16, memory: 128G, time: "48:00:00"}
