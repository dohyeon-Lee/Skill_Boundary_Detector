# SkillVLA stage-3 PRE-TRAINING (PT).
#
# Trains a `skill_vla` policy on the build_data skillvla dataset, initialized from
# pi05_base, with the FROZEN FSQ end decoder. (FT is a separate, later config.)
#
# Roots come from ../build_data/train_skillVLA_config.yaml; FSQ levels/codebook are
# auto-read from FSQ.pt by the model. Output:
#   {project_root}/skillVLA_outputs/PT_{source_dataset}_{run_tag}_batch{N}[_{exp}]/

# ── Which skillvla dataset to train on ────────────────────────
# Just the dataset name + its sub-folder. Resolves to:
#   {project_root}/libero_dataset/skillvla_dataset/{source_dataset}/{run_tag}/
#   (→ skillvla/ + FSQ.pt + dino.npz, built by configs/train_skillVLA/build_data)
source_dataset: libero_90                                   # e.g. libero_90, libero_90_00to20_10
run_tag: FSQ555_pg8_dino_only_image128_1000                 # the sub-folder name
skill_decoder_state_indices: "[0,1,2,3,4,5,6]"              # raw state dims fed to the FSQ decoder
image_key: observation.images.image

# ── Model init ────────────────────────────────────────────────
pi_base: lerobot/pi05_base
image_model_path: /data2/dohyeon/SBD/models/dinov3-vits16   # DINO repo/dir for the FSQ decoder
skillvla_outputs_root: skillVLA_outputs                      # under {project_root}/

# ── Optimization ──────────────────────────────────────────────
batch_size: 16
num_workers: 4
num_gpus: 1
lr_base: 2.5e-05         # effective lr = lr_base * num_gpus
steps: 100000
save_freq: 5000

# ── SkillVLA losses / conditioning ────────────────────────────
skill_predictor_loss_weight: 1.0
skill_boundary_random_p: 10          # simulated end-signal timing jitter (0 disables)
skill_decoder_end_threshold: 0.5
use_fsq_latent_suffix: true
# (inference_skill_max_length is an eval-only knob → lives in skillVLA_eval_config.yaml)
# Independent VLM-gradient gates (see modeling_skillVLA): both False → both train the VLM.
detach_action_prefix_grad: false
detach_sp_prefix: false

# ── Run naming ────────────────────────────────────────────────
exp: ""                  # optional suffix → PT_{source}_{run_tag}_batch{N}_{exp}

# ── wandb ─────────────────────────────────────────────────────
wandb_enable: true
wandb_project: VLA_posttrain

# ── Slurm ─────────────────────────────────────────────────────
train_partition:
  - debug
train_qos: big_qos
train_gres: gpu:1
train_cpus_per_task: 16
train_mem: 128G
train_time: "48:00:00"
train_nodelist: node01
train_exclude_nodes: []
