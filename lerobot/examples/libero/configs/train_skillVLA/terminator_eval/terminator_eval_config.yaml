#     checkpoint: "050000"

# output_name: "norm_action_visunfreeze"

model:
  previous: false
  model_dir: bs32_libero_90_full_firsthalf_scene_FSQ333_zero01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_arch0_skillendmask_visunfreeze
  checkpoint: "030000"
  label: norm_action
  terminator_source: external # own | external

external_skill_model:
  variant: state_image
  group: skillVLA_terminator
  model_dir: bs32_FSQ333_zero01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_libero_90_full_firsthalf_scene_terminator_DINO_unfrez
  checkpoint: "050000"

terminator_models:
  - label: RESNET_unfreeze
    variant: state_image
    model_dir: bs32_FSQ333_zero01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_libero_90_full_firsthalf_scene_terminator_resnet_unfrez
    checkpoint: "050000"
  - label: DINO_unfreeze
    variant: state_image
    model_dir: bs32_FSQ333_zero01_recon_only__jsON_routeON_loss_2000_std_pt_episodemean_100p_snap10_pmax15_halfnormal_libero_90_full_firsthalf_scene_terminator_DINO_unfrez
    checkpoint: "050000"

output_name: "zero_visunfreeze"

resume: true

target_task: libero_90
task_ids: [0, 3]

# Episode-exact is mandatory for this evaluator and cannot fall back to a
# language-matched or standard LIBERO init state.
episode_exact: true
episodes_per_task: 3
episode_selection: first     # first | random
episode_ids: []              # optional exact global dataset episode ids
seed: 42

# Policy branches start at frame_start-offset, frame_start, frame_start+offset.
time_shift_offset: 15
n_action_steps: 5

# Selected skill occurrences are distributed over this many one-GPU Slurm
# array workers. The resolver caps it to the number of selected episodes.
eval_num_gpus: 10

terminator:
  end_mode: termination               # termination | progress | or | and
  # Each termination bar freezes at its first crossing of this threshold.
  end_threshold: 0.5
  progress_threshold: 0.95
  max_skill_length: 200
  # true preserves the fixed-replanning behavior: a detected boundary stops
  # only after the already-generated action chunk has been consumed.
  finish_action_chunk_on_end: true

video:
  frame_stride: 2
  fps: 10

# Explicit for auditability. The resolver checks that every scene/demo named by
# eval_init_states.npz exists here.
original_dataset_dir: libero_original_dataset/libero_90

slurm: {gres: "gpu:1", cpus: 8, memory: 64G, time: "00:30:00"}
