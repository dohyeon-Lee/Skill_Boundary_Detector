<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIBERO · ABC power=0.5 SBD comparison</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: light-dark(#f4f6fa, #090d18);
      --foreground: light-dark(#172033, #e5e7eb);
      --surface: light-dark(#ffffff, #111827);
      --muted: light-dark(#64748b, #94a3b8);
      --border: light-dark(#d7deea, #293449);
      --primary: light-dark(#1d4ed8, #60a5fa);
      --primary-foreground: light-dark(#ffffff, #08111f);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden; background: var(--background); color: var(--foreground);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    header {
      height: 58px; display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 9px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .subtitle { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .controls { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    button, a {
      min-height: 34px; border: 1px solid var(--border); border-radius: 7px;
      background: var(--surface); color: var(--foreground); padding: 6px 10px;
      font: inherit; font-size: 12px; text-decoration: none; cursor: pointer;
    }
    button:hover, a:hover { border-color: var(--primary); }
    button[aria-pressed="true"] {
      background: var(--primary); color: var(--primary-foreground); border-color: var(--primary);
    }
    main {
      height: calc(100vh - 58px); display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: var(--border);
    }
    main.libero-focus { grid-template-columns: minmax(0, 3fr) minmax(300px, 1fr); }
    main.abc-focus { grid-template-columns: minmax(300px, 1fr) minmax(0, 3fr); }
    section {
      min-width: 0; display: grid; grid-template-rows: 34px minmax(0, 1fr); background: var(--surface);
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 0 10px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600;
    }
    .panel-head span:last-child { color: var(--muted); font-weight: 400; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--surface); }
    @media (max-width: 840px) {
      body { overflow: auto; } header { height: auto; align-items: flex-start; }
      main, main.libero-focus, main.abc-focus { height: auto; grid-template-columns: 1fr; }
      section { height: 80vh; } .subtitle { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>ABC power=0.5 · global-mean SBD comparison</h1>
      <div class="subtitle">LIBERO 기존 power=2 · ABC power=0.5로 고저차 압축 후 global mean 적용</div>
    </div>
    <nav class="controls" aria-label="비교 레이아웃">
      <button type="button" data-layout="equal" aria-pressed="true">50 : 50</button>
      <button type="button" data-layout="libero" aria-pressed="false">LIBERO 크게</button>
      <button type="button" data-layout="abc" aria-pressed="false">ABC 크게</button>
      <a href="../../libero/libero_90_full_full/built_ck010000_tasks0_9_20ep/index.html" target="_blank" rel="noopener">LIBERO 새 탭</a>
      <a href="../../abc/abc_sim_all/power0p5_globalmean_ck010000/index.html" target="_blank" rel="noopener">ABC 새 탭</a>
    </nav>
  </header>
  <main id="comparison">
    <section aria-label="LIBERO standard SBD report">
      <div class="panel-head"><span>LIBERO · power=2</span><span>tasks 0–9 · 20 episodes/task</span></div>
      <iframe title="LIBERO standard SBD report" src="../../libero/libero_90_full_full/built_ck010000_tasks0_9_20ep/index.html"></iframe>
    </section>
    <section aria-label="ABC power=0.5 SBD report">
      <div class="panel-head"><span>ABC · power=0.5</span><span>tasks 59–82 · 5 episodes/task</span></div>
      <iframe title="ABC power=0.5 SBD report" src="../../abc/abc_sim_all/power0p5_globalmean_ck010000/index.html"></iframe>
    </section>
  </main>
  <script>
    const comparison = document.getElementById("comparison");
    const buttons = [...document.querySelectorAll("button[data-layout]")];
    const classes = { equal: "", libero: "libero-focus", abc: "abc-focus" };
    function setLayout(layout) {
      comparison.className = classes[layout] || "";
      for (const button of buttons) button.setAttribute("aria-pressed", String(button.dataset.layout === layout));
      try { localStorage.setItem("skill-boundary-power0p5-together-layout", layout); } catch (_) {}
    }
    for (const button of buttons) button.addEventListener("click", () => setLayout(button.dataset.layout));
    let saved = "equal";
    try { saved = localStorage.getItem("skill-boundary-power0p5-together-layout") || "equal"; } catch (_) {}
    setLayout(saved);
  </script>
</body>
</html>
