# ABC-130k selective download config  (edit this, then run ./run.sh)
#
# Run:
#   ./run.sh --list-tasks     # list task names
#   ./run.sh --dry-run        # plan only (no download)
#   ./run.sh                  # actually download (+ convert if convert_to_abcdl:true)
# --------------------------------------------------------------------------
# XDOF/ABC-130k is laid out flat by task:
#     data/{train,val}/<task_name>/episode_<uuid>/episode.mcap [+ annotation.mcap]
# There is NO category folder on the Hub. The 7 groups below are the OFFICIAL
# primitive categories from the paper's Appendix A "ABC-130K Task Taxonomy":
#     Pick-and-Place(67) / Fine Pick-and-Place(39) / Folding(36) /
#     Insertion-Ejection(19) / Tool Use(16) / Sorting(8) / Tying-Untying(10)   [paper task counts]
# NOTE: the paper publishes category definitions + counts but NOT the full
# per-task table, so task->group here is a best-effort reconstruction from the
# definitions. Insertion(19) & Sorting(8) match exactly; Folding/Tool/Tying are
# within +/-1; the Pick-and-Place <-> Fine-Pick-and-Place boundary is the least
# certain (paper gives few "Fine" examples) — re-bucket freely.
# All 197 train-split task folders are listed. Discover/verify names with:
#     ./run.sh --list-tasks
# --------------------------------------------------------------------------

repo_id: XDOF/ABC-130k
split: train                 # default split for entries that don't override it
out_dir: ../abc_subset        # raw .mcap lands here (mirrors the repo layout)
group_subdirs: true          # true -> nest as out_dir/<group>/data/<split>/<task>/... (grouped by category)
# token: hf_xxx              # optional; else uses `huggingface-cli login` / $HF_TOKEN
include_meta: false          # also grab meta/*.txt + README.md

# --- parallelism / speed ---
max_workers: 8               # concurrent file downloads + episode listings (bump for more speed)
hf_transfer: true            # Rust hf_transfer backend for faster large files (uv pip install hf_transfer)

# --- optional abcdl conversion after download (yaml-gated) ---
convert_to_abcdl: false      # true -> run mcap_to_abcdl on each downloaded episode
abcdl_out_dir: ../abc_abcdl   # where converted abcdl episode dirs go
size: 224                    # square resolution for the abcdl re-encode


# --- what to actually download ---
# Each entry: exactly one of {group | task | tasks:[...]}, plus `episodes`.
#   episodes: N        -> first N episodes PER TASK (sorted by uuid, deterministic)
#   episodes: all      -> every episode of the task
#   episodes: [0,1,2]  -> those indices
#   episodes: [<uuid substring>, ...]  -> episodes matching those uuids
# `split:` may be added per-entry to override the top-level default.
downloads:
  - group: pick_and_place
    episodes: 1              
  - group: fine_pick_and_place
    episodes: 1          
  - group: tool_use
    episodes: 1              
  - group: insertion_ejection
    episodes: 1                  
  - group: sorting
    episodes: 1   
  - group: tying_untying
    episodes: 1   
  - group: folding
    episodes: 1   
  # - task: arrange_the_flowers_into_the_vase
  #   episodes: 3

